<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>搭配速记 PETS3</title>
<style>
:root{
  --ink:#14181d; --ink-2:#4a545f; --ink-3:#7c8894;
  --paper:#f4f1ec; --card:#fffefb; --line:#ddd7cd;
  --accent:#0f5c52; --accent-soft:#e2ece9; --accent-mid:#5f9186;
  --warn:#a8541c; --warn-soft:#f6e9de;
  --good:#2f6b3a; --good-soft:#e6f0e8;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px -12px rgba(20,24,29,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eceae4; --ink-2:#a8b0b8; --ink-3:#77818b;
    --paper:#14181b; --card:#1c2124; --line:#2e3538;
    --accent:#5ec2ad; --accent-soft:#1d332e; --accent-mid:#3f7a6e;
    --warn:#e0a170; --warn-soft:#35271c;
    --good:#7dc08a; --good-soft:#1c2f21;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ink:#eceae4; --ink-2:#a8b0b8; --ink-3:#77818b;
  --paper:#14181b; --card:#1c2124; --line:#2e3538;
  --accent:#5ec2ad; --accent-soft:#1d332e; --accent-mid:#3f7a6e;
  --warn:#e0a170; --warn-soft:#35271c;
  --good:#7dc08a; --good-soft:#1c2f21;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,"Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  margin:0; padding:24px 18px 64px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.wrap>*{min-width:0;max-width:100%}

header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-width:0}
h1{font-family:Georgia,"Noto Serif",serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.01em}
.countdown{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12.5px;color:var(--ink-2);
  background:var(--accent-soft);border-radius:999px;padding:4px 11px;white-space:nowrap}
.countdown b{color:var(--accent);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}

.stat{min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:ui-monospace,"Roboto Mono",monospace;font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .v small{font-size:12px;color:var(--ink-3)}

nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
nav button{font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);transition:.15s}
nav button:hover{border-color:var(--accent);color:var(--accent)}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:26px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.meta{display:flex;justify-content:space-between;font-family:ui-monospace,"Roboto Mono",monospace;
  font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.pill{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 7px}
.prompt{font-size:24px;line-height:1.4;text-wrap:balance}
.answer{font-family:Georgia,"Noto Serif",serif;font-size:29px;line-height:1.3;color:var(--accent);
  text-wrap:balance;word-break:break-word}
.answer.long{font-size:22px;line-height:1.45}
.answer.hidden{visibility:hidden}
.hint{color:var(--ink-3);font-size:13px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;padding:11px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);flex:1;min-width:120px;transition:.15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.btn.no{color:var(--warn);border-color:var(--warn)}
.btn.yes{color:var(--good);border-color:var(--good)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{font:inherit;font-family:Georgia,"Noto Serif",serif;font-size:19px;text-align:left;padding:12px 15px;
  border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt .gloss{display:block;font-family:system-ui,sans-serif;font-size:13px;color:var(--ink-3);margin-top:3px}

.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.how{border-left:2px solid var(--accent);padding-left:14px;color:var(--ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.how b{color:var(--ink);font-weight:600}

.list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:60vh;overflow-y:auto}
.row{display:flex;gap:12px;padding:9px 13px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.row:last-child{border-bottom:none}
.row .e{font-family:Georgia,"Noto Serif",serif;font-size:16px;flex:1 1 55%}
.row .c{color:var(--ink-2);flex:1 1 45%;font-size:13px}
.row .b{font-family:ui-monospace,"Roboto Mono",monospace;font-size:10px;color:var(--ink-3);flex:0 0 26px;text-align:right}

.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:12.5px;color:var(--ink-3);margin-bottom:-8px}
.row.dim .e,.row.dim .c{color:var(--ink-3)}
.star{color:var(--accent);font-style:normal;font-size:11px;margin-right:5px;vertical-align:1px}
footer{color:var(--ink-3);font-size:12px;text-align:center}
kbd{font-family:ui-monospace,"Roboto Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:10px 13px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{font:inherit;font-size:12.5px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer}
.cfg{display:flex;flex-direction:column;gap:16px;justify-content:flex-start}
.cfg .field{display:flex;flex-direction:column;gap:6px}
.cfg label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.cfg input{font:inherit;font-size:15px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);width:100%}
.cfg input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cfg .note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.cfg .status{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;color:var(--ink-2);
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all}
.cfg .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.cfg .kv:last-of-type{border-bottom:none}
.cfg .kv b{font-weight:500;font-family:ui-monospace,"Roboto Mono",monospace}
.linkish{background:none;border:none;color:var(--ink-3);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}

.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2px}
.subnav button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2)}
.subnav button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.glist button{font:inherit;text-align:left;background:var(--card);border:none;cursor:pointer;
  padding:13px 14px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.glist button:hover{background:var(--accent-soft)}
.glist .gname{flex:1;font-size:15px}
.glist .gpart{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px}
.glist .gnum{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.glist .gbar{width:56px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:0 0 56px}
.glist .gbar i{display:block;height:100%;background:var(--accent)}
.doc{display:flex;flex-direction:column;gap:18px}
.doc h3{font-family:Georgia,"Noto Serif",serif;font-size:17px;margin:0;font-weight:600;color:var(--ink)}
.doc .warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.doc .task{font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;line-height:1.5}
.step{display:flex;flex-direction:column;gap:4px;padding-left:13px;border-left:2px solid var(--line)}
.step .seg{font-size:11px;letter-spacing:.07em;color:var(--accent);font-weight:600}
.step .what{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.step .sample{font-family:Georgia,"Noto Serif",serif;font-size:14.5px;color:var(--ink);
  background:var(--paper);border-radius:7px;padding:8px 11px;white-space:pre-line;line-height:1.5}
.mline{display:flex;flex-direction:column;gap:3px}
.mline .tag{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.mline .en{font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.55;white-space:pre-line}
.swaps{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.swaprow{background:var(--card);padding:10px 13px;display:flex;flex-direction:column;gap:3px}
.swaprow .from{font-family:Georgia,"Noto Serif",serif;font-size:13px;color:var(--ink-3);text-decoration:line-through}
.swaprow .to{font-family:Georgia,"Noto Serif",serif;font-size:15.5px;color:var(--ink)}
.swaprow .zh{font-size:12px;color:var(--ink-3)}
.backline{display:flex;justify-content:space-between;align-items:center;gap:12px}

body{padding-bottom:92px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  gap:2px;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 20px -14px rgba(0,0,0,.5)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font:inherit;font-size:12px;background:none;border:none;color:var(--ink-3);
  padding:8px 2px;border-radius:11px;cursor:pointer;transition:.15s}
.tabbar button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;
  border-radius:99px;background:var(--warn);color:var(--card);font-size:10.5px;line-height:17px;
  text-align:center;padding:0 4px;font-family:ui-monospace,"Roboto Mono",monospace}
.glist .gbar{position:relative;background:var(--line)}
.glist .gbar i{position:absolute;left:0;top:0;height:100%}
.glist .gbar i.seen{background:var(--accent-mid)}
.glist .gbar i.done{background:var(--accent)}
.glist .gnum b{color:var(--accent);font-weight:500}
.glist .gnum em{color:var(--warn);font-style:normal}
.cfgblock{display:flex;flex-direction:column;gap:10px}

.calendar{display:flex;flex-direction:column;gap:10px}
.calhead{display:flex;justify-content:space-between;align-items:baseline}
.calhead .mon{font-family:Georgia,"Noto Serif",serif;font-size:17px}
.calhead .streak{font-size:12.5px;color:var(--ink-3)}
.calhead .streak b{color:var(--accent);font-family:ui-monospace,"Roboto Mono",monospace}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:10.5px;color:var(--ink-3);padding-bottom:2px}
.cell{position:relative;aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;border-radius:9px}
.cell.void{cursor:default}
.cell svg{width:100%;height:100%;display:block}
.cell .ring-bg{fill:none;stroke:var(--line);stroke-width:3.4}
.cell .ring{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%}
.cell .num{fill:var(--ink-2);font-size:13px;text-anchor:middle;
  font-family:ui-monospace,"Roboto Mono",monospace}
.cell.full .num{fill:var(--accent)}
.cell.today .num{fill:var(--ink);font-weight:600}
.cell.today{outline:1.5px solid var(--accent);outline-offset:-1px}
.cell .dot{fill:var(--warn)}
.cell.sel{background:var(--accent-soft)}
.cell.future{opacity:.4}
.callegend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.callegend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:4px;vertical-align:-1px}
.caldetail{font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;min-height:38px;display:flex;align-items:center}
.seg{display:grid;gap:6px}
.seg.quad{grid-template-columns:repeat(4,1fr)}
.seg.duo{grid-template-columns:repeat(2,1fr)}
.seg button{font:inherit;font-size:13.5px;padding:9px 6px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);min-width:0}
.seg.duo button{padding:11px 12px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg button small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;font-weight:400}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.quota{display:flex;align-items:center;gap:10px}
.quota input[type=range]{flex:1;accent-color:var(--accent)}
.quota .q{font-family:ui-monospace,"Roboto Mono",monospace;font-size:20px;color:var(--accent);
  min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.sect{display:flex;flex-direction:column;gap:12px}
.sect > h4{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.example{border-left:2px solid var(--accent-mid);padding-left:13px;display:flex;flex-direction:column;gap:4px}
.example .ex-en{font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-line}
.example .ex-zh{font-size:13px;color:var(--ink-3);line-height:1.5;white-space:pre-line}
.example .ex-tag{font-size:10px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}

/* --- app tuning --- */
body{padding:16px 14px 96px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{gap:16px}
.card{min-height:270px;padding:26px 20px}
.prompt{font-size:26px}
.answer{font-size:31px}
.btn{padding:15px 16px;font-size:16px}
.opt{padding:15px;font-size:20px}
nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:8px 14px}
.list{max-height:none}
</style>

</head>
<body>
<div class="wrap">
  <div id="banner" hidden></div>
  <header>
    <h1>搭配速记</h1>
    <span class="countdown">9月19日开考 · 还有 <b id="days">—</b> 天</span>
  </header>

  <div class="stats">
    <div class="stat"><span class="k">今日新学</span><span class="v" id="s-new">0<small>/33</small></span></div>
    <div class="stat"><span class="k">待复习</span><span class="v" id="s-due">0</span></div>
    <div class="stat"><span class="k">已过关</span><span class="v" id="s-done">0<small>/361</small></span></div>
  </div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>

  <nav id="tabs"></nav>

  <div id="stage"></div>

  <div class="how" id="globalhow">
    <span><b>用法</b>：看中文，先在心里默写英文，再翻面对答案。<b>不许只用眼睛扫</b>——想不出来才是有效的一次学习。</span>
    <span>按遗忘曲线复习：答对后隔 <b>当天 → 1 → 2 → 4 → 7 → 15 天</b> 再考你，答错的当场归零重来。</span>
    <span>新学完一批，切到「复习到期」当天再过一遍——这一遍最值钱。</span>
  </div>

</div>


<div class="tabbar" id="tabbar">
  <button data-sec="word" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a2 2 0 0 1 2 2V21H7a2 2 0 0 1-2-2z"/><path d="M9 9h6M9 13h6"/></svg>
    <span>单词</span>
  </button>
  <button data-sec="write" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19.2 8.8a2.7 2.7 0 0 0-3.8-3.8L4 16z"/><path d="M14.4 6.6l3 3"/></svg>
    <span>写作</span>
  </button>
  <button data-sec="hard" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/><path d="M12 8v4"/><path d="M12 15h.01"/></svg>
    <span>错题本</span><span class="badge" id="hardbadge" hidden>0</span>
  </button>
  <button data-sec="cfg" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2a7.4 7.4 0 0 1 14.4 0"/></svg>
    <span>我的</span>
  </button>

 had to call for help.", "我们在林子里迷了路，只好求助。"], "594": ["He lost himself in the book and forgot about supper.", "他看书入了迷，忘了吃晚饭。"], "600": ["They fell in love during their first year at college.", "他们在大学第一年相爱了。"], "604": ["You are lucky to get a seat on such a crowded train.", "这么挤的火车你能有座位真幸运。"], "607": ["No matter how hard it is, don't give up.", "无论多难，都别放弃。"], "608": ["It doesn't matter if you are a few minutes late.", "你晚几分钟没关系。"], "609": ["Taking this job means moving to another city.", "接受这份工作意味着要搬到另一个城市。"], "610": ["I meant to call you, but the meeting ran late.", "我本打算给你打电话，但会开晚了。"], "614": ["The school has taken measures to reduce food waste.", "学校已采取措施减少食物浪费。"], "615": ["Our plan met with strong support from the students.", "我们的计划得到了学生们的大力支持。"], "619": ["The park was built in memory of the local hero.", "这座公园是为纪念当地的英雄而建的。"], "620": ["He never mentioned the accident to his parents.", "他从没向父母提起过那场事故。"], "622": ["Someone messed up my desk while I was out.", "我不在时有人把我的桌子弄乱了。"], "630": ["Keep in mind that the office closes at five.", "记住办公室五点关门。"], "631": ["She changed her mind at the last minute.", "她在最后一刻改了主意。"], "633": ["He made up his mind to study abroad.", "他下定决心要出国留学。"], "635": ["Would you mind if I opened the window?", "我开一下窗你介意吗？"], "636": ["Do you mind my sitting here?", "你介意我坐这儿吗？"], "637": ["Never mind — we can try again tomorrow.", "没关系，我们明天可以再试。"], "638": ["Please wait here; the doctor will see you in a minute.", "请在这儿等，医生马上就来。"], "643": ["I missed seeing the ending because I fell asleep.", "我睡着了，没看到结局。"], "646": ["I took his umbrella by mistake.", "我错拿了他的伞。"], "647": ["I mistook her for her sister at first.", "我一开始把她错当成了她姐姐。"], "648": ["I always mix up these two words.", "我总是把这两个词弄混。"], "653": ["She is not available at the moment.", "她此刻不在。"], "654": ["He stopped for a moment to catch his breath.", "他停了一会儿喘口气。"], "655": ["For the moment, let's leave the question open.", "暂时先把这个问题放着。"], "657": ["The moment I saw her face, I knew something was wrong.", "我一看到她的脸就知道出事了。"], "660": ["The teacher was in a good mood this morning.", "老师今天早上心情不错。"], "663": ["The two plans are more or less the same.", "这两个方案差不多一样。"], "664": ["More than two hundred people attended the lecture.", "两百多人参加了讲座。"], "665": ["He said no more and walked out of the room.", "他没再多说，走出了房间。"], "666": ["The whole trip cost no more than three hundred yuan.", "整趟行程只花了三百元。"], "667": ["The essay should be not more than five hundred words.", "这篇文章不应超过五百词。"], "668": ["Could you say that once more, please?", "能请你再说一遍吗？"], "669": ["The more you practise, the more confident you become.", "你练得越多，就越自信。"], "670": ["The hotel is cheap; what is more, it is close to the station.", "这家旅馆便宜，更重要的是离车站近。"], "671": ["The repair will take three days at most.", "这次维修最多三天。"], "672": ["We should make the most of the last two weeks.", "我们应该充分利用最后这两周。"], "677": ["Let's move on to the next question.", "我们继续下一个问题。"], "680": ["She earns twice as much as she did five years ago.", "她赚的是五年前的两倍。"], "690": ["It is natural to feel nervous before an interview.", "面试前紧张是很正常的。"], "693": ["He is by nature a quiet and careful person.", "他天生是个安静细心的人。"], "696": ["It is necessary for us to book the tickets in advance.", "我们有必要提前订票。"], "699": ["Call me if necessary; I will be at home all evening.", "如果需要就给我打电话，我整晚都在家。"], "702": ["We need you to be there before nine.", "我们需要你九点前到那里。"], "703": ["The bathroom window needs cleaning.", "浴室窗户需要擦一擦了。"], "704": ["There is no need for you to apologize.", "你没必要道歉。"], "705": ["The old library is badly in need of repair.", "这座老图书馆急需修缮。"], "706": ["The new timetable better meets the students' needs.", "新的时间表更能满足学生的需要。"], "709": ["Neither the teacher nor the students knew the answer.", "老师和学生都不知道答案。"], "711": ["She is a little nervous about the coming interview.", "她对即将到来的面试有点紧张。"], "714": ["I am new to this city and still get lost sometimes.", "我刚到这座城市，有时还会迷路。"], "722": ["He apologized to her the next day.", "他第二天向她道了歉。"], "723": ["The bookshop is right next to the post office.", "书店就紧挨着邮局。"], "728": ["It is very nice of you to help me move.", "你帮我搬家真是太好了。"], "732": ["There is no telling what he will do next.", "没法说他接下来会做什么。"], "735": ["Please don't make a noise; the baby is sleeping.", "请别出声，宝宝在睡觉。"], "739": ["Traffic returned to normal after the accident was cleared.", "事故清理后交通恢复了正常。"], "743": ["What matters is not the price but the quality.", "重要的不是价格而是质量。"], "744": ["Let me make a note of your phone number.", "让我把你的电话号码记下来。"], "745": ["She takes notes carefully in every class.", "她每节课都认真记笔记。"], "747": ["He noted down the address on the back of a ticket.", "他把地址记在了票的背面。"], "749": ["They repaired my bike for nothing.", "他们免费给我修了自行车。"], "750": ["The delay had nothing to do with our department.", "这次延误和我们部门无关。"], "751": ["He has eaten nothing but bread all day.", "他一整天只吃了面包。"], "752": ["The film is nothing like the book.", "这部电影和原著完全不像。"], "754": ["Nobody took notice of the small sign on the door.", "没人注意到门上那个小牌子。"], "755": ["I noticed him leave the room quietly.", "我注意到他悄悄离开了房间。"], "756": ["She noticed a stranger standing outside the gate.", "她注意到一个陌生人站在门外。"], "757": ["We still meet for coffee every now and then.", "我们偶尔还会一起喝杯咖啡。"], "759": ["From now on, I will get up half an hour earlier.", "从现在起我要早起半小时。"], "760": ["He was here just now — he can't have gone far.", "他刚才还在这儿，走不远的。"], "761": ["Now that you are here, let's start the meeting.", "既然你来了，我们就开始开会吧。"], "762": ["Up to now, no one has complained about the service.", "到目前为止，没有人抱怨过服务。"], "765": ["In my opinion, the second plan is more practical.", "在我看来，第二个方案更实际。"], "769": ["She spoke slowly in order that everyone could follow.", "她说得很慢，以便大家都能跟上。"], "770": ["He got up early in order to catch the first bus.", "他早起是为了赶上头班车。"], "771": ["The lift has been out of order for two days.", "电梯坏了两天了。"], "773": ["The captain ordered his men to stay where they were.", "队长命令手下待在原地。"], "780": ["You ought to see a doctor about that cough.", "你那个咳嗽应该去看看医生。"], "785": ["There were books all over the floor.", "地板上到处都是书。"], "787": ["She read the letter over and over again.", "她把那封信反复看了又看。"], "788": ["At last he has a room of his own.", "他终于有了一间属于自己的房间。"], "789": ["She finished the whole project on her own.", "她独自完成了整个项目。"], "803": ["Over sixty students took part in the speech contest.", "六十多名学生参加了演讲比赛。"], "804": ["He could not bear to part with his old bicycle.", "他舍不得丢掉那辆旧自行车。"], "805": ["She is very particular about how her coffee is made.", "她对咖啡怎么做非常讲究。"], "806": ["I enjoyed the trip, and the food in particular.", "这次旅行我很喜欢，尤其是那里的食物。"], "809": ["His grandfather passed away peacefully last spring.", "他祖父去年春天安详地去世了。"], "811": ["The train passes through three provinces on the way.", "这趟火车沿途穿过三个省。"], "815": ["Could you pass on this message to the manager?", "你能把这条口信转达给经理吗？"], "816": ["The teacher passed out the exam papers one by one.", "老师一张张地发试卷。"], "817": ["You have to be patient with beginners.", "对初学者你得有耐心。"], "820": ["I paid twenty yuan for this notebook.", "这个笔记本我花了二十元。"], "825": ["\"Could you show me the way?\" \"With pleasure.\"", "\"能给我指个路吗？\"\"非常乐意。\""], "826": ["There is plenty of time before the train leaves.", "离开车还有充足的时间。"], "828": ["There is no point in arguing about it now.", "现在争这个没有意义。"], "831": ["She pointed out two mistakes in my report.", "她指出了我报告里的两处错误。"], "834": ["I am poor at drawing, but I enjoy it.", "我不擅长画画，但我喜欢。"], "836": ["The new teacher is popular with her students.", "这位新老师很受学生欢迎。"], "837": ["It is possible for beginners to finish the course in a month.", "初学者一个月内学完这门课是有可能的。"], "839": ["Please reply as soon as possible.", "请尽快回复。"], "840": ["If possible, I would like a seat by the window.", "如果可能的话，我想要靠窗的座位。"], "850": ["It is time to put these ideas into practice.", "该把这些想法付诸实践了。"], "851": ["She practises speaking English with her roommate every evening.", "她每晚和室友练英语口语。"], "852": ["The manager praised her for handling the problem so well.", "经理称赞她把问题处理得很好。"], "853": ["I prefer to walk rather than take the bus.", "比起坐公交，我更愿意走路。"], "854": ["She prefers reading to watching television.", "比起看电视，她更喜欢读书。"], "856": ["They are making preparations for the sports meeting.", "他们正在为运动会做准备。"], "858": ["We are preparing to move into the new office next week.", "我们正准备下周搬进新办公室。"], "861": ["All the members were present at yesterday's meeting.", "所有成员都出席了昨天的会议。"], "863": ["He pretended to be asleep when his mother came in.", "妈妈进来时他假装睡着了。"], "864": ["Heavy fog prevented the plane from taking off.", "大雾使飞机无法起飞。"], "867": ["She takes great pride in her students' progress.", "她为学生的进步感到非常自豪。"], "872": ["I had problems understanding his accent at first.", "一开始我听懂他的口音有困难。"], "874": ["You have made great progress in the past month.", "过去一个月你进步很大。"], "875": ["He broke his promise and did not come.", "他违背了承诺，没有来。"], "877": ["She always keeps her promise, however busy she is.", "不管多忙她总是信守承诺。"], "878": ["He promised to return the book by Friday.", "他答应周五前还书。"], "880": ["A thick coat protects you against the cold wind.", "厚外套能帮你挡住冷风。"], "881": ["These trees protect the village from sandstorms.", "这些树保护村子免受沙尘暴侵袭。"], "882": ["His parents are very proud of his achievements.", "他父母为他的成绩感到骄傲。"], "884": ["The school provides free lunch for all the students.", "学校为所有学生提供免费午餐。"], "885": ["The company provided us with all the necessary tools.", "公司为我们提供了所有必要的工具。"], "888": ["He is too shy to speak in public.", "他太害羞了，不敢当众讲话。"], "894": ["I don't think she did it on purpose.", "我认为她不是故意的。"], "899": ["Let's put aside the small details for now.", "我们先把这些小细节放一放。"], "900": ["Please put away your books before you leave.", "离开前请把书收好。"], "w1": ["I am writing to apply for the position of part-time English tutor.", "我写信是为了申请英语兼职家教这个职位。"], "w2": ["I am writing to inquire about the summer courses in your college.", "我写信是想咨询贵院暑期课程的情况。"], "w3": ["I am writing to express my thanks for your kind help last week.", "我写信是为了感谢你上周的热心帮助。"], "w4": ["I am writing to complain about the poor service in your restaurant.", "我写信是想投诉贵餐厅的服务质量。"], " const ALL = DATA.concat(EXTRA).sort((a,b)=>a.i-b.i);
const EXAM = new Date(2026,8,19);
const DAY = 864e5;
const KEY = "pets3-collocations-v1";
const STEPS = [0,1,2,4,7,15];   // 答对第 n 次后隔几天再见：当天 / 1 / 2 / 4 / 7 / 15
const MASTER = 4;               // 连着答对 4 次算「熟」
const EXAM_T = Math.floor(new Date(2026,8,19)/864e5);

let st = load();
function load(){
  let s = null;
  try{ const r = localStorage.getItem(KEY); if(r) s = JSON.parse(r); }catch(e){}
  if(!s) s = {cards:{}, day0:today(), pairs:{}};
  if(!s.log) s.log = {};
  if(!s.cfg) s.cfg = {};
  if(typeof s.cfg.perDay !== "number" || !isFinite(s.cfg.perDay)) s.cfg.perDay = 33;
  s.cfg.perDay = Math.max(5, Math.min(200, Math.round(s.cfg.perDay)));
  if(s.cfg.scope !== "all" && s.cfg.scope !== "core") s.cfg.scope = "core";
  return s;
}
function perDay(){ return st.cfg.perDay; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function today(){ const d=new Date(); return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/DAY); }

const T = today();
document.getElementById("days").textContent =
  Math.max(0, Math.ceil((EXAM - new Date())/DAY));

function pool(){ return st.cfg.scope==="all" ? ALL : DATA; }
function unlearned(){ return pool().filter(c => !st.cards[c.i]); }
// 今天还能新学几条：额度减去今天已经学掉的，断更不累积
function quotaLeft(){ return Math.max(0, perDay() - todayLearned()); }
function newPool(){ const n = quotaLeft(); return n>0 ? unlearned().slice(0, n) : []; }
function dayEntry(k){
  const e = st.log[String(k)];
  if(!e) return null;
  if(e.wn===undefined){ e.wn = 0; e.wr = 0; }   // 迁移旧记录
  return e;
}
function todayLearned(){ const e = dayEntry(T); return e ? e.n : 0; }
function todayReviewed(){ const e = dayEntry(T); return e ? e.r : 0; }
function duePool(){
  return pool().filter(c => { const s=st.cards[c.i]; return s && s.due<=T; });
}
function hardPool(){
  // 错过两次以上、并且还没刷熟的：刷熟了就从错题本毕业，历史错误次数照旧保留
  return ALL.concat(typeof WRITING==="undefined"?[]:WRITING)
             .filter(c => { const s=st.cards[c.i]; return s && s.miss>=2 && s.box < MASTER; });
}
function hardEverCount(){
  return ALL.concat(typeof WRITING==="undefined"?[]:WRITING)
            .filter(c => { const s=st.cards[c.i]; return s && s.miss>=2; }).length;
}
function cardLabel(c){ return isWritingCard(c) ? ("写作 · "+c.g) : ("第 "+c.i+" 条"); }
function doneCount(){ return pool().filter(c=>{const s=st.cards[c.i];return s&&s.box>=MASTER;}).length; }

function clampDue(d){
  // 考前一天以后的复习没有意义，一律拉回考前
  return (EXAM_T - 1 > T && d > EXAM_T - 1) ? EXAM_T - 1 : d;
}
function isWritingCard(c){ return typeof c.i==="string" && c.i.charAt(0)==="w"; }
function logDay(isNew, isWriting){
  let e = st.log[String(T)];
  if(!e) e = st.log[String(T)] = {n:0, r:0, wn:0, wr:0};
  if(e.wn===undefined){ e.wn = 0; e.wr = 0; }
  if(isWriting){ if(isNew) e.wn++; else e.wr++; }
  else         { if(isNew) e.n++;  else e.r++;  }
}
function grade(c, ok){
  const fresh = !st.cards[c.i];
  const s = st.cards[c.i] || {box:0, miss:0, due:T};
  if(ok){ s.box = Math.min(STEPS.length, s.box+1); s.due = clampDue(T + STEPS[s.box-1]); }
  else { s.miss++; s.box = 0; s.due = T; }
  st.cards[c.i] = s;
  logDay(fresh, isWritingCard(c));
  save();
}

let mode="today", queue=[], relearn=[], flipped=false, cur=null;

function buildQueue(){
  relearn=[];
  if(mode==="today") queue = newPool();
  else if(mode==="review") queue = duePool();
  else if(mode==="hard") queue = hardPool();
  else if(mode==="pair") queue = shuffle(PAIRS.map((p,i)=>({p,i})));
  else if(mode==="write") queue = (wsub==="cards" && wgroup) ? writePool(wgroup) : [];
  else queue = [];                       // 「我的」「全表」这些页面没有卡，别留着上一页的残队列
  next();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function next(){
  flipped=false;
  if(queue.length) cur = queue.shift();
  else if(relearn.length) cur = relearn.shift();
  else cur = null;
  render();
}

const stage = document.getElementById("stage");

function stats(){
  const N = pool().length;
  document.getElementById("s-new").innerHTML = todayLearned()+"<small>/"+perDay()+"</small>";
  document.getElementById("s-due").textContent = duePool().length;
  const d = doneCount();
  document.getElementById("s-done").innerHTML = d+"<small>/"+N+"</small>";
  document.getElementById("bar").style.width = (100*d/N).toFixed(1)+"%";
}

function render(){
  stats();
  const hideChrome = (section !== "word");
  const statsEl = document.querySelector(".stats");
  const barEl = document.querySelector(".bar");
  if(statsEl) statsEl.hidden = hideChrome;
  if(barEl) barEl.hidden = hideChrome;
  const howEl = document.getElementById("globalhow");
  if(howEl) howEl.hidden = hideChrome;
  renderNav();
  if(mode==="cfg"){ renderMy(); return; }
  if(mode==="list"){ renderList(); return; }
  if(mode==="write"){ renderWrite(); return; }
  if(!cur){
    const EMPTY = {
      today:  unlearned().length===0
        ? ["这个范围全学完了。", "去「我的」把范围换成全部 900 组，或者专心刷复习和错题。"]
        : ["今天的额度用完了。", "还有 "+unlearned().length+" 条没学 —— 切到「复习到期」把今天学的当场再过一遍；真想加量就去「我的」调高每日新学量。"],
      review: ["没有到期要复习的。", "明天再来，或者去「今日新词」推进新的一批。今天新学的会在当天进这里等你回头再过一遍。"],
      hard:   hardPool().length===0
        ? ["错题本是空的。", "同一条答错两次以上会被收进来，刷熟（连对四次）之后自动毕业 —— 单词和写作句型都算。"]
        : ["这一轮过完了。", "还有 "+hardPool().length+" 条没毕业：连对四次才算刷熟，它们明后天还会回来。"],
      pair:   ["冠词对比过完了。", "再点一次「冠词对比」会重新洗牌。"]
    };
    const m = EMPTY[mode] || ["这一组清空了。", ""];
    stage.innerHTML =
      '<div class="card"><div class="prompt">'+m[0]+'</div>'+
      '<div class="hint">'+m[1]+'</div></div>';
    return; }

  if(mode==="pair"){ renderPair(); return; }

  renderCard(cur, cardLabel(cur));
}

function exampleBlock(id){
  const ex = EXAMPLES[String(id)];
  if(!ex) return '';
  return '<div class="example">'+
    '<span class="ex-tag">例句</span>'+
    '<span class="ex-en">'+esc(ex[0])+'</span>'+
    '<span class="ex-zh">'+esc(ex[1])+'</span>'+
  '</div>';
}

function renderCard(c, label){
  const s = st.cards[c.i];
  stage.innerHTML =
    '<div class="card">'+
      '<div class="meta"><span>'+esc(label)+'</span>'+
        (s&&s.miss>=2?'<span class="pill">错过 '+s.miss+' 次</span>':'<span>'+(queue.length+relearn.length)+' 张待过</span>')+
      '</div>'+
      '<div class="prompt">'+esc(c.zh)+'</div>'+
      '<div class="answer'+(c.en.length>26?' long':'')+(flipped?'':' hidden')+'">'+esc(c.en)+'</div>'+
      (flipped ? exampleBlock(c.i) : '')+
      (flipped
        ? '<div class="actions"><button class="btn no" data-a="0">没想起来</button><button class="btn yes" data-a="1">记住了</button></div>'
        : '<div class="actions"><button class="btn primary" data-a="flip">翻面看答案</button></div>')+
    '</div>';
}

function renderPair(){
  const {p} = cur;
  const opts = shuffle([[p.a,p.ag],[p.b,p.bg]]);
  const ask = Math.random()<.5 ? [p.a,p.ag] : [p.b,p.bg];
  cur.ask = ask;
  stage.innerHTML =
    '<div class="card">'+
      '<div class="meta"><span>冠词对比</span><span>'+queue.length+' 组待过</span></div>'+
      '<div class="prompt">哪个是「'+esc(ask[1])+'」？</div>'+
      '<div class="opts">'+opts.map(o=>
        '<button class="opt" data-en="'+esc(o[0])+'">'+esc(o[0])+'</button>').join('')+
      '</div>'+
    '</div>';
}

let listAll = (st.cfg.scope === "all");
function renderList(){
  const rows = listAll ? ALL : DATA;
  stage.innerHTML =
    '<div class="listhead">'+
      '<span>'+rows.length+' 条'+(listAll?'（全部 900 组，★ 为刷卡集）':'（刷卡集）')+'</span>'+
      '<button class="linkish" id="toggle-all">'+(listAll?'只看刷卡集':'显示全部 900 组')+'</button>'+
    '</div>'+
    '<div class="list">'+rows.map(c=>{
      const s=st.cards[c.i], core=!!coreSet[c.i];
      return '<div class="row'+(listAll&&!core?' dim':'')+'">'+
        '<span class="e">'+(listAll&&core?'<i class="star">★</i>':'')+esc(c.en)+'</span>'+
        '<span class="c">'+esc(c.zh)+'</span>'+
        '<span class="b">'+(!s?'':(s.box>=MASTER?'<b>熟</b>':'学过'))+'</span></div>';
    }).join('')+'</div>';
}
const coreSet = {};
DATA.forEach(c=>{ coreSet[c.i]=1; });

function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

stage.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="toggle-all"){ listAll = !listAll; render(); return; }
  if(b.dataset.a==="flip"){ flipped=true; render(); return; }
  if(b.dataset.a==="0"||b.dataset.a==="1"){
    const ok = b.dataset.a==="1";
    grade(cur, ok);
    if(!ok) relearn.push(cur);
    next(); return;
  }
  if(b.dataset.en!==undefined){
    if(document.querySelector(".opt.right")) { next(); return; }
    logDay(false, false); save();          // 冠词对比也算当天的一次复习
    const right = cur.ask[0];
    document.querySelectorAll(".opt").forEach(o=>{
      if(o.dataset.en===right) o.classList.add("right");
      else if(o===b) o.classList.add("wrong");
      o.insertAdjacentHTML("beforeend",
        '<span class="gloss">'+esc(o.dataset.en===cur.p.a?cur.p.ag:cur.p.bg)+'</span>');
    });
    if(b.dataset.en!==right) queue.push(cur);
  }
});

document.addEventListener("keydown", e=>{
  if(mode==="list"||mode==="pair"||mode==="cfg"||!cur) return;
  if(mode==="write" && !(wsub==="cards" && wgroup)) return;
  if(e.code==="Space"){ e.preventDefault(); if(!flipped){flipped=true;render();} }
  else if(e.key==="1"&&flipped){ grade(cur,false); relearn.push(cur); next(); }
  else if(e.key==="2"&&flipped){ grade(cur,true); next(); }
});

let section = "word";
const SECTIONS = {
  word:  {def:"today", subs:[["today","今日新词"],["review","复习到期"],["pair","冠词对比"],["list","全表"]]},
  write: {def:"write", subs:[]},
  hard:  {def:"hard",  subs:[]},

};

function renderNav(){
  const nav = document.getElementById("tabs");
  const subs = SECTIONS[section].subs;
  nav.hidden = subs.length === 0;
  nav.innerHTML = subs.map(s =>
    '<button data-mode="'+s[0]+'" aria-selected="'+(mode===s[0])+'">'+s[1]+'</button>').join('');
  document.querySelectorAll("#tabbar button").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.sec === section)));
  const badge = document.getElementById("hardbadge");
  if(badge){
    const n = hardPool().length;
    badge.textContent = n > 99 ? "99+" : n;

function goSection(sec){
  section = sec;
  mode = SECTIONS[sec].def;
  if(sec === "write"){ wsub = "cards"; wgroup = null; }
  buildQueue();
  renderNav();
}

document.getElementById("tabs").addEventListener("click", e=>{

document.getElementById("tabbar").addEventListener("click", e=>{

/* ---------- 写作模块 ---------- */
let wsub = "cards";
let wgroup = null;

function writeItems(g){ return WRITING.filter(w=>w.g===g); }
function writePool(g){
  const items = writeItems(g);
  const due = items.filter(w=>{ const s=st.cards[w.i]; return !s || s.due<=T; });
  return due.length ? due : items;
}
function writeDone(g){ return writeItems(g).filter(w=>{ const s=st.cards[w.i]; return s && s.box>=MASTER; }).length; }
function writeSeen(g){ return writeItems(g).filter(w=>!!st.cards[w.i]).length; }
function writeDue(g){ return writeItems(g).filter(w=>{ const s=st.cards[w.i]; return s && s.due<=T; }).length; }
function writeDueTotal(){ return WGROUPS.reduce((a,g)=>a+writeDue(g.g), 0); }

const PARTLABEL = {A:"第一节", B:"第二节", C:"通用"};

function subnav(){
  const tabs = [["cards","句型卡"],["skel","模板骨架"],["model","范文"],["swap","换词"]];
  return '<div class="subnav">'+tabs.map(t=>
    '<button data-wsub="'+t[0]+'" aria-selected="'+(wsub===t[0])+'">'+t[1]+'</button>').join('')+'</div>';
}

function renderWrite(){
  if(wsub==="skel"){ return renderSkeletons(); }
  if(wsub==="model"){ return renderModels(); }
  if(wsub==="swap"){ return renderSwaps(); }
  if(!wgroup){ return renderWriteGroups(); }
  if(!cur){
    stage.innerHTML = subnav()+
      '<div class="card"><div class="prompt">这一组过完了。</div>'+
      '<div class="hint">本组已学 '+writeSeen(wgroup)+' / '+writeItems(wgroup).length+' 条，其中熟 '+writeDone(wgroup)+' 条。'+
      '再刷一遍会重新洗牌；换一组继续也行。</div>'+
      '<div class="actions"><button class="btn" data-wback="1">返回分组</button>'+
      '<button class="btn primary" data-wagain="'+esc(wgroup)+'">再刷一遍</button></div></div>';
    return;
  }
  const total = writeItems(wgroup).length;
  renderCard(cur, wgroup);
  stage.insertAdjacentHTML("afterbegin", subnav());
  stage.insertAdjacentHTML("beforeend",
    '<div class="backline"><button class="linkish" data-wback="1">← 返回分组</button></div>');
}

function renderWriteGroups(){
  stage.innerHTML = subnav()+
    '<div class="glist">'+WGROUPS.map(g=>{
      const total = writeItems(g.g).length, done = writeDone(g.g), seen = writeSeen(g.g);

        '<span class="gpart">'+PARTLABEL[g.part]+'</span>'+

          '<i class="done" style="width:'+(100*done/total).toFixed(0)+'%"></i>'+

        (done?' <b>·'+done+'熟</b>':'')+

    '<span><b>怎么用</b>：看中文提示，把整句英文默写出来再翻面。句型是成套记的，一次刷完一组比零散刷十条管用。</span>'+

    '<b style="color:var(--accent-mid)">中绿</b>＝学过，<b style="color:var(--accent)">深绿</b>＝已经熟了。'+
    '右边数字是已学／总数，连着答对四次才计成「熟」。</span>'+

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;

/* ---------- 我的：打卡日历 + 学习设置 ---------- */
let calSel = null;

function dayIdxOf(y,m,d){ return Math.floor(new Date(y,m,d)/DAY); }

function activeDay(k){ const e = dayEntry(k); return !!e && (e.n + e.r + e.wn + e.wr) > 0; }
function streakDays(){
  let n = 0, t = T;
  if(!activeDay(t)) t -= 1;                 // 今天还没开始不算断
  while(activeDay(t)){ n++; t -= 1; }
  return n;
}

function donut(pct, label, cls, hasReview){
  const r = 15.5, c = 2*Math.PI*r;
  const on = c*Math.max(0, Math.min(1, pct));
  return '<svg viewBox="0 0 40 40" aria-hidden="true">'+
    '<circle class="ring-bg" cx="20" cy="20" r="'+r+'"/>'+
    (on>0 ? '<circle class="ring" cx="20" cy="20" r="'+r+'" stroke-dasharray="'+on.toFixed(2)+' '+c.toFixed(2)+'"/>' : '')+
    '<text class="num" x="20" y="24.5">'+label+'</text>'+
    (hasReview ? '<circle class="dot" cx="20" cy="33.5" r="1.7"/>' : '')+
  '</svg>';
}

function renderMy(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const firstDow = (new Date(y,m,1).getDay()+6)%7;      // 周一起始
  const days = new Date(y, m+1, 0).getDate();
  const quota = perDay();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<span class="cell void"></span>';
  for(let d=1; d<=days; d++){
    const idx = dayIdxOf(y,m,d), e = dayEntry(idx);
    const n = e ? e.n : 0, rv = e ? (e.r + e.wn + e.wr) : 0;
    const pct = quota>0 ? n/quota : 0;
    const cls = ["cell"];
    if(idx===T) cls.push("today");
    else if(idx>T) cls.push("future");
    if(pct>=1) cls.push("full");
    if(calSel===idx) cls.push("sel");
    cells += '<button class="'+cls.join(" ")+'" data-cal="'+idx+'">'+donut(pct, d, cls, rv>0)+'</button>';
  }

  let detail = "点日历上的任意一天看当天记录。";
  if(calSel!==null){
    const e = dayEntry(calSel);
    const dd = new Date(calSel*DAY);
    const head = (dd.getMonth()+1)+"月"+dd.getDate()+"日：";
    detail = e
      ? (head+"搭配 新学 "+e.n+" · 复习 "+e.r+"　|　写作 新学 "+e.wn+" · 复习 "+e.wr)
      : (head+"没有记录");
  }

  const seenD = pool().filter(c=>!!st.cards[c.i]).length;
  const seenW = WRITING.filter(w=>!!st.cards[w.i]).length;
  const doneW = WRITING.filter(w=>{const s=st.cards[w.i];return s&&s.box>=MASTER;}).length;
  const left = Math.max(0, EXAM_T - T);

  stage.innerHTML =
    '<div class="card sect">'+
      '<div class="calendar">'+
        '<div class="calhead"><span class="mon">'+(m+1)+' 月打卡</span>'+
          '<span class="streak">连续 <b>'+streakDays()+'</b> 天 · 距开考 <b>'+left+'</b> 天</span></div>'+
        '<div class="calgrid">'+["一","二","三","四","五","六","日"].map(x=>'<span class="dow">'+x+'</span>').join('')+cells+'</div>'+
        '<div class="caldetail">'+esc(detail)+'</div>'+
        '<div class="callegend">'+
          '<span><i style="background:var(--accent)"></i>圆环＝当天新学完成度</span>'+
          '<span><i style="background:var(--warn)"></i>底部小点＝当天有复习或写作</span>'+
        '</div>'+
      '</div>'+
    '</div>'+

    '<div class="card sect">'+
      '<h4>每日新学量</h4>'+
      '<div class="quota">'+
        '<input type="range" id="q-range" min="10" max="120" step="1" value="'+quota+'">'+
        '<span class="q" id="q-val">'+quota+'</span>'+
      '</div>'+
      '<div class="seg quad">'+[20,33,50,80].map(v=>
        '<button data-quota="'+v+'" aria-pressed="'+(quota===v)+'">'+v+' 条</button>').join('')+'</div>'+
      '<span class="note">今天还能学 <b>'+quotaLeft()+'</b> 条。剩下的 '+unlearned().length+' 条没学，'+
      '按这个量还要 '+Math.ceil(unlearned().length/quota)+' 天过完，距开考 '+left+' 天。'+
      '复习卡和写作句型不占这个额度；某天没学也不会累到第二天。</span>'+
    '</div>'+

    '<div class="card sect">'+
      '<h4>学习范围</h4>'+
      '<div class="seg duo">'+
        '<button data-scope="core" aria-pressed="'+(st.cfg.scope==="core")+'">精选 361<small>高频 + 易混，考点集中</small></button>'+
        '<button data-scope="all" aria-pressed="'+(st.cfg.scope==="all")+'">全部 900<small>完整词表，需要时间</small></button>'+
      '</div>'+
      '<span class="note">换范围不会丢进度——已经学过的条目照原样保留，只是待学的池子变大或变小。</span>'+
    '</div>'+

    '<div class="card sect">'+
      '<h4>进度</h4>'+
      '<div class="kv"><span>搭配 · 已学</span><b>'+seenD+' / '+pool().length+'</b></div>'+
      '<div class="kv"><span>搭配 · 已熟</span><b>'+doneCount()+' / '+pool().length+'</b></div>'+
      '<div class="kv"><span>写作句型 · 已学</span><b>'+seenW+' / '+WRITING.length+'</b></div>'+
      '<div class="kv"><span>写作句型 · 已熟</span><b>'+doneW+' / '+WRITING.length+'</b></div>'+
      '<div class="kv"><span>写作句型 · 待复习</span><b>'+writeDueTotal()+' 条</b></div>'+
      '<div class="kv"><span>错题 · 待攻克</span><b>'+hardPool().length+' 条</b></div>'+
      '<div class="kv"><span>错题 · 已毕业</span><b>'+(hardEverCount()-hardPool().length)+' 条</b></div>'+
      '<span class="note">复习节奏：答对后依次隔 <b>当天 → 1 → 2 → 4 → 7 → 15 天</b> 再考你，'+
      '连对 4 次算「熟」。答错的当场归零，当天重来。所有间隔都会压在开考前，不会有卡片错过考试。</span>'+
      '<span class="note">错题本收的是<b>错过两次以上、还没刷熟</b>的卡；刷熟之后自动毕业，'+
      '底部角标跟着减。卡片上那个「错过 N 次」的历史计数不会清。</span>'+
    '</div>'+

    (HOST ? updateBlock() : webNoteBlock());
}

function updateBlock(){

  const when = cfg.checked ? new Date(cfg.checked).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "还没查过";
  return '<div class="card sect">'+
    '<h4>内容更新</h4>'+
    '<div class="kv"><span>内容版本</span><b>v'+(cfg.version||1)+(cfg.using==="updated"?"（已更新）":"（内置）")+'</b></div>'+
    '<div class="kv"><span>上次检查</span><b>'+esc(when)+'</b></div>'+
    '<div class="field">'+
      '<input id="cfg-src" value="'+esc(cfg.source||"")+'" placeholder="用户名/仓库名" autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '</div>'+
    '<div class="actions"><button class="btn primary" id="cfg-save">保存并检查</button></div>'+

}

  '</div>';
}

/* ---------- android host: over-the-air content updates ---------- */
const HOST = window.AndroidHost || null;
let cfg = null;
let reloadReady = false;

function hostState(){
  if(!HOST) return null;
  try{ return JSON.parse(HOST.getState()); }catch(e){ return null; }
}

function banner(text, action){
  const el = document.getElementById("banner");
  if(!text){ el.hidden = true; return; }
  el.className = "banner";
  el.innerHTML = '<span>'+esc(text)+'</span>'+(action?'<button id="b-act">'+esc(action)+'</button>':'');
  el.hidden = false;
}

window.__update = function(res, manual){
  cfg = hostState();
  if(mode==="cfg") render();
  if(res && res.ok && res.updated){
    reloadReady = true;
    banner((res.notes ? res.notes+" · " : "")+"新内容已就绪", "立即生效");
  } else if(manual){
    banner(res && res.message ? res.message : "检查失败", null);
    setTimeout(()=>banner(null), 4000);
  }
};



document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="b-act"){ if(reloadReady){ location.reload(); } else { banner(null); } return; }
  if(!HOST) return;
  if(b.id==="cfg-save"){
    const v = document.getElementById("cfg-src").value;
    HOST.setSource(v);
    document.getElementById("cfg-status").textContent = "正在检查…";
    HOST.checkNow();
    setTimeout(()=>{ cfg = hostState(); }, 300);
  } else if(b.id==="cfg-reset"){
    HOST.resetBuiltin();
    cfg = hostState();
    render();
    banner("已恢复内置版本，重启应用后生效", null);
  }
});

if(HOST){ cfg = hostState(); }

goSection("word");
