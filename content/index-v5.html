<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>搭配速记 PETS3</title>
<style>
:root{
  --ink:#14181d; --ink-2:#4a545f; --ink-3:#7c8894;
  --paper:#f4f1ec; --card:#fffefb; --line:#ddd7cd;
  --accent:#0f5c52; --accent-soft:#e2ece9;
  --warn:#a8541c; --warn-soft:#f6e9de;
  --good:#2f6b3a; --good-soft:#e6f0e8;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px -12px rgba(20,24,29,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eceae4; --ink-2:#a8b0b8; --ink-3:#77818b;
    --paper:#14181b; --card:#1c2124; --line:#2e3538;
    --accent:#5ec2ad; --accent-soft:#1d332e;
    --warn:#e0a170; --warn-soft:#35271c;
    --good:#7dc08a; --good-soft:#1c2f21;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ink:#eceae4; --ink-2:#a8b0b8; --ink-3:#77818b;
  --paper:#14181b; --card:#1c2124; --line:#2e3538;
  --accent:#5ec2ad; --accent-soft:#1d332e;
  --warn:#e0a170; --warn-soft:#35271c;
  --good:#7dc08a; --good-soft:#1c2f21;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,"Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  margin:0; padding:24px 18px 64px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.wrap>*{min-width:0;max-width:100%}

header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-width:0}
h1{font-family:Georgia,"Noto Serif",serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.01em}
.countdown{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12.5px;color:var(--ink-2);
  background:var(--accent-soft);border-radius:999px;padding:4px 11px;white-space:nowrap}
.countdown b{color:var(--accent);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}

.stat{min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:ui-monospace,"Roboto Mono",monospace;font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .v small{font-size:12px;color:var(--ink-3)}

nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
nav button{font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);transition:.15s}
nav button:hover{border-color:var(--accent);color:var(--accent)}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:30px 26px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.meta{display:flex;justify-content:space-between;font-family:ui-monospace,"Roboto Mono",monospace;
  font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.pill{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 7px}
.prompt{font-size:24px;line-height:1.4;text-wrap:balance}
.answer{font-family:Georgia,"Noto Serif",serif;font-size:29px;line-height:1.3;color:var(--accent);
  text-wrap:balance;word-break:break-word}
.answer.hidden{visibility:hidden}
.hint{color:var(--ink-3);font-size:13px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;padding:11px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);flex:1;min-width:120px;transition:.15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.btn.no{color:var(--warn);border-color:var(--warn)}
.btn.yes{color:var(--good);border-color:var(--good)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{font:inherit;font-family:Georgia,"Noto Serif",serif;font-size:19px;text-align:left;padding:12px 15px;
  border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt .gloss{display:block;font-family:system-ui,sans-serif;font-size:13px;color:var(--ink-3);margin-top:3px}

.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.how{border-left:2px solid var(--accent);padding-left:14px;color:var(--ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.how b{color:var(--ink);font-weight:600}

.list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:60vh;overflow-y:auto}
.row{display:flex;gap:12px;padding:9px 13px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.row:last-child{border-bottom:none}
.row .e{font-family:Georgia,"Noto Serif",serif;font-size:16px;flex:1 1 55%}
.row .c{color:var(--ink-2);flex:1 1 45%;font-size:13px}
.row .b{font-family:ui-monospace,"Roboto Mono",monospace;font-size:10px;color:var(--ink-3);flex:0 0 26px;text-align:right}

.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:12.5px;color:var(--ink-3);margin-bottom:-8px}
.row.dim .e,.row.dim .c{color:var(--ink-3)}
.star{color:var(--accent);font-style:normal;font-size:11px;margin-right:5px;vertical-align:1px}
footer{color:var(--ink-3);font-size:12px;text-align:center}
kbd{font-family:ui-monospace,"Roboto Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:10px 13px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{font:inherit;font-size:12.5px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer}
.cfg{display:flex;flex-direction:column;gap:16px;justify-content:flex-start}
.cfg .field{display:flex;flex-direction:column;gap:6px}
.cfg label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.cfg input{font:inherit;font-size:15px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);width:100%}
.cfg input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cfg .note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.cfg .status{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;color:var(--ink-2);
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all}
.cfg .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.cfg .kv:last-of-type{border-bottom:none}
.cfg .kv b{font-weight:500;font-family:ui-monospace,"Roboto Mono",monospace}
.linkish{background:none;border:none;color:var(--ink-3);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}

.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2px}
.subnav button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2)}
.subnav button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.glist button{font:inherit;text-align:left;background:var(--card);border:none;cursor:pointer;
  padding:13px 14px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.glist button:hover{background:var(--accent-soft)}
.glist .gname{flex:1;font-size:15px}
.glist .gpart{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px}
.glist .gnum{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.glist .gbar{width:44px;height:4px;background:var(--line);border-radius:99px;overflow:hidden;flex:0 0 44px}
.glist .gbar i{display:block;height:100%;background:var(--accent)}
.doc{display:flex;flex-direction:column;gap:18px}
.doc h3{font-family:Georgia,"Noto Serif",serif;font-size:17px;margin:0;font-weight:600;color:var(--ink)}
.doc .warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.doc .task{font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;line-height:1.5}
.step{display:flex;flex-direction:column;gap:4px;padding-left:13px;border-left:2px solid var(--line)}
.step .seg{font-size:11px;letter-spacing:.07em;color:var(--accent);font-weight:600}
.step .what{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.step .sample{font-family:Georgia,"Noto Serif",serif;font-size:14.5px;color:var(--ink);
  background:var(--paper);border-radius:7px;padding:8px 11px;white-space:pre-line;line-height:1.5}
.mline{display:flex;flex-direction:column;gap:3px}
.mline .tag{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.mline .en{font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.55;white-space:pre-line}
.swaps{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.swaprow{background:var(--card);padding:10px 13px;display:flex;flex-direction:column;gap:3px}
.swaprow .from{font-family:Georgia,"Noto Serif",serif;font-size:13px;color:var(--ink-3);text-decoration:line-through}
.swaprow .to{font-family:Georgia,"Noto Serif",serif;font-size:15.5px;color:var(--ink)}
.swaprow .zh{font-size:12px;color:var(--ink-3)}
.backline{display:flex;justify-content:space-between;align-items:center;gap:12px}

body{padding-bottom:92px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  gap:2px;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 20px -14px rgba(0,0,0,.5)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font:inherit;font-size:12px;background:none;border:none;color:var(--ink-3);
  padding:8px 2px;border-radius:11px;cursor:pointer;transition:.15s}
.tabbar button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;
  border-radius:99px;background:var(--warn);color:var(--card);font-size:10.5px;line-height:17px;
  text-align:center;padding:0 4px;font-family:ui-monospace,"Roboto Mono",monospace}
.glist .gbar{position:relative;background:var(--line)}
.glist .gbar i{position:absolute;left:0;top:0;height:100%}
.glist .gbar i.seen{background:var(--accent-soft)}
.glist .gbar i.done{background:var(--accent)}
.glist .gnum b{color:var(--accent);font-weight:500}
.cfgblock{display:flex;flex-direction:column;gap:10px}

/* --- app tuning --- */
body{padding:16px 14px 96px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{gap:16px}
.card{min-height:270px;padding:26px 20px}
.prompt{font-size:26px}
.answer{font-size:31px}
.btn{padding:15px 16px;font-size:16px}
.opt{padding:15px;font-size:20px}
nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:8px 14px}
.list{max-height:none}
</style>

</head>
<body>
<div class="wrap">
  <div id="banner" hidden></div>
  <header>
    <h1>搭配速记</h1>
    <span class="countdown">9月19日开考 · 还有 <b id="days">—</b> 天</span>
  </header>

  <div class="stats">
    <div class="stat"><span class="k">今日新学</span><span class="v" id="s-new">0<small>/33</small></span></div>
    <div class="stat"><span class="k">待复习</span><span class="v" id="s-due">0</span></div>
    <div class="stat"><span class="k">已过关</span><span class="v" id="s-done">0<small>/361</small></span></div>
  </div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>

  <nav id="tabs"></nav>

  <div id="stage"></div>

  <div class="how" id="globalhow">
    <span><b>用法</b>：看中文，先在心里默写英文，再翻面对答案。<b>不许只用眼睛扫</b>——想不出来才是有效的一次学习。</span>
    <span>答错的会在当天再出现一次，之后按 1 / 2 / 4 / 7 天回来找你。</span>
  </div>

</div>


<div class="tabbar" id="tabbar">
  <button data-sec="word" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a2 2 0 0 1 2 2V21H7a2 2 0 0 1-2-2z"/><path d="M9 9h6M9 13h6"/></svg>
    <span>单词</span>
  </button>
  <button data-sec="write" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19.2 8.8a2.7 2.7 0 0 0-3.8-3.8L4 16z"/><path d="M14.4 6.6l3 3"/></svg>
    <span>写作</span>
  </button>
  <button data-sec="hard" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/><path d="M12 8v4"/><path d="M12 15h.01"/></svg>
    <span>错题本</span><span class="badge" id="hardbadge" hidden>0</span>
  </button>
  <button data-sec="cfg" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h8M18 7.5h2M4 16.5h4M14 16.5h6"/><circle cx="15" cy="7.5" r="2.4"/><circle cx="11" cy="16.5" r="2.4"/></svg>
    <span>设置</span>
  </button>
</div>

const EXAM = new Date(2026,8,19);
const DAY = 864e5;
const KEY = "pets3-collocations-v1";
const PER_DAY = 33;
const STEPS = [1,2,4,7,14];

let st = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return {cards:{}, day0:today(), pairs:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function today(){ const d=new Date(); return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/DAY); }

const T = today();
document.getElementById("days").textContent =
  Math.max(0, Math.ceil((EXAM - new Date())/DAY));

// which batch of new cards belongs to today
function dayIndex(){ return Math.max(0, T - st.day0); }
function batchEnd(){ return Math.min(DATA.length, (dayIndex()+1)*PER_DAY); }
function newPool(){ return DATA.slice(0, batchEnd()).filter(c => !st.cards[c.i]); }
function todayLearned(){
  const start = Math.min(DATA.length, dayIndex()*PER_DAY);
  return DATA.slice(start, batchEnd()).filter(c => st.cards[c.i]).length;
}
function duePool(){
  return DATA.filter(c => { const s=st.cards[c.i]; return s && s.due<=T; });
}
function hardPool(){
  return DATA.concat(typeof WRITING==="undefined"?[]:WRITING)
             .filter(c => { const s=st.cards[c.i]; return s && s.miss>=2; });
}
function cardLabel(c){
  return (typeof c.i==="string" && c.i.charAt(0)==="w") ? ("写作 · "+c.g) : ("第 "+c.i+" 条");
}
function doneCount(){ return DATA.filter(c=>{const s=st.cards[c.i];return s&&s.box>=3;}).length; }

function grade(c, ok){
  const s = st.cards[c.i] || {box:0, miss:0, due:T};
  if(ok){ s.box = Math.min(STEPS.length, s.box+1); s.due = T + STEPS[s.box-1]; }
  else { s.miss++; s.box = 0; s.due = T; }
  st.cards[c.i] = s;
  save();
}

let mode="today", queue=[], relearn=[], flipped=false, cur=null;

function buildQueue(){
  relearn=[];
  if(mode==="today") queue = newPool();
  else if(mode==="review") queue = duePool();
  else if(mode==="hard") queue = hardPool();
  else if(mode==="pair") queue = shuffle(PAIRS.map((p,i)=>({p,i})));
  else if(mode==="write") queue = (wsub==="cards" && wgroup) ? writePool(wgroup) : [];
  next();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function next(){
  flipped=false;
  if(queue.length) cur = queue.shift();
  else if(relearn.length) cur = relearn.shift();
  else cur = null;
  render();
}

const stage = document.getElementById("stage");

function stats(){
  document.getElementById("s-new").innerHTML = todayLearned()+"<small>/"+PER_DAY+"</small>";
  document.getElementById("s-due").textContent = duePool().length;
  const d = doneCount();
  document.getElementById("s-done").innerHTML = d+"<small>/"+DATA.length+"</small>";
  document.getElementById("bar").style.width = (100*d/DATA.length).toFixed(1)+"%";
}

function render(){
  stats();
  const hideChrome = (section !== "word");
  const statsEl = document.querySelector(".stats");
  const barEl = document.querySelector(".bar");
  if(statsEl) statsEl.hidden = hideChrome;
  if(barEl) barEl.hidden = hideChrome;
  const howEl = document.getElementById("globalhow");
  if(howEl) howEl.hidden = hideChrome;
  renderNav();
  if(mode==="cfg"){ renderCfg(); return; }
  if(mode==="list"){ renderList(); return; }
  if(mode==="write"){ renderWrite(); return; }
  if(!cur){
    const EMPTY = {
      today:  ["今天的新词学完了。", "切到「复习到期」把之前的巩固一遍。"],
      review: ["没有到期要复习的。", "明天再来，或者去「今日新词」推进新的一批。"],
      hard:   ["错题本是空的。", "同一条答错两次以上才会被收进来 —— 单词和写作句型都算。"],
      pair:   ["冠词对比过完了。", "再点一次「冠词对比」会重新洗牌。"]
    };
    const m = EMPTY[mode] || ["这一组清空了。", ""];
    stage.innerHTML =
      '<div class="card"><div class="prompt">'+m[0]+'</div>'+
      '<div class="hint">'+m[1]+'</div></div>';
    return; }

  if(mode==="pair"){ renderPair(); return; }

  renderCard(cur, cardLabel(cur));
}

function renderCard(c, label){
  const s = st.cards[c.i];
  stage.innerHTML =
    '<div class="card">'+
      '<div class="meta"><span>'+esc(label)+'</span>'+
        (s&&s.miss>=2?'<span class="pill">错过 '+s.miss+' 次</span>':'<span>'+(queue.length+relearn.length)+' 张待过</span>')+
      '</div>'+
      '<div class="prompt">'+esc(c.zh)+'</div>'+
      '<div class="answer'+(flipped?'':' hidden')+'">'+esc(c.en)+'</div>'+
      (flipped
        ? '<div class="actions"><button class="btn no" data-a="0">没想起来</button><button class="btn yes" data-a="1">记住了</button></div>'
        : '<div class="actions"><button class="btn primary" data-a="flip">翻面看答案</button></div>')+
    '</div>';
}

function renderPair(){
  const {p} = cur;
  const opts = shuffle([[p.a,p.ag],[p.b,p.bg]]);
  const ask = Math.random()<.5 ? [p.a,p.ag] : [p.b,p.bg];
  cur.ask = ask;
  stage.innerHTML =
    '<div class="card">'+
      '<div class="meta"><span>冠词对比</span><span>'+queue.length+' 组待过</span></div>'+
      '<div class="prompt">哪个是「'+esc(ask[1])+'」？</div>'+
      '<div class="opts">'+opts.map(o=>
        '<button class="opt" data-en="'+esc(o[0])+'">'+esc(o[0])+'</button>').join('')+
      '</div>'+
    '</div>';
}

let listAll = false;
function renderList(){
  const rows = listAll
    ? DATA.concat(EXTRA).sort((a,b)=>a.i-b.i)
    : DATA;
  stage.innerHTML =
    '<div class="listhead">'+
      '<span>'+rows.length+' 条'+(listAll?'（全部 900 组，★ 为刷卡集）':'（刷卡集）')+'</span>'+
      '<button class="linkish" id="toggle-all">'+(listAll?'只看刷卡集':'显示全部 900 组')+'</button>'+
    '</div>'+
    '<div class="list">'+rows.map(c=>{
      const s=st.cards[c.i], core=!!coreSet[c.i];
      return '<div class="row'+(listAll&&!core?' dim':'')+'">'+
        '<span class="e">'+(listAll&&core?'<i class="star">★</i>':'')+esc(c.en)+'</span>'+
        '<span class="c">'+esc(c.zh)+'</span>'+
        '<span class="b">'+(s?('B'+s.box):'')+'</span></div>';
    }).join('')+'</div>';
}
const coreSet = {};
DATA.forEach(c=>{ coreSet[c.i]=1; });

function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

stage.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="toggle-all"){ listAll = !listAll; render(); return; }
  if(b.dataset.a==="flip"){ flipped=true; render(); return; }
  if(b.dataset.a==="0"||b.dataset.a==="1"){
    const ok = b.dataset.a==="1";
    grade(cur, ok);
    if(!ok) relearn.push(cur);
    next(); return;
  }
  if(b.dataset.en!==undefined){
    if(document.querySelector(".opt.right")) { next(); return; }
    const right = cur.ask[0];
    document.querySelectorAll(".opt").forEach(o=>{
      if(o.dataset.en===right) o.classList.add("right");
      else if(o===b) o.classList.add("wrong");
      o.insertAdjacentHTML("beforeend",
        '<span class="gloss">'+esc(o.dataset.en===cur.p.a?cur.p.ag:cur.p.bg)+'</span>');
    });
    if(b.dataset.en!==right) queue.push(cur);
  }
});

document.addEventListener("keydown", e=>{
  if(mode==="list"||mode==="pair"||mode==="cfg"||!cur) return;
  if(mode==="write" && !(wsub==="cards" && wgroup)) return;
  if(e.code==="Space"){ e.preventDefault(); if(!flipped){flipped=true;render();} }
  else if(e.key==="1"&&flipped){ grade(cur,false); relearn.push(cur); next(); }
  else if(e.key==="2"&&flipped){ grade(cur,true); next(); }
});

let section = "word";
const SECTIONS = {
  word:  {def:"today", subs:[["today","今日新词"],["review","复习到期"],["pair","冠词对比"],["list","全表"]]},
  write: {def:"write", subs:[]},
  hard:  {def:"hard",  subs:[]},
  cfg:   {def:"cfg",   subs:[]}
};

function renderNav(){
  const nav = document.getElementById("tabs");
  const subs = SECTIONS[section].subs;
  nav.hidden = subs.length === 0;
  nav.innerHTML = subs.map(s =>
    '<button data-mode="'+s[0]+'" aria-selected="'+(mode===s[0])+'">'+s[1]+'</button>').join('');
  document.querySelectorAll("#tabbar button").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.sec === section)));
  const badge = document.getElementById("hardbadge");
  if(badge){
    const n = hardPool().length;
    badge.textContent = n > 99 ? "99+" : n;
    badge.hidden = n === 0;
  }
}

function goSection(sec){
  section = sec;
  mode = SECTIONS[sec].def;
  if(sec === "write"){ wsub = "cards"; wgroup = null; }
  buildQueue();
  renderNav();
}

document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  mode=b.dataset.mode;
  buildQueue();
  renderNav();
});

document.getElementById("tabbar").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  goSection(b.dataset.sec);
});

/* ---------- 写作模块 ---------- */
let wsub = "cards";
let wgroup = null;

function writeItems(g){ return WRITING.filter(w=>w.g===g); }
function writePool(g){
  const items = writeItems(g);
  const due = items.filter(w=>{ const s=st.cards[w.i]; return !s || s.due<=T; });
  return due.length ? due : items;
}
function writeDone(g){ return writeItems(g).filter(w=>{ const s=st.cards[w.i]; return s && s.box>=3; }).length; }
function writeSeen(g){ return writeItems(g).filter(w=>!!st.cards[w.i]).length; }

const PARTLABEL = {A:"第一节", B:"第二节", C:"通用"};

function subnav(){
  const tabs = [["cards","句型卡"],["skel","模板骨架"],["model","范文"],["swap","换词"]];
  return '<div class="subnav">'+tabs.map(t=>
    '<button data-wsub="'+t[0]+'" aria-selected="'+(wsub===t[0])+'">'+t[1]+'</button>').join('')+'</div>';
}

function renderWrite(){
  if(wsub==="skel"){ return renderSkeletons(); }
  if(wsub==="model"){ return renderModels(); }
  if(wsub==="swap"){ return renderSwaps(); }
  if(!wgroup){ return renderWriteGroups(); }
  if(!cur){
    stage.innerHTML = subnav()+
      '<div class="card"><div class="prompt">这一组过完了。</div>'+
      '<div class="hint">再刷一遍会重新洗牌；换一组继续也行。</div>'+
      '<div class="actions"><button class="btn" data-wback="1">返回分组</button>'+
      '<button class="btn primary" data-wagain="'+esc(wgroup)+'">再刷一遍</button></div></div>';
    return;
  }
  const total = writeItems(wgroup).length;
  renderCard(cur, wgroup+" · 剩 "+(queue.length+relearn.length+1)+" 张");
  stage.insertAdjacentHTML("afterbegin", subnav());
  stage.insertAdjacentHTML("beforeend",
    '<div class="backline"><button class="linkish" data-wback="1">← 返回分组</button></div>');
}

function renderWriteGroups(){
  stage.innerHTML = subnav()+
    '<div class="glist">'+WGROUPS.map(g=>{
      const total = writeItems(g.g).length, done = writeDone(g.g), seen = writeSeen(g.g);
      return '<button data-wgroup="'+esc(g.g)+'">'+
        '<span class="gpart">'+PARTLABEL[g.part]+'</span>'+
        '<span class="gname">'+esc(g.g)+'</span>'+
        '<span class="gbar">'+
          '<i class="seen" style="width:'+(100*seen/total).toFixed(0)+'%"></i>'+
          '<i class="done" style="width:'+(100*done/total).toFixed(0)+'%"></i>'+
        '</span>'+
        '<span class="gnum">'+seen+'/'+total+(done?' <b>·'+done+'熟</b>':'')+'</span></button>';
    }).join('')+'</div>'+
    '<div class="how">'+
    '<span><b>怎么用</b>：看中文提示，把整句英文默写出来再翻面。句型是成套记的，一次刷完一组比零散刷十条管用。</span>'+
    '<span>右边数字是<b>已学条数</b>／本组总数，进度条浅色段同理；'+
    '连着答对三次的会计成「熟」，显示在后面并把进度条填成深色。</span>'+
    '<span>写作总计已学 '+WRITING.filter(w=>!!st.cards[w.i]).length+' / '+WRITING.length+' 条，'+
    '其中熟 '+WRITING.filter(w=>{const s=st.cards[w.i];return s&&s.box>=3;}).length+' 条。</span>'+
    '</div>';
}

function renderSkeletons(){
  stage.innerHTML = subnav()+SKELETONS.map(k=>
    '<div class="card doc">'+
      '<h3>'+esc(k.title)+'</h3>'+
      '<div class="warn">'+esc(k.warn)+'</div>'+
      k.steps.map(s=>
        '<div class="step"><span class="seg">'+esc(s.seg)+'</span>'+
        '<span class="what">'+esc(s.what)+'</span>'+
        '<span class="sample">'+esc(s.sample)+'</span></div>').join('')+
    '</div>').join('');
}

function renderModels(){
  stage.innerHTML = subnav()+MODELS.map(m=>
    '<div class="card doc">'+
      '<h3>'+esc(m.title)+'<span class="gnum" style="float:right">'+esc(m.words)+'</span></h3>'+
      '<div class="task">'+esc(m.task)+'</div>'+
      m.lines.map(l=>
        '<div class="mline"><span class="tag">'+esc(l[0])+'</span>'+
        '<span class="en">'+esc(l[1])+'</span></div>').join('')+
    '</div>').join('');
}

function renderSwaps(){
  stage.innerHTML = subnav()+
    '<div class="how"><span>左边划掉的是阅卷人看腻的词，右边是同义替换。'+
    '<b>一篇作文换三到五处就够</b>，全篇堆砌反而扣分。</span></div>'+
    '<div class="swaps">'+SWAPS.map(s=>
      '<div class="swaprow"><span class="from">'+esc(s.a)+'</span>'+
      '<span class="to">'+esc(s.b)+'</span>'+
      '<span class="zh">'+esc(s.zh)+'</span></div>').join('')+'</div>';
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.wsub!==undefined){
    wsub = b.dataset.wsub; wgroup = null; buildQueue(); return;
  }
  if(b.dataset.wgroup!==undefined){
    wgroup = b.dataset.wgroup; buildQueue(); return;
  }
  if(b.dataset.wagain!==undefined){
    wgroup = b.dataset.wagain; queue = shuffle(writeItems(wgroup)); relearn=[]; next(); return;
  }
  if(b.dataset.wback!==undefined){
    wgroup = null; buildQueue(); return;
  }
});

/* ---------- android host: over-the-air content updates ---------- */
const HOST = window.AndroidHost || null;
let cfg = null;
let reloadReady = false;

function hostState(){
  if(!HOST) return null;
  try{ return JSON.parse(HOST.getState()); }catch(e){ return null; }
}

function banner(text, action){
  const el = document.getElementById("banner");
  if(!text){ el.hidden = true; return; }
  el.className = "banner";
  el.innerHTML = '<span>'+esc(text)+'</span>'+(action?'<button id="b-act">'+esc(action)+'</button>':'');
  el.hidden = false;
}

window.__update = function(res, manual){
  cfg = hostState();
  if(mode==="cfg") render();
  if(res && res.ok && res.updated){
    reloadReady = true;
    banner((res.notes ? res.notes+" · " : "")+"新内容已就绪", "立即生效");
  } else if(manual){
    banner(res && res.message ? res.message : "检查失败", null);
    setTimeout(()=>banner(null), 4000);
  }
};

function renderCfgWeb(){
  const seenW = WRITING.filter(w=>!!st.cards[w.i]).length;
  const doneW = WRITING.filter(w=>{const s=st.cards[w.i];return s&&s.box>=3;}).length;
  const seenD = DATA.filter(c=>!!st.cards[c.i]).length;
  stage.innerHTML =
    '<div class="card cfg">'+
      '<div class="kv"><span>搭配 · 已学</span><b>'+seenD+' / '+DATA.length+'</b></div>'+
      '<div class="kv"><span>搭配 · 已过关</span><b>'+doneCount()+' / '+DATA.length+'</b></div>'+
      '<div class="kv"><span>写作句型 · 已学</span><b>'+seenW+' / '+WRITING.length+'</b></div>'+
      '<div class="kv"><span>写作句型 · 已熟</span><b>'+doneW+' / '+WRITING.length+'</b></div>'+
      '<div class="kv"><span>错题</span><b>'+hardPool().length+' 条</b></div>'+
      '<div class="cfgblock">'+
        '<span class="note">键盘：<b>空格</b> 翻面，<b>1</b> 没想起来，<b>2</b> 记住了。</span>'+
        '<span class="note">进度保存在这台设备的浏览器里，换设备不同步。'+
        '安卓 app 里这一页还能设置内容更新源。</span>'+
      '</div>'+
    '</div>';
}

function renderCfg(){
  if(!HOST){ return renderCfgWeb(); }
  cfg = cfg || hostState() || {};
  const when = cfg.checked ? new Date(cfg.checked).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "还没查过";
  stage.innerHTML =
    '<div class="card cfg">'+
      '<div class="kv"><span>内容版本</span><b>v'+(cfg.version||1)+(cfg.using==="updated"?" (已更新)":" (内置)")+'</b></div>'+
      '<div class="kv"><span>上次检查</span><b>'+esc(when)+'</b></div>'+
      '<div class="field">'+
        '<label>更新源</label>'+
        '<input id="cfg-src" value="'+esc(cfg.source||"")+'" placeholder="用户名/仓库名" autocapitalize="off" autocorrect="off" spellcheck="false">'+
        '<span class="note">填 GitHub 的 <b>用户名/仓库名</b>，例如 <b>yinsua/pets3-cards</b>。也可以直接填一个 https 目录地址。留空则永不联网。</span>'+
      '</div>'+
      '<div class="actions"><button class="btn primary" id="cfg-save">保存并检查</button></div>'+
      '<div class="status" id="cfg-status">每次启动会静默查一次，几十字节，失败不影响使用。</div>'+
      '<button class="linkish" id="cfg-reset">恢复到内置版本</button>'+
    '</div>';
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="b-act"){ if(reloadReady){ location.reload(); } else { banner(null); } return; }
  if(!HOST) return;
  if(b.id==="cfg-save"){
    const v = document.getElementById("cfg-src").value;
    HOST.setSource(v);
    document.getElementById("cfg-status").textContent = "正在检查…";
    HOST.checkNow();
    setTimeout(()=>{ cfg = hostState(); }, 300);
  } else if(b.id==="cfg-reset"){
    HOST.resetBuiltin();
    cfg = hostState();
    render();
    banner("已恢复内置版本，重启应用后生效", null);
  }
});

if(HOST){ cfg = hostState(); }

goSection("word");
</script>
