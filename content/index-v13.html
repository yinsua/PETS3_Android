<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>搭配速记 PETS3</title>
<style>
:root{
  --ink:#14181d; --ink-2:#4a545f; --ink-3:#7c8894;
  --paper:#f4f1ec; --card:#fffefb; --line:#ddd7cd;
  --accent:#0f5c52; --accent-soft:#e2ece9; --accent-mid:#5f9186;
  --warn:#a8541c; --warn-soft:#f6e9de;
  --good:#2f6b3a; --good-soft:#e6f0e8;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px -12px rgba(20,24,29,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eceae4; --ink-2:#a8b0b8; --ink-3:#77818b;
    --paper:#14181b; --card:#1c2124; --line:#2e3538;
    --accent:#5ec2ad; --accent-soft:#1d332e; --accent-mid:#3f7a6e;
    --warn:#e0a170; --warn-soft:#35271c;
    --good:#7dc08a; --good-soft:#1c2f21;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ink:#eceae4; --ink-2:#a8b0b8; --ink-3:#77818b;
  --paper:#14181b; --card:#1c2124; --line:#2e3538;
  --accent:#5ec2ad; --accent-soft:#1d332e; --accent-mid:#3f7a6e;
  --warn:#e0a170; --warn-soft:#35271c;
  --good:#7dc08a; --good-soft:#1c2f21;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,"Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  margin:0; padding:24px 18px 64px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.wrap>*{min-width:0;max-width:100%}

header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-width:0}
h1{font-family:Georgia,"Noto Serif",serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.01em}
.countdown{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12.5px;color:var(--ink-2);
  background:var(--accent-soft);border-radius:999px;padding:4px 11px;white-space:nowrap}
.countdown b{color:var(--accent);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}

.stat{min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:ui-monospace,"Roboto Mono",monospace;font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .v small{font-size:12px;color:var(--ink-3)}

nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
nav button{font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);transition:.15s}
nav button:hover{border-color:var(--accent);color:var(--accent)}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:26px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.meta{display:flex;justify-content:space-between;font-family:ui-monospace,"Roboto Mono",monospace;
  font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.pill{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 7px}
.prompt{font-size:24px;line-height:1.4;text-wrap:balance}
.answer{font-family:Georgia,"Noto Serif",serif;font-size:29px;line-height:1.3;color:var(--accent);
  text-wrap:balance;word-break:break-word}
.answer.long{font-size:22px;line-height:1.45}
.answer.hidden{visibility:hidden}
.hint{color:var(--ink-3);font-size:13px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;padding:11px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);flex:1;min-width:120px;transition:.15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.btn.no{color:var(--warn);border-color:var(--warn)}
.btn.yes{color:var(--good);border-color:var(--good)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{font:inherit;font-family:Georgia,"Noto Serif",serif;font-size:19px;text-align:left;padding:12px 15px;
  border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt .gloss{display:block;font-family:system-ui,sans-serif;font-size:13px;color:var(--ink-3);margin-top:3px}

.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.how{border-left:2px solid var(--accent);padding-left:14px;color:var(--ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.how b{color:var(--ink);font-weight:600}

.list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:60vh;overflow-y:auto}
.row{display:flex;gap:12px;padding:9px 13px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.row:last-child{border-bottom:none}
.row .e{font-family:Georgia,"Noto Serif",serif;font-size:16px;flex:1 1 55%}
.row .c{color:var(--ink-2);flex:1 1 45%;font-size:13px}
.row .b{font-family:ui-monospace,"Roboto Mono",monospace;font-size:10px;color:var(--ink-3);flex:0 0 26px;text-align:right}

.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:12.5px;color:var(--ink-3);margin-bottom:-8px}
.row.dim .e,.row.dim .c{color:var(--ink-3)}
.star{color:var(--accent);font-style:normal;font-size:11px;margin-right:5px;vertical-align:1px}
footer{color:var(--ink-3);font-size:12px;text-align:center}
kbd{font-family:ui-monospace,"Roboto Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:10px 13px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{font:inherit;font-size:12.5px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer}
.cfg{display:flex;flex-direction:column;gap:16px;justify-content:flex-start}
.cfg .field{display:flex;flex-direction:column;gap:6px}
.cfg label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.cfg input{font:inherit;font-size:15px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);width:100%}
.cfg input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cfg .note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.cfg .status{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;color:var(--ink-2);
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all}
.cfg .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.cfg .kv:last-of-type{border-bottom:none}
.cfg .kv b{font-weight:500;font-family:ui-monospace,"Roboto Mono",monospace}
.linkish{background:none;border:none;color:var(--ink-3);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}

.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2px}
.subnav button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2)}
.subnav button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.glist button{font:inherit;text-align:left;background:var(--card);border:none;cursor:pointer;
  padding:13px 14px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.glist button:hover{background:var(--accent-soft)}
.glist .gname{flex:1;font-size:15px}
.glist .gpart{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px}
.glist .gnum{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.glist .gbar{width:56px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:0 0 56px}
.glist .gbar i{display:block;height:100%;background:var(--accent)}
.doc{display:flex;flex-direction:column;gap:18px}
.doc h3{font-family:Georgia,"Noto Serif",serif;font-size:17px;margin:0;font-weight:600;color:var(--ink)}
.doc .warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.doc .task{font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;line-height:1.5}
.step{display:flex;flex-direction:column;gap:4px;padding-left:13px;border-left:2px solid var(--line)}
.step .seg{font-size:11px;letter-spacing:.07em;color:var(--accent);font-weight:600}
.step .what{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.step .sample{font-family:Georgia,"Noto Serif",serif;font-size:14.5px;color:var(--ink);
  background:var(--paper);border-radius:7px;padding:8px 11px;white-space:pre-line;line-height:1.5}
.mline{display:flex;flex-direction:column;gap:3px}
.mline .tag{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.mline .en{font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.55;white-space:pre-line}
.swaps{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.swaprow{background:var(--card);padding:10px 13px;display:flex;flex-direction:column;gap:3px}
.swaprow .from{font-family:Georgia,"Noto Serif",serif;font-size:13px;color:var(--ink-3);text-decoration:line-through}
.swaprow .to{font-family:Georgia,"Noto Serif",serif;font-size:15.5px;color:var(--ink)}
.swaprow .zh{font-size:12px;color:var(--ink-3)}
.backline{display:flex;justify-content:space-between;align-items:center;gap:12px}

body{padding-bottom:92px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  gap:2px;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 20px -14px rgba(0,0,0,.5)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font:inherit;font-size:12px;background:none;border:none;color:var(--ink-3);
  padding:8px 2px;border-radius:11px;cursor:pointer;transition:.15s}
.tabbar button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;
  border-radius:99px;background:var(--warn);color:var(--card);font-size:10.5px;line-height:17px;
  text-align:center;padding:0 4px;font-family:ui-monospace,"Roboto Mono",monospace}
.glist .gbar{position:relative;background:var(--line)}
.glist .gbar i{position:absolute;left:0;top:0;height:100%}
.glist .gbar i.seen{background:var(--accent-mid)}
.glist .gbar i.done{background:var(--accent)}
.glist .gnum b{color:var(--accent);font-weight:500}
.glist .gnum em{color:var(--warn);font-style:normal}
.cfgblock{display:flex;flex-direction:column;gap:10px}

.calendar{display:flex;flex-direction:column;gap:10px}
.calhead{display:flex;justify-content:space-between;align-items:baseline}
.calhead .mon{font-family:Georgia,"Noto Serif",serif;font-size:17px}
.calhead .streak{font-size:12.5px;color:var(--ink-3)}
.calhead .streak b{color:var(--accent);font-family:ui-monospace,"Roboto Mono",monospace}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:10.5px;color:var(--ink-3);padding-bottom:2px}
.cell{position:relative;aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;border-radius:9px}
.cell.void{cursor:default}
.cell svg{width:100%;height:100%;display:block}
.cell .ring-bg{fill:none;stroke:var(--line);stroke-width:3.4}
.cell .ring{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%}
.cell .num{fill:var(--ink-2);font-size:13px;text-anchor:middle;
  font-family:ui-monospace,"Roboto Mono",monospace}
.cell.full .num{fill:var(--accent)}
.cell.today .num{fill:var(--ink);font-weight:600}
.cell.today{outline:1.5px solid var(--accent);outline-offset:-1px}
.cell .dot{fill:var(--warn)}
.cell.sel{background:var(--accent-soft)}
.cell.future{opacity:.4}
.callegend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.callegend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:4px;vertical-align:-1px}
.caldetail{font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;min-height:38px;display:flex;align-items:center}
.seg{display:grid;gap:6px}
.seg.quad{grid-template-columns:repeat(4,1fr)}
.seg.duo{grid-template-columns:repeat(2,1fr)}
.seg button{font:inherit;font-size:13.5px;padding:9px 6px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);min-width:0}
.seg.duo button{padding:11px 12px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg button small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;font-weight:400}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.quota{display:flex;align-items:center;gap:10px}
.quota input[type=range]{flex:1;accent-color:var(--accent)}
.quota .q{font-family:ui-monospace,"Roboto Mono",monospace;font-size:20px;color:var(--accent);
  min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.sect{display:flex;flex-direction:column;gap:12px}
.sect > h4{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.example{border-left:2px solid var(--accent-mid);padding-left:13px;display:flex;flex-direction:column;gap:4px}
.example .ex-en{font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-line}
.example .ex-zh{font-size:13px;color:var(--ink-3);line-height:1.5;white-space:pre-line}
.example .ex-tag{font-size:10px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}


.plist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.plist button{font:inherit;text-align:left;background:var(--card);border:none;cursor:pointer;
  padding:12px 14px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.plist button:hover{background:var(--accent-soft)}
.plist .py{font-family:ui-monospace,"Roboto Mono",monospace;font-size:13px;color:var(--accent);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plist .py em{font-style:normal;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.plist .pa{font-size:14px}
.plist .pb{font-size:12.5px;color:var(--ink-3)}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phead .h{font-family:Georgia,"Noto Serif",serif;font-size:20px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:18px 17px;display:flex;flex-direction:column;gap:13px}
.pcard .ptag{font-size:10.5px;letter-spacing:.07em;color:var(--accent);font-weight:600}
.pcard .ptask{font-size:14.5px;line-height:1.6}
.pcard ol.ppts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;
  font-size:13.5px;color:var(--ink-2)}
.passage{font-family:Georgia,"Noto Serif",serif;font-size:15px;line-height:1.65;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:13px 14px;
  max-height:230px;overflow:hidden;position:relative}
.passage.open{max-height:none}
.passage:not(.open):after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;
  background:linear-gradient(to bottom,transparent,var(--paper))}
.model{font-family:Georgia,"Noto Serif",serif;font-size:15.5px;line-height:1.65;white-space:pre-line;
  border-left:2px solid var(--accent);padding-left:13px;color:var(--ink)}
.ptip{font-size:13px;line-height:1.6;color:var(--ink-2);background:var(--accent-soft);
  border-radius:9px;padding:11px 13px}
.ptip b{color:var(--accent);font-weight:600}
.psrc{font-size:11px;color:var(--ink-3)}
.pnote{font-size:12.5px;color:var(--ink-3);line-height:1.55}

/* --- app tuning --- */
body{padding:16px 14px 96px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{gap:16px}
.card{min-height:270px;padding:26px 20px}
.prompt{font-size:26px}
.answer{font-size:31px}
.btn{padding:15px 16px;font-size:16px}
.opt{padding:15px;font-size:20px}
nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:8px 14px}
.list{max-height:none}
.uhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.uhead .today{display:flex;flex-direction:column;gap:1px}
.uhead .today .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.uhead .today .v{font-family:ui-monospace,"Roboto Mono",monospace;font-size:25px;color:var(--accent);
  font-variant-numeric:tabular-nums;line-height:1.15}
.wknav{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.wknav button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);border-radius:7px;width:30px;height:30px;line-height:1;padding:0;cursor:pointer}
.wknav button[disabled]{opacity:.3;cursor:default}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:140px;margin-top:2px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.col .val{font-family:ui-monospace,"Roboto Mono",monospace;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;height:13px}
.col .stem{display:block;width:100%;max-width:28px;background:var(--accent-mid);
  border-radius:5px 5px 0 0;min-height:3px}
.col.today .stem{background:var(--accent)}
.col.zero .stem{background:var(--line)}
.col .dw{font-size:11px;color:var(--ink-3)}
.col.today .dw{color:var(--accent);font-weight:600}

/* ---------- 语法 ---------- */
.g-en{font-family:Georgia,"Noto Serif",serif}
.glist .gname small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.35;font-weight:400}
.glist .gtick{flex:0 0 24px;text-align:center;font-size:13px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:6px;height:24px;line-height:22px}
.glist .gtick.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.gdoc{gap:14px;padding:22px 18px;min-height:0;justify-content:flex-start}
.gdoc .gsub{font-size:12.5px;color:var(--ink-3);margin-top:-9px}
.gh{font-size:15.5px;font-weight:600;color:var(--ink);margin-top:6px}
.gp{margin:0;font-size:15px;line-height:1.75;color:var(--ink-2)}
.gp b,.gh b,.gbox b,.gex b,.gtbl b,.grw b{color:var(--ink);font-weight:600}
.gbox{border-radius:9px;padding:12px 13px;font-size:14px;line-height:1.75;color:var(--ink-2);
  border-left:3px solid var(--line);background:var(--paper)}
.gbox .gt{display:block;font-size:10.5px;letter-spacing:.1em;margin-bottom:4px;font-weight:600}
.gbox.origin{border-left-color:var(--ink-3)}
.gbox.origin .gt{color:var(--ink-3)}
.gbox.use{border-left-color:var(--accent);background:var(--accent-soft)}
.gbox.use .gt{color:var(--accent)}
.gbox.trap{border-left-color:var(--warn);background:var(--warn-soft)}
.gbox.trap .gt{color:var(--warn)}
.gex{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:2px}
.gex .e{font-family:Georgia,"Noto Serif",serif;font-size:16.5px;line-height:1.5;color:var(--ink)}
.gex .z{font-size:13px;color:var(--ink-3);line-height:1.5}
.gul{margin:0;padding-left:1.2em;font-size:14.5px;color:var(--ink-2)}
.gpills{display:flex;flex-wrap:wrap;gap:6px}
.gpill{font-family:ui-monospace,"Roboto Mono",monospace;font-size:12px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--paper)}
.grw{display:flex;flex-direction:column;gap:10px}
.grw>div{display:flex;gap:9px;align-items:flex-start}
.grw .mk{flex:0 0 14px;font-size:13.5px;font-weight:600;line-height:1.5}
.grw .no .mk{color:var(--warn)}
.grw .yes .mk{color:var(--good)}
.grw .s{display:block;font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.45;color:var(--ink)}
.grw .why{display:block;font-size:13px;color:var(--ink-3);line-height:1.5;margin-top:1px}
.gdg{border:1px solid var(--line);border-radius:10px;padding:14px 13px 11px;background:var(--paper)}
.gdgrow{display:flex;flex-wrap:wrap;gap:3px 13px;align-items:flex-end}
.gck{display:flex;flex-direction:column;gap:4px;min-width:0}
.gck .w{font-family:Georgia,"Noto Serif",serif;font-size:17px;line-height:1.35;color:var(--ink)}
.gck .bar{height:3px;border-radius:2px;background:var(--line)}
.gck .lb{font-family:ui-monospace,"Roboto Mono",monospace;font-size:10px;line-height:1.3;color:var(--ink-3)}
.gck.s .bar{background:var(--accent)}
.gck.s .lb{color:var(--accent)}
.gck.v .bar{background:var(--warn)}
.gck.v .lb{color:var(--warn)}
.gck.o .bar{background:var(--good)}
.gck.o .lb{color:var(--good)}
.gck.p .bar{background:var(--accent-mid)}
.gck.p .lb{color:var(--accent-mid)}
.gck.m .bar{background:var(--ink-3)}
.gck.x .bar{background:var(--line)}
.gdg .gz{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-2)}
.gdg .gn{margin-top:6px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.gtw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  -webkit-overflow-scrolling:touch}
.gtbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
.gtbl th,.gtbl td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
.gtbl thead th{background:var(--card);font-size:10.5px;letter-spacing:.07em;color:var(--ink-3);font-weight:600;white-space:nowrap}
.gtbl tbody tr:last-child td{border-bottom:none}
.gtbl td{color:var(--ink-2)}
.gnav{display:flex;gap:9px}
.gnav .btn{flex:1;min-width:0;font-size:14px;padding:13px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

const SKELETONS = [{"title": "第一节 · 书信（约 100 词 / 10 分 / 10 分钟）", "warn": "题目给的每一个要点都必须写到，漏一点就扣分。宁可句子简单，也不能漏要点。", "steps": [{"seg": "称呼", "what": "Dear + 对方称谓，单独一行，后面用逗号", "sample": "Dear Mr. Smith,"}, {"seg": "第 1 段", "what": "1–2 句。直接说写信目的，不要绕", "sample": "I am writing to apply for ..."}, {"seg": "第 2 段", "what": "3–4 句。把题目的要点分点写清楚，用 First / Secondly / What is more 串起来", "sample": "First of all, ... Secondly, ... What is more, ..."}, {"seg": "第 3 段", "what": "1–2 句。期待回复 + 致谢", "sample": "I would be grateful if you could ... I am looking forward to your reply."}, {"seg": "落款", "what": "Yours sincerely, 换行写 Li Ming（除非题目指定署名）", "sample": "Yours sincerely,\nLi Ming"}]}, {"title": "第一节 · 通知（约 100 词 / 10 分）", "warn": "通知没有称呼和问候语，用第三人称。时间、地点、对象、事由，四样缺一不可。", "steps": [{"seg": "标题", "what": "NOTICE 居中，全大写", "sample": "NOTICE"}, {"seg": "开头句", "what": "通知对象 + 事由", "sample": "All students are hereby informed that a lecture on ... will be held."}, {"seg": "正文", "what": "时间、地点、主讲人/负责人、活动内容", "sample": "It is scheduled for 2:30 p.m. on Friday, in the Main Lecture Hall."}, {"seg": "要求", "what": "报名方式、截止时间、注意事项", "sample": "Those who are interested should sign up before ..."}, {"seg": "落款", "what": "发布单位 + 日期，右下角", "sample": "The Students' Union\n20 September"}]}, {"title": "第二节 · 概括 + 评论（约 120 词 / 20 分 / 20 分钟）", "warn": "最容易崩的一题。概括别超过全文三分之一，重心必须在评论。绝对不要整句抄原文，要换词换句式。", "steps": [{"seg": "第 1 段（约 35 词）", "what": "概括原文。2–3 句：主题是什么 + 作者的核心观点", "sample": "The passage mainly discusses ... The author points out that ..."}, {"seg": "第 2 段（约 60 词）", "what": "表态 + 两条理由。这是拿分的主体，写足 4–5 句", "sample": "As far as I am concerned, I agree that ... The main reasons are as follows. First, ... Take myself as an example: ... On the other hand, ..."}, {"seg": "第 3 段（约 25 词）", "what": "结论。呼应观点，用一个高级句型收尾", "sample": "To sum up, ... Only in this way can we ..."}]}];

enient. Take myself as an example: I can buy a textbook at midnight without leaving my room."], ["理由 2", "On the other hand, I have more than once received goods that were completely different from the pictures."], ["结论", "To sum up, online shopping is here to stay, but only when the market is properly regulated can consumers really benefit from it."]]}];
const PAPERS = [{"aKind": "便条 · 投诉/请求", "aTask": "你公寓里的冰箱坏了。给房东 Paul 写一张便条，告诉他：", "aPts": ["你遇到的问题", "这带来的不便", "请他来检查一下"], "bKind": "人物故事", "bTopic": "美国老护士创办慈善组织回馈家乡社区", "aModel": "March 30, 2024\nDear Paul,\nI am writing to express my living problems to you. I believe it is essential to bring this matter to your attention in order to seek a resolution.\nThe fridge in my apartment is not working properly, and all the food I bought can not be kept for a long time and goes bad quickly. Also, I can't have cold water whenever I want. This has caused me significant inconvenience and frustration. I hope you can come to check and repair the fridge as soon as possible.\nThank you for your prompt attention to this matter.\nWang Lin", "aTip": "投诉/请求类便条。第一段一句话说明写信目的；第二段把「冰箱坏了」的具体后果写实（食物坏得快、喝不上冷水），再说 This has caused me great inconvenience；第三段请求上门检修 + Thank you for your prompt attention to this matter. 日期可写可不写，落款 Wang Lin。", "bModel": "The article shows us the story of Charlotte Tidwell. When she was young, she was able to study for free because of the kind help of her teacher, and thus made great contributions to her hometown when she grew up.\nIn my opinion, firstly, kindness is a good virtue of a person, which can help many people solve their sufferings and make other people's lives happier. Secondly, kindness can help us become better people. The difference between humans and animals is that humans have good hearts, and by helping other people, we can also get real happiness and satisfaction. Last but not least, kindness is important for not only people but also important to the country. If a country has a kind heart, there won't be wars, and the whole world can be in harmony.\nIn conclusion, everyone should have a kind heart, so that everyone will live happily.", "bTip": "人物故事类。概括段只用两句话交代「谁、因为什么、后来做了什么」；评论段用 firstly / secondly / last but not least 给足三条，每条后面跟一句解释，全部扣住主题词 kindness；结论段 In conclusion, everyone should…, so that…。字数写到 130-140 最稳。", "src": "book", "y": "2024.3", "label": "2024年3月", "bText": "When Charlotte Tidwell was in first grade, the teachers at her school made a bargain: If she helped her mother to clean the building after class, she could attend for free. The teachers' kindness would accompany Tidwell through her life—from being accepted as one of three African Americans in her nursing program and becoming Sparks Hospital's director of medical nursing to founding a charity with which she feeds more than 7,000 people a month in her hometown, Fort Smith. Fort Smith was once a thriving manufacturing town, but it never recovered after its factories started to close in 2000. When Tidwell heard some elderly people were eating cat food out of desperation, she started handing out groceries from a truck. A former boss connected Tidwell with an investor, who gave her the building where her group, the Antioch Consolidated Association for Youth and Family, is based. Tidwell, 69, and her volunteers work ten-to-12-hour shifts at the warehouse Monday to Friday. On Saturdays, they bring food and other sustenance to senior housing complexes. Once, while escorting kids to sing at a home, she saw a man crying. He was reminded that his radio was broken, so Tidwell returned later with a new radio. “The greatest satisfaction is to watch others grow with compassion,” she says. “I see volunteers transformed, and it makes me know we can get back to a community of caring I grew up with.” Decades ago, some teachers changed a little girl's life—now it's payback time."}, {"aKind": "通知邮件", "aTask": "假设你是某公司经理的秘书，现在要用邮件通知全体员工平安夜将举办的晚宴。邮件应包括：", "aPts": ["晚宴的时间和地点", "有谁（可能是重要人物）会来", "一些有趣的活动"], "bKind": "人物故事", "bTopic": "山西青年照顾患渐冻症的母亲 12 年", "aModel": "Dear All,\nI am writing this email to inform you that a dinner party is going to be held on Christmas Eve, since Christmas is around the corner.\nAs a matter of fact, in order to appreciate your diligence and hard work for the year, our company will hold the dinner party at 7pm on December 24th in the CPA Hotel. Apart from all personnel, leaders of the Headquarter, CEO and CFO, will also be attending the party. At the same time, we have prepared some funny and interesting activities at the party. Furthermore, all staff present will get a reward.\nIt is my hope that we all will have a good opportunity to have fun together. Welcome you all.\nYours,\nWang Lin", "aModel2Title": "另一种写法 · 通知体（Notice）", "aModel2": "Notice\nDecember 24th\n\nA dinner party will be held at 7pm on December 24th in the CPA Hotel so as to appreciate your diligence and hard work for the year. All personnel are welcomed to take part in the party. Leaders of the Headquarter, CEO and CFO, will also be attending the event. At the same time, some funny and interesting activities have been prepared at the party. Furthermore, all staff present will get a reward.\nThis party will be a good chance for all staff to communicate and have fun. For more details, please call 987-654-321.\nWang Lin", "aTip": "通知类邮件。开头一句 I am writing this email to inform you that…；第二段把时间、地点、出席人、活动逐条落实；结尾 Welcome you all. 落款 Wang Lin。写成书信体或通知体都可以，本题两种写法都给分。", "bModel": "Recently, a heartwarming story about Yang Zhiyang from Shanxi, China, has caught public attention. His mother, Su Ping, was diagnosed with ALS in 2011, and since then, Yang has been by her side, taking care of her.\nAfter graduating from college, Yang became a full-time carer. He helps his mother with daily activities like getting dressed and eating. He also learned how to do makeup to cheer her up. Even though life is hard, he often takes his mother out to enjoy the outside world. He says these times together are precious, despite the difficulties.\nYang Zhiyang's actions show his deep love and strong sense of responsibility. His story is a beautiful example of love and respect for parents. It makes us realize the importance of family. We should all learn from him and cherish our loved ones.", "bTip": "人物故事类的标准三段：第一段 Recently, a heartwarming story about… has caught public attention. 交代人物和背景；第二段用自己的话复述他做了什么（换主语、换动词，别照抄）；第三段 His actions show… + a beautiful example of… + It makes us realize… + We should all learn from him and…。评论必须扣住原文主题词（love、responsibility）。", "src": "mixed", "y": "2022.9", "label": "2022年9月", "bText": "A young man in China who has spent the last 12 years caring for his severely disabled mother has been praised for his selfless sacrifice on mainland social media. Dutiful son Yang Zhiyang, from Shanxi province in central China, has been looking after his mother, Su Ping, since she was diagnosed with ALS in 2011 which is a progressive disease that affects the spinal cord, causing problems with movement, paralysis and death. When he finished college, Yang became a full-time carer for her, Xinhua News reported. In a viral video, Yang can be seen helping his mother with rehabilitation, he also takes care of her daily needs, from eating to brushing her teeth. The youngster even learned makeup skills to assist his mother. Since her diagnosis, both their lives have changed beyond recognition. Although it presents many difficulties, Yang also takes her out to shop and dine.\"Though it is very hard, it is precious and beautiful for us to look after her,\" he told Xinhua."}, {"aKind": "祝贺信 + 请求", "aTask": "假设你的朋友 Nancy 在英国刚拿到法学博士学位。给她写一封信：", "aPts": ["向她表示祝贺", "告诉她你下个月要去英国开会", "问她有没有时间带你逛逛这座城市"], "bKind": "数据报告", "bTopic": "全球变暖下欧洲极端天气成为「新常态」", "aModel": "Dear Nancy,\nI feel more than excited to write you this letter so as to extend my congratulation to you, since you have just got a Ph.D in law in England.\nAs your good friend, I am so proud of your current achievement that I decide to learn from your effort to become a better self. Furthermore, I miss you so much and your city, England, exerts a tremendous fascination on me. Luckily, I will attend a meeting in England next month and I wonder whether it is possible for you to show me around the city.\nIt is my hope that we will have a happy reunion and at the same time, I am looking forward to hearing from you.\nYours,\nWang Lin", "aTip": "祝贺信 + 请求，三个要点缺一不可。开头用 I feel more than excited to write you this letter to extend my congratulations to you on… 直接点题；第二段先夸对方的成就，再自然过渡到「我下个月来英国开会」；第三段提出请求并期待回信。落款 Wang Lin，不写地址。", "bModel": "The European Environment Agency's report shows that global warming is making extreme weather like heat-waves and floods a common summer occurrence in Europe. It has also affected the world, causing economic losses and endangering lives.\nFrom 1980-2021, EU suffered huge economic losses and many deaths due to weather-related disasters. Similar extreme weather events are happening globally, harming agriculture, infrastructure, and people's health. Qu Sixiao from Roland Berger says human-caused greenhouse gas emissions are the root cause of climate change, which leads to global warming and more extreme weather.\nThe situation is really worrying. We must take action right away. Governments should make strict rules to cut emissions, and we as individuals should also do our part, like using less energy. Only by working together can we save our planet from the bad effects of climate change.", "bTip": "数据报告类材料的标准三段：第一段用 The report shows that… 概括现象；第二段压缩数据（From 1980-2021, EU suffered…）并交代原因（human-caused greenhouse gas emissions are the root cause）；第三段 The situation is really worrying + 政府该做什么 + 个人该做什么 + Only by working together can we…。注意 summarize 段必须换说法，不能整句照抄原文。", "src": "mixed", "y": "2022.3", "label": "2022年3月", "bText": "Under the influence of global warming, extreme weather events such as heatwaves and floods may become Europe's “new normal” in summer and have increasingly affected the European population, economy and nature, the European Environment Agency said in a recent report. Between 1980 and 2021, weather and climate-related extremes caused economic losses estimated at $606 billion in the European Union while nearly 195,000 fatalities have been caused by floods, storms, heat and cold waves, forest fires, and landslides, the agency said. Many other regions across the world have also experienced record-breaking temperatures and precipitation patterns, leading to disruptions in agriculture, infrastructure damage, and threats to human health and safety. Qu Sixiao, senior project manager of the global consultancy Roland Berger, said extreme weather events are caused by the overall climate change, and the core reason for climate change is excessive greenhouse gas emissions from human activities since the industrial era, which surpassed the capacity of the environment. Climate change has two main impacts, he said. On the one hand, it contributes to the rise in global temperatures, which, in turn, leads to increased sea levels, melting of polar ice, and so on. On the other hand, because of global warming, certain areas are experiencing a significant increase in extreme weather events including intensifying temperature variations, enhanced precipitation, and a rise in severe storms or hurricanes."}, {"aKind": "备忘录 Memo · 商务谈判", "aTask": "假设你是某公司经理的秘书，参加了本公司与一家外国公司的谈判。写一份谈判备忘录，包括：", "aPts": ["谈判的时间和地点", "谈判的参与人", "谈判内容，包括达成的协议和仍存在的分歧", "下次谈判的时间"], "aNote": "备忘录不写 Dear/Yours，开头列 From / Subject / Date，正文按四个要点分段。", "bKind": "社会新闻", "bTopic": "女子边充电边打电话，手机爆炸身亡", "aModel": "Memo\nFrom: Cathy\nSubject: Negotiation between Lenovo and IBM\nDate: Nov. 7, 2017\n\nToday, Lenovo and IBM had a negotiation in Diaoyutai State Guest-house. The participants in the negotiation are the managers of Sales Department, Human Resources Department, and Marketing Department of the two companies.\nThey talked about the potential of cooperation of the two companies in the field of high-tech computer products and the possibility of establishing a branch company of IBM in China. On the first problem, the two sides achieved an agreement: IBM will provide the most advanced technology, while Lenovo will take care of marketing and customer service.\nHowever, on the second problem, the two sides did not reach any agreement. Therefore, on Dec. 20, 2017, the two sides will hold a second round of negotiation on this issue.", "aTip": "应用文写作，一封关于商务谈判的备忘录。注意备忘录格式（From / Subject / Date）和正文层次：先写明谈判的时间和地点，接着说明参会人员，然后说明谈判内容包括达成的协议和产生的分歧，最后表明下次谈判的时间。语言简洁明了。", "bModel": "Recently, a tragedy happened in Hebei, China. A very young girl died because of cell phone explosion. Her cell phone exploded when she was talking to her boyfriend at night via cell phone, which is being charged.\nThis sad news caused public discussion all over country. Experts and researchers claimed that cell phone users should avoid of using cell phone when charging them in case of security issues.\nThose people who frequently use cell phones are concerned about the safety of cell phone using. Most users are frightened by this news and promised that they would never use cell phones when it was being charged. Yet, someone intended to question the liability of the phone producers and want to get safety assurance from them.\nIn my opinion, as many cautionary tales as I have heard, I will try to get rid of the cell phone addiction and find other things to do when it is being charged.", "bTip": "总结文章主旨并表达自己观点。不仅要总结文章内容，还要表达自己的观点。先理解文章大意，在此基础上抓住中心思想，进而提出自己的观点。总结要简明扼要，表达观点要条理清晰、论述有力。", "src": "book", "y": "2021.3", "label": "2021年3月", "bText": "A 23-year-old Chinese woman has died after her mobile phone exploded while it was being charged. Miss Zhao was found dead in Shijiazhuang, the capital city of northeast China's Hebei province. She was talking to her boyfriend on her mobile phone, but suddenly went silent. After the boyfriend failed to get a response in a prolonged period of time, he rushed to Zhao's home. It was already too late, as the phone had clearly exploded in her hands, and her entire chest had been burned. This piece of news draws public attention to the using safety of electronic devices, especially the most commonly used mobile phone, and provides information that will be of great value in assessing the safety of cell phone use. Liang Guangchuan, a researcher from Hebei University of Technology, says the tragedy could be caused by a faulty charger and electric leakage of the lithium battery. He suggests that to be on the safe side, one should avoid using his or her mobile phone while it is being charged. This accident caused great response in the population of cell phone users. A cell phone user replied in an interview, “I swear, after I post this comment, I will never play with my mobile phone again when the battery is still being charged.\"A sample of comments on Weibo: “Should the cell phone producer be responsible for this accident and make effort to broadcast the knowledge of cell phone using safety?\""}, {"aKind": "商务信函 · 询价订购", "aTask": "你正在准备一场英语考试，需要一些参考书。给书店销售部门写一封信，询问：", "aPts": ["你想要的书的详细信息", "付款方式", "送货时间和方式"], "bKind": "数据报告", "bTopic": "调查显示多数中国毕业生对薪水期望偏高", "aModel": "Dear Sir or Madam,\nAs I am planning to take the National Entrance Test of English for MA/MS Candidates (NETEM), I have decided to place an order of some NETEM books.\nIn order to fulfill this order, I have several requests. Firstly, please give me particular accounts of the names, authors, publishing houses and prices of these books. Secondly, I also need to know the terms of payment and after-sale service. Thirdly, I wonder if it would be convenient for you to deliver these books by EMS to Shengli Middle School by September 1, 2017. I have arranged to pay for the service.\nI would like to express my gratitude for your kind consideration of my requests. I look forward to hearing from you soon.\nYours sincerely,\nWang Lin", "aTip": "应用文写作，给书店销售部门写信，围绕购买参考书提出具体要求。首先保证格式准确；其次注意时态，基本用一般现在时；最后一定按题目列出的三项要点来写，即所需书籍的详细信息、付款方式、送货时间和方式。落款写 Wang Lin。", "bModel": "A survey recently conducted by a Chinese website shows that college students in China have high expectation for the salaries and other job conditions after graduation.\nIt is clear that Chinese students expect to earn high salary and work in the metropolis even in the first year after graduation. But to their disappointment, the real average salary in big cities are far lower than their expectations according to the statistics. Furthermore, the number of students who already got job offers not very long before graduation is less than half. According to the comments in Weibo, many people hold the opinion that most college students are not realistic and know little about the real status out of the campus.\nAs far as I am concerned, as an undergraduate student, what I can do is to improve myself with professional qualities facing the severe and competitive job market. Only in this way can we deserve a decent job with a high pay.", "bTip": "总结加评论式文章。材料讲毕业季调查显示多数中国毕业生对薪水期望很高，更愿意去一线城市的外企或国企；即使没找到工作，也不降低薪水期望。先总结数据反映的这种社会现象；再把自己从材料中获得的启发或评论作为主体，比如围绕「如何做才能配得上自己期望的高薪」；最后对观点做简要总结。", "src": "book", "y": "2019.9", "label": "2019年9月", "bText": "It's the graduation season again. According to a latest survey, most Chinese graduates have high salary expectations, and thus prefer working for foreign companies or state-owned enterprises in first-tier cities. The survey was conducted by renren. com, a Chinese social media site similar to Facebook. The results show that among 1 ,510 respondents, more than 64. 7 percent want to work in first-tier cities. In addition, 29.4 percent of the graduates who were born in the 1990s want to work for foreign companies, 25.5 percent for SOEs and 23.5 percent for private companies. One interesting revelation is that although there are less than 100 days before graduation and more than half of the respondents have yet to get a job offer, they are not lowering their salary expectations. Apparently, 41.2 percent aim for 8000-10000 yuan ($ 1279- $ 1599) per month and 31. 4 percent for 4000-6000 yuan. According to the data released by the Chinese Academy of Social Sciences, the average monthly salary in Beijing was 5826 yuan （$ 931） last year, while the numbers for Shanghai, Tianjin and Chongqing were 5380, 4058 and 3995 yuan respectively. A sample of comments in Weibo: “\"Are the survey results only jokes for April Fools' Day? Don't daydream anymore! Please check if you have a good command of English and professional skills that deserve a decent job with a high pay.\"Another comment says: \"Some of my classmates got offers from foreign banks, international accounting firms and other famous foreign companies. They are told their yearly salary can reach 100,000 yuan ( $ 15,990). \""}, {"aKind": "申请信 · 留学", "aTask": "假设你是中央美术学院艺术专业的学生，毕业后打算去耶鲁大学读研究生。写一封入学申请信，包括：", "aPts": ["提出申请", "提供个人信息和学术材料", "表达希望得到回复"], "bKind": "研究/观点", "bTopic": "压力清单研究：压力是否真的让人生病", "aModel": "Dear Sir or Madam,\nI am writing to apply for admission to the graduate program in Art of your university, beginning in the fall of 2017.\nIn the summer of 2017, I will graduate as a bachelor of arts from the Central Academy of Fine Arts, China, where I major in Art. I have completed all the required undergraduate courses with satisfactory scores. Official copies of my transcript and of my TOEFL and GRE scores are being sent from the offices concerned. Three recommendation letters are also being sent by my professors. And because I do not have enough funds to finance my education, I would like to apply for a scholarship.\nI am looking forward to your early reply. Please do not hesitate to contact me if any further supporting documents are needed. You can contact me by e-mail at wanglin@163.com. Thank you for your kind assistance in this matter.\nYours sincerely,\nWang Lin", "aTip": "应用文写作，向耶鲁研究生院写申请信。三个要点：提出申请、提供个人信息和学术资料、表达期望回复。提出申请可以开门见山表明写信目的；个人信息和学术资料要具体，也可顺便提出申请奖学金；最后向对方致谢。注意信件格式和语言表达，避免语法失误。（原书范文首句扫描缺失，此处按上下文补写。）", "bModel": "In the 1960s, medical researchers concluded that any major change can be stressful including both negative and positive events, while by the early 1970s, many researches showed that stressful events do harm to our physical and mental health so that if we want to stay healthy, we must avoid stressful events.\nBut this advice is impossible to follow. As we all know, stress is a natural part of everyday life. It is pressure that propels our progress and contributes to our success. It is only when the stress gets out of control that it can lead to poor performance and ill health. Furthermore, humans are full of initiative and creativity that they can face adversity and challenges bravely.\nPersonally, I think it is impossible to avoid stress once one is entirely devoted to things he pursues. Facing all stress in our daily life, we should keep confident and initiative, and try our best to deal with it. Only in this way can we live a happy and healthy life.", "bTip": "总结加评论式文章。材料讲压力对人是否有害：六十年代的研究称任何大的变迁都会带来压力，无论好事坏事；七十年代初有杂志称压力会引发疾病，保持健康就要避开压力事件。材料第三、四段分别反驳了这两个观点。所以要围绕「压力」展开，重点放在如何应对压力。写作用三段式：先简明扼要总结材料大意，再把自己的启发或评论作为主体，最后总结概括自己的观点。", "src": "book", "y": "2019.3", "label": "2019年3月", "bText": "In the 1960s, medical researchers Thomas Holmes and Richard Rahe developed a checklist of stressful events. They appreciated the tricky point that any major change can be stressful. Negative events like \"serious illness of a family member\" were high on the list. but so were some positive lifechanging events, like marriage. When you take the Holmes-Rahe test you must remember that …… we now know that the way you handle these events dramatically affects your chances of slaying healthy. By the early 1970s, hundreds of similar studies had followed Holmes and Rahe. And millions of Americans who work and live under stress worried over the reports. Somehow, the research got boiled down to a memorable message. Women's magazines ran headlines like \"Stress causes illness!\"If you want to stay physically and mentally healthy, the articles said, avoid stressful events. But such simplistic advice is impossible to follow. Even if stressful events are dangerous, manylike the death of a loved one-are impossible to avoid. Moreover, any warning to avoid all stressful events is a prescription for staying away from opportunities as well as trouble. Since any change can be stressful, a person who wanted to be completely free of stress would never marry, have a child, take a new job or move. The notion thal all stress makes you sick also ignores a lot of what we know about people. It assumes we're all vulnerable and passive in the face of adversity. But what about human initiative and creativity? Many come through periods of stress with more physical and mental vigor than they had before. We also know thal a long time without change or challenge can lead to boredom, and physical and mental strain."}, {"aKind": "道歉信", "aTask": "你和王教授约好了见面，但没能赴约。给老师写一封信，内容包括：", "aPts": ["为失约道歉", "向老师说明原因", "表达再约一次的愿望"], "bKind": "研究报道", "bTopic": "研究称长得帅的男性在竞争性职场反而更难拿到 offer", "aModel": "Dear Prof. Wang,\nI do know that this is very impolite and must have caused you much trouble.\nI do reckon that at present any explanation is pale and futile. However, I do not want you to misunderstand me. On my way to your office, an old lady suddenly fainted due to heart attack on the bus. I stopped a taxi and sent her into a nearby hospital. I stayed there until her son came, which spoiled our appointment.\nI am aware that our appointment is of importance. I do hope that you would be kind enough to spare your valuable time to meet me. I am looking forward to hearing from you.\nYours sincerely,\nWang Lin", "aTip": "应用文写作，一封道歉信。注意信件格式和正文层次：第一段先道歉，接着说明原因，最后恳切请求再约并回信。注意结尾和落款，落款写 Wang Lin。（原书此处误写成 Li Ming，按题目要求应为 Wang Lin。）", "bModel": "There might be a common view that good-looking people can take advantages of their superior appearances in the daily life, especially for the pretty men in the job hunting market.\nHowever, according to a new research, good appearance is no longer been the silver bullet in a job. The results showed that although there was still a preference to cooperate with the attractive man and compete against the unattractive man, and did not mind to work with them. However, people were not likely to pick a good-looking man as their potential competitors.\nIn my opinion, we should not depend ourselves on our appearance in terms of job hunting. Good appearance may bring us some benefits, but what is highly valued in the job market is our talents and abilities.", "bTip": "总结文章主旨并表达自己观点。先理解文章大意，抓住中心思想，然后提出自己的观点。总结要简明扼要，表达观点要条理清晰、论述有力。", "src": "book", "y": "2018.9", "label": "2018年9月", "bText": "You might think that good-looking men have every advantage in life. But new study suggests being handsome may not always work in a man's favour — at least when it comes to his career. The research claims that attractive men are less likely to be given a job in a competitive workplace because they intimidate bosses. “It's not always an advantage to be pretty,\" says Marko Pitesa, an assistant professor at the University of Maryland. “It can backfire if you are perceived as a threat.\"Interestingly, in Pitesa's study, it was male attractiveness in particular, rather than female beauty, that made the most difference. If the interviewer expected to work with the candidate as part of a team, then he preferred good-looking men. However, if the interviewer saw the candidate as a potential competitor, the interviewer discriminated in favour of unattractive men. The results suggest that interviewers were not blinded by beauty, and instead calculated which candidate would further their own career. \"The dominant theoretical perspective in the social sciences for several decades has been that biases and discrimination are caused by irrational prejudice,\"Pitesa says. “The way we explain it here, pretty men just seem more competent, so it is actually subjectively rational to discriminate for or against them.\"On a deeper level, she adds, the behaviour remains irrational, since there's no evidence that a real link exists between looks and competence."}, {"aKind": "书信 · 介绍近况", "aTask": "给 Andy 写一封信，讲讲你的近况。信中必须包括：", "aPts": ["你的家庭", "你的学校或工作", "你的爱好"], "bKind": "议论/说明文", "bTopic": "计算机教育在现代生活中的重要性", "aModel": "Dear Andy,\nHow is it going recently? I'm writing to tell you something about my situation.\nI have a really amazing family, my father is a doctor and my mother is a nurse. They are very busy but every weekend we get together to enjoy our family time. Besides, I have been admitted to a nice corporation, and it's really a nice job for me. I'm very happy to work there. What's more, I also have lots of hobbies such as swimming, skating and so on. How about you?\nExpect to hear from you!\nYours sincerely,\nWang Lin", "aTip": "应用文，信件。注意信件格式和正文层次。按题目要求分三层写：先介绍家庭情况，再介绍学校或工作，最后介绍自己的爱好。注意结尾和落款，语言简洁明了。", "bModel": "It is well-known that the usage of computer is very popular. It has been developed a lot since it appeared. Also, our daily life has greatly changed because of it, especially education.\nEducation, especially the education reforms in different countries, has been experiencing the great help from the Internet. Generally speaking, education is a field which needs more information while the Internet is a good information provider. Also, with the aid of the Internet, persons who are related to education, such as teachers, students and parents are easily to get in touched with each other, and it can make the education an effective combination. Meanwhile, computers with pictures, videos, even music can help the classes and lectures much more instructive, interesting and absorbing as well.\nTherefore, computers and its Internet should be regarded as an important media in the modern education.", "bTip": "总结文章主旨并表达自己观点。先理解文章大意，再在抓住中心思想的基础上提出自己的观点。总结要简明扼要，表达观点要条理清晰、论述有力。", "src": "book", "y": "2018.3", "label": "2018年3月", "bText": "Computer is playing vital role in modern life. Computer education has great importance because use of computer has reached almost all spheres of life. The modern life of today includes information and contacts with people all over the world. Computer has helped considerably to achieve this. This is possible through computer education when a person knows the use of computer, he can employ in his business, for planning and chalking out programmed calculations and statical works. The Internet helps to have contact with any one in any part of the world. Today, by the help of Internet, business has progressed very much. This is also possible with the knowledge of computer. Today computer education is must for the job of even an ordinary clerk in the office. The knowledge and use of computer is essential for him. In modern countries the running of trains, machines, the flight of planes, the work in the bank and progress of business, all these are controlled by computer. This is possible only by the knowledge and use of computer. Computer education enables the artist in creating the realistic images. In the field of entertainment too, musicians, having computer education, create multiple voice composition and the play back music with hundreds of variations. Not only this, the knowledge of computer helps in domestic work likes making the home budget doing calculations, and playing with confidence."}, {"aKind": "请假邮件", "aTask": "你在一家外企工作，现在想请几天假。给老板 Mr. Smith 写一封邮件，告诉他：", "aPts": ["你为什么请假", "你想请多久", "手头的工作你打算怎么安排"], "bKind": "社会现象/报道", "bTopic": "《地球脉动 II》在年轻观众中盖过选秀节目", "aModel": "Dear Mr. Smith,\nDue to the bad cold I got yesterday, I didn't feel well and went to hospital. After the examination, the doctor suggested that I should have a rest for at least two days. Therefore, I'd like to ask for a leave of two days, starting from September 18 to September 19 and the doctor's certificate is enclosed.\nI will be very grateful if you can grant my leave of absence. As to the work to be missed during my absence, I promise to make them up when I come back.\nYours sincerely,\nWang Lin", "aTip": "应用文，电子邮件，内容是请假条。注意邮件格式和正文层次：开头说明请假原因，其次写明请假时间，最后说明对手头工作的安排。注意结尾和落款。", "bModel": "According to BBC, the Planet Earth II is more popular than The X Factor among young people. It succeeds in both technology and music. After watching the show, many young people realize that the environment has been destroyed and they should protect the environment. In my opinion, three things should be done.\nFirstly, saving water. Water is the source of life. No water, no life. So it's very important for us to do so. Not only should we protect drinking water and stop polluting it, but also make full use of it. Secondly, saving forests. They are useful. We should stop cutting them down and use recycled paper instead so that we can make our world a green one to live in. Lastly, recycling useful rubbish. Plenty of rubbish can be recycled like cans, paper, bottles, and so on. We can save resources in this way.\nIn a word, we only have one Earth. We should do what we can do to protect the environment.", "bTip": "总结文章主旨并表达自己观点。先理解文章大意，再在抓住中心思想的基础上提出自己的观点。总结要简明扼要，表达观点要条理清晰、论述有力。", "src": "book", "y": "2017.9", "label": "2017年9月", "bText": "It seems the nation's younger citizens are finally favoring the beauty of the natural world over the cries of amateur singers. The BBC has confirmed that the first three episodes of Planet Earth II have attracted more viewers in the 16 to 34 age group than The X Factor. The best ratings so far were for the second episode, which brought in 1.8 million young viewers compared to The X Factor's 1.4 million. The show's narrator, Sir David Attenborough, credited improvements in technology with the show's increased success in its second season, which have brought animals close to the viewer and made their environments look real. \"You feel like the camera is with the animals,\" said producer Mike Gunton. “It's very active. For example, you see a monkey leaping through the forest. Normally you'll stand back to film that. But here the monkey almost jumps over your shoulder. The camera is running with it. Visually, Planet Earth told you to look down on the Earth and see the scale of the planet. What Planet Earth II is doing is saying ' Let's get ourselves into the lives of the animals, and see it from their perspective.'\" \"The music of Hans Zimmer is also a big factor,\" added Attenborough. “ That pleases me enormously.\"Besides technology and music, Attenborough said that viewers are “reconnecting with a planet whose beauty is spoiled and whose health is failing. \"He believes that young people are learning that their future is linked to that of the environment."}, {"aKind": "投诉邮件 · 商品问题", "aTask": "你从一家美国网上书店买的书有问题。给书店写一封邮件，说明：", "aPts": ["你什么时候买的这本书", "你发现书有什么问题", "你希望怎么解决"], "bKind": "人物故事", "bTopic": "12 岁女孩误入半程马拉松，坚持跑完全程", "aModel": "Dear Sir/Madam,\nI bought Pride and Prejudice from your online bookstore last Friday, and I received it yesterday. Jane Austen is my favorite writer so I started to read it last night, and unfortunately I found some problem with the book: I ordered a hardback version, but you sent me the paperback!\nNow I want to mail the book back for a change, and the post charge should be on your side, or you can refund me triple price difference for my lost.\nI hope you can check my order and contact me as soon as possible for the solution of this problem.\nYours,\nWang Lin", "aTip": "应用文，一封电子邮件。首先保证格式正确；其次注意时态，基本用一般现在时或一般过去时；最后按题目给出的三个要点来写。语言简洁明了。", "bModel": "A 12-year-old girl, when she accidentally ran into a half marathon race, did not drop out the game, but kept running. She finished the race and won a medal. When asked, she said she decided to just keep running and not give up. This moved us greatly, as well as her own mother.\nIn daily life, many people give up easily for hardship, for money, for something else. Maybe they have a lot of reasons for the giving-up, but that's why they cannot taste the happiness when they stick to the end and finally achieve something.\nFor students, study also requires long-term hardworking. We should not give up, but keep it up. Thus, we can equip us with useful knowledge and have a bright future.", "bTip": "总结 + 评论型。先把材料大意用英文清晰表达出来；再以自己从材料中获得的启发或评论作为主体；最后对观点做简要总结。", "src": "book", "y": "2017.3", "label": "2017年3月", "bText": "Lee Rodriguez-Espada, 12, was late to the Wegmans Family 5k Sunday in Rochester, New York. To save time, her mom dropped her near the starting line before parking the car. Lee rushed to the starting line only to realize the race had already begun. She was told to just start running and quickly fell into pace with the others. Meanwhile her mom found a spot at the finish line, expecting to congratulate her daughter within the hour. Concentrating on running, Lee didn't realize until mile 4 that the finish line was nowhere in sight. Turning to another runner, she asked how much further. \"That's when it struck me I was in the half marathon instead of the 5k,\"Lee said afterwards. Instead of dropping out, she decided to keep running. Realizing Lee wasn't among the runners crossing the 5k finish line, her mom alerted race officials and the police. A police officer eventually found Lee on the course of the Flower City Half Marathon. The girl said she knew her family was worried but she couldn't quit. She needed to finish the race. And as she finally crossed the finish line, after running 10 miles more than she had planned, her mother cried tears of joy.\"I see her with a medal and I thought, Oh my gosh, she …… \" \"I'm really proud,\" said Lee, whose next race is this weekend."}, {"aKind": "自荐邮件 · 申请当志愿者", "aTask": "本地环保组织正在招募志愿者，你愿意加入。给招募方写一封邮件，告诉他们：", "aPts": ["为什么你想当志愿者", "你能为这个组织做什么", "你什么时候有空"], "bKind": "故事寓意", "bTopic": "富翁为避光花五千美元把房子弄黑，却没想到买墨镜", "aModel": "Dear Sir/Madam,\nI am a student who is Senior Two in High School. I am writing to fight for the opportunity of being a volunteer which will help improve the environmental condition in our city.\nFirstly, I am in favor of the idea that environment takes a very important role in the society, and it deserves more and better care from human beings. Then, as for me, I'm outgoing and willing to get along well with my co-workers. I am always helpful and warm-hearted. I have the ability to ……. I'd be very grateful if you give me the opportunity. I will be available at every weekends.\nI am looking forward to your reply.\nYours truthfully,\nWang Lin", "aTip": "应用文，一封自荐信。首先保证格式正确；其次注意时态，基本用一般现在时或一般过去时；最后按题目给出的三个要点来写。语言简洁明了。", "bModel": "A millionaire had a severe eye disease, and his doctor suggested that he should avoid bright light. Therefore, he spent $5,000 to make his house completely dark instead of buying a pair of sunglasses to solve the problem.\nAfter we read the story, we may think how stupid the millionaire is. But as far as I'm concerned, we are often the millionaire in our daily life. We often choose a complicated way to overcome the problems we come across in our study and work instead of a more effective and energy-saving way. As the old saying goes \"Work smart, not hard.\", we should learn how to work smart.\nIn other words, when we come to some problems in life, we should calm down and take action.", "bTip": "总结 + 评论型。先根据题目要求把材料大意用英文清晰表达出来；其次以自己从材料中得到的启发或评论作为主体；最后对自己的观点做简要总结。", "src": "book", "y": "2016.9", "label": "2016年9月", "bText": "A millionaire in New York suffered from a severe eye disease. He got a famous doctor to treat his eye. The doctor performed a minor operation on the millionaire, gave him some medicine and advised him to avoid bright light for one month so as to add to the treatment and ensure speedy recovery. On arriving home, the millionaire immediately acted on the doctor's advice. He closed all his windows, replaced the colorful curtains with dark heavy ones, removed his bright ceiling lights and used dim bulbs. In a word, he went to great lengths to make his house completely dark. Two weeks later, the doctor paid a visit to the millionaire to enquire about his recovery. …… \"To this,\" said the millionaire proudly. \"Not the lowest beam of light inside. I spent $5,000 on the changes to the house. I followed your advice faithfully. \" \"You sure did,\" replied the doctor, but he found it hard to say that it was a matter of plain common sense that the millionaire could have bought a pair of sunglasses, which would cost much less, rather than spending so much money making the house darker, in order to avoid bright light."}, {"aKind": "论坛发帖 · 经历 + 建议", "aTask": "你刚经历了一次糟糕的境外旅行。在一个英文旅游论坛发帖：", "aPts": ["向其他旅行者讲讲你的糟糕经历", "给他们一些出行建议"], "bKind": "书信/道理", "bTopic": "父亲写给女儿 Sally 的信：This, too, shall pass away", "aModel": "Hello, everyone. I just came back from a seven-day trip to Paris. Although it is a beautiful city, the bad experiences happened there made me feel unhappy and depressed. During the first three days, I enjoyed the beautiful scenery in Paris. However, on the fourth day, when we were taking the subway, a black man suddenly rushed up to the girl sitting next to me, taking her bag and running away in the blink of an eye. It was said that Paris had bad public security. So, if you plan to visit Paris, be aware of taking care of your valuables. And you'd better come there with your family or friends.\nWang Lin", "aTip": "应用文，网络论坛发帖。格式上按非正式文体正常书写即可。时态基本用一般过去时或现在完成时。按题目要求写两方面：不愉快的旅行经历 + 旅行建议。语言简洁明了。", "bModel": "Sally's father wrote her a letter. In the letter, firstly, he congratulated her on her success in the dance performance last week. Secondly, her father shared a quote with her: \"This, too, shall pass away.\"\nIn truth, this sentence can be applied to many situations. When we are in a successful moment in life just like Sally, we have to remember that we cannot always be successful. This moment shall quickly pass away. If you want a continued success, we should do more. When we face difficulties, we also need to know that we have infinite capacity to adapt to life's changes.\nWhether in happiness or in misery, we should keep in mind that: this, too, shall pass away.", "bTip": "总结性作文。先总结文章内容，再表达自己的观点。要求高度凝练文章大意，在抓住中心思想的基础上提出自己的观点。总结要简明扼要，表达观点要条理清晰。", "src": "book", "y": "2016.3", "label": "2016年3月", "bText": "Dear Sally, It was amazing to see your dance performance last weekend. I felt so proud of you when your teacher and schoolmates congratulated you upon your completion of the performance. While you continue to enjoy the moment, I'd like to share with you a small quote from Abraham Lincoln, \"This, too, shall pass away. \"I want these words to be your guide at every turning point in your life. When you're feeling very proud of yourself at an achievement, knowing no bounds at that moment, remember that \"This, too, shall pass away.\"When you're at a difficult moment in your life and don't know what to do, find comfort in the same words — \"This, too, shall pass away. \"I'm not saying that the ache of some losses and setbacks will completely go away from your life. In fact, often the memories of painful events will hit you unexpectedly like tons of bricks and take your breath away years after they happen. But, like all humans, you have an almost infinite capacity to adapt to life's changes and a great ability to bounce back from trying times. This understanding should give you a spark of hope when you're in a season of despair; it should also build up your confidence for taking risks in the future. Sally, our lives are made up of several peaks and several valleys. That's the nature of life. Live each moment as it comes. And always remember \"This, too, shall pass away. \"Love, Papa"}, {"aKind": "电子邮件 · 叙述经历", "aTask": "朋友 Paul 想详细了解你暑假在餐厅打的兼职。给 Paul 写一封邮件，告诉他：", "aPts": ["你在这份工作里做了什么", "你对工作环境和同事的感受", "你从这份工作中学到了什么"], "bKind": "人物故事", "bTopic": "患多发性硬化症的女性登顶七大洲最高峰", "aModel": "Dear Paul,\nAs you know, during this summer vacation, I've taken a part-time job as a waiter in ABC restaurant. Most of the time, I was asked to serve customers, including placing orders, cleaning the table, etc. The restaurant is well decorated and the environment is very comfortable. In addition, the co-workers there are easy-going. The most important thing I learn from being a waiter is that you need to be patient and nice to customers. Did you do something exciting this summer? Tell me about it.\nI'm looking forward to seeing you soon.\nYours sincerely,\nWang Lin", "aTip": "应用文，电子邮件。先注意邮件格式，其次注意写信人与收信人的关系，最后注意正文层次：开头介绍工作内容，其次介绍工作环境和同事，最后说明从这份工作中学到的东西。注意结尾和落款。", "bModel": "Lori Schneider, a 53-year-old woman, is the first person with multiple sclerosis to scale the highest mountains on the Seven Summits. It's actually a difficult thing, even for a healthy man. How on earth did she overcome fear?\nFirstly, we should learn to calm down while meeting some urgent situations. Fear may bring physical and mental torture. If we are in panic, the chance of success will slip away.\nSecondly, it's important to know certain ways to conquer fear. Psychological hint is a good way. Just as Lori Schneider did, you can repeat to yourself \"Don't let fear in.\"\nFinally, we should think over the situation. Asking for help may be beneficial. Of course, most of the time we must depend on ourselves.\nIn a word, we should have a strong mental quality to conquer fear. We need learn to be stronger.", "bTip": "总结文章观点并表达自己观点。先总结文章大意，再在抓住中心思想的基础上提出自己的观点。总结要简明扼要；表达观点要条理清晰，分点叙述。", "src": "book", "y": "2015.9", "label": "2015年9月", "bText": "8,000 feet on both sides,\" says the 53-year-old climber of ascending Mount Everest last spring. \"The wind was blowing at 60 miles an hour. If there was ever a moment to panic, this was it. \"But she didn't. An hour later, she reached the peak — the last step in her personal challenge to scale the highest mountains on all seven continents. Ten years earlier, she'd come face-to-face with a different type of fear, when she was unable to feel anything in the right side of her body. After learning she had multiple sclerosis (MS) — a serious illness that gradually makes a person weak and unable to move or see, she left her marriage, job, and home: “I ran from my whole life.\"It was just before climbing South America's Mount Aconcagua in 2000 that she set her sights on the Seven Summits. After training by pulling 50-pound bags of dog food up the ski slopes near her home, she topped Europe's Mount Elbrus in 2002, North America's McKinley in 2006, and Australia's Kosciuszko and Antarctica's Vinson Massif in 2008. She'd scaled Africa's Kilimanjaro in 1993. That left Asia's Everest, the highest of all. And there she stood, on a ridge at 28,800 feet. \"When I trained, I told myself to take one …… to the top. She's the first person with MS to conquer the Seven Summits. With her condition stable, she plans a return to Kilimanjaro — this time with 15 others with MS by her side."}];

g argument, she finally gave in.", "争论了很久，她最终让步了。"], "341": ["These flowers give off a sweet smell at night.", "这些花在夜里散发出甜香。"], "346": ["My grandfather goes in for swimming every morning.", "我爷爷每天早上都去游泳。"], "347": ["The alarm clock went off at half past five.", "闹钟五点半响了。"], "350": ["He went on writing even after the lights were turned off.", "灯关了之后他还在继续写。"], "351": ["She finished her report and went on to answer questions.", "她做完报告，接着开始回答提问。"], "353": ["Let's go over the notes once more before the exam.", "考试前我们再把笔记过一遍。"], "354": ["The company went through a difficult period last year.", "公司去年经历了一段困难时期。"], "357": ["They had to go without electricity for two days.", "他们不得不两天没有电。"], "358": ["Something went wrong with the printer this morning.", "今天早上打印机出了点毛病。"], "359": ["He is good at solving problems under pressure.", "他擅长在压力下解决问题。"], "362": ["A short walk after supper will do you good.", "晚饭后散会儿步对你有好处。"], "366": ["She grew up in a small town near the river.", "她在河边的一个小镇长大。"], "367": ["He is in the habit of reading before he sleeps.", "他有睡前看书的习惯。"], "370": ["Try to form the habit of writing down new words.", "试着养成记生词的习惯。"], "375": ["On the one hand it saves money; on the other hand it takes time.", "一方面它省钱，另一方面它费时间。"], "377": ["This ring was handed down from my grandmother.", "这枚戒指是我奶奶传下来的。"], "378": ["All papers must be handed in before Friday noon.", "所有论文必须在周五中午前交。"], "379": ["The volunteers handed out free maps at the gate.", "志愿者在门口分发免费地图。"], "380": ["He handed over the keys and left without a word.", "他交出钥匙，一句话没说就走了。"], "381": ["Hang on a moment — I will check the timetable for you.", "稍等一下，我帮你查一下时刻表。"], "383": ["She said goodbye and hung up.", "她说了再见就挂了电话。"], "384": ["I happened to meet him at the airport.", "我碰巧在机场遇见了他。"], "392": ["He hardly ever watches television on weekdays.", "他工作日几乎从不看电视。"], "393": ["Hardly had we sat down when the phone rang.", "我们刚坐下电话就响了。"], "394": ["Staying up late does harm to your health.", "熬夜对你的健康有害。"], "397": ["The teacher had u w5": ["I am writing to invite you to give a talk at our English Club.", "我写信是想邀请你来我们英语社做一次讲座。"], "w6": ["I was delighted to receive your letter last week and to hear that you are well.", "上周收到你的来信、得知你一切都好，我很高兴。"], "w7": ["I am sorry it has taken me so long to reply; I have been busy with my final exams.", "抱歉这么久才回信，我一直在忙期末考试。"], "w8": ["Allow me to introduce myself first: my name is Li Ming and I am a second-year student.", "请允许我先做个自我介绍：我叫李明，是一名大二学生。"], "w9": ["I wonder if you could send me the timetable before the end of this month.", "不知你能否在本月底前把时间表发给我。"], "w10": ["I would be grateful if you could reply before next Monday.", "如果你能在下周一前回复，我将不胜感激。"], "w11": ["I would like to know whether the course is open to beginners.", "我想了解这门课是否对初学者开放。"], "w12": ["To be specific, what I would like to know is the deadline for application.", "具体来说，我想问的是申请的截止日期。"], "w13": ["There are two points I would like to make about the arrangement.", "关于这个安排，有两点我想说明。"], "w14": ["First of all, the room is too small. Secondly, it is quite far from the library.", "首先，房间太小；其次，离图书馆相当远。"], "w15": ["As for the fee, my idea is that we should share it equally.", "至于费用，我的想法是我们应该平摊。"], "w16": ["I hope you will take my application into consideration.", "希望你能考虑我的申请。"], "w17": ["I am enclosing my résumé and two photos for your reference.", "随信附上我的简历和两张照片供你参考。"], "w18": ["Please reply at your earliest convenience, as the deadline is next Friday.", "请尽早答复，因为截止日期是下周五。"], "w19": ["I am looking forward to your reply.", "期待你的回复。"], "w20": ["Thank you in advance for your help with my application.", "提前谢谢你在我申请上的帮助。"], "w21": ["Please contact me at 138-0000-0000 if you need any further information.", "如需更多信息，请拨打 138-0000-0000 与我联系。"], "w22": ["I apologize for any inconvenience caused by the change of date.", "对改期造成的不便，我深表歉意。"], "w23": ["I hope to see you soon at the opening ceremony.", "希望能在开幕式上尽快见到你。"], "w24": ["Yours sincerely,\nLi Ming", "此致敬礼，\n李明"], "w25": ["All students are hereby informed that the library wi
