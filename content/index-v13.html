const ALL = DATA.concat(EXTRA).sort((a,b)=>a.i-b.i);
const EXAM = new Date(2026,8,19);
const DAY = 864e5;
const KEY = "pets3-collocations-v1";
const STEPS = [0,1,2,4,7,15];   // 答对第 n 次后隔几天再见：当天 / 1 / 2 / 4 / 7 / 15
const MASTER = 4;               // 连着答对 4 次算「熟」
const EXAM_T = Math.floor(new Date(2026,8,19)/864e5);

let st = load();
function load(){
  let s = null;
  try{ const r = localStorage.getItem(KEY); if(r) s = JSON.parse(r); }catch(e){}
  if(!s) s = {cards:{}, day0:today(), pairs:{}};
  if(!s.log) s.log = {};
  if(!s.cfg) s.cfg = {};
  if(typeof s.cfg.perDay !== "number" || !isFinite(s.cfg.perDay)) s.cfg.perDay = 33;
  s.cfg.perDay = Math.max(5, Math.min(200, Math.round(s.cfg.perDay)));
  if(s.cfg.scope !== "all" && s.cfg.scope !== "core") s.cfg.scope = "core";
  return s;
}
function perDay(){ return st.cfg.perDay; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function today(){ const d=new Date(); return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/DAY); }

const T = today();
document.getElementById("days").textContent =
  Math.max(0, Math.ceil((EXAM - new Date())/DAY));

function pool(){ return st.cfg.scope==="all" ? ALL : DATA; }
function unlearned(){ return pool().filter(c => !st.cards[c.i]); }
// 今天还能新学几条：额度减去今天已经学掉的，断更不累积
function quotaLeft(){ return Math.max(0, perDay() - todayLearned()); }
function newPool(){ const n = quotaLeft(); return n>0 ? unlearned().slice(0, n) : []; }
function dayEntry(k){
  const e = st.log[String(k)];
  if(!e) return null;
  if(e.wn===undefined){ e.wn = 0; e.wr = 0; }   // 迁移旧记录
  return e;
}
function todayLearned(){ const e = dayEntry(T); return e ? e.n : 0; }
function todayReviewed(){ const e = dayEntry(T); return e ? e.r : 0; }
function duePool(){
  return pool().filter(c => { const s=st.cards[c.i]; return s && s.due<=T; });
}
function hardPool(){
  // 错过两次以上、并且还没刷熟的：刷熟了就从错题本毕业，历史错误次数照旧保留
  return ALL.concat(typeof WRITING==="undefined"?[]:WRITING)
             .filter(c => { const s=st.cards[c.i]; return s && s.miss>=2 && s.box < MASTER; });
}
function hardEverCount(){
  return ALL.concat(typeof WRITING==="undefined"?[]:WRITING)
            .filter(c => { const s=st.cards[c.i]; return s && s.miss>=2; }).length;
}
function cardLabel(c){ return isWritingCard(c) ? ("写作 · "+c.g) : ("第 "+c.i+" 条"); }
function doneCount(){ return pool().filter(c=>{const s=st.cards[c.i];return s&&s.box>=MASTER;}).length; }

function clampDue(d){
  // 考前一天以后的复习没有意义，一律拉回考前
  return (EXAM_T - 1 > T && d > EXAM_T - 1) ? EXAM_T - 1 : d;
}
function isWritingCard(c){ return typeof c.i==="string" && c.i.charAt(0)==="w"; }
function logDay(isNew, isWriting){
  let e = st.log[String(T)];
  if(!e) e = st.log[String(T)] = {n:0, r:0, wn:0, wr:0};
  if(e.wn===undefined){ e.wn = 0; e.wr = 0; }
  if(isWriting){ if(isNew) e.wn++; else e.wr++; }
  else         { if(isNew) e.n++;  else e.r++;  }
}

/* ---------- 使用时长：只算「页面可见 + 近两分钟有操作」的时间 ---------- */
const IDLE_MS = 120000, TICK_MS = 5000, SAVE_MS = 30000;
let _tick = Date.now(), _act = Date.now(), _saved = Date.now(), _dirty = false;

function dayKeyNow(){ const d=new Date(); return String(Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/DAY)); }
function logEntry(k){
  let e = st.log[String(k)];
  if(!e) e = st.log[String(k)] = {n:0, r:0, wn:0, wr:0};
  if(e.wn===undefined){ e.wn = 0; e.wr = 0; }
  return e;
}
function daySecs(idx){ const e = st.log[String(idx)]; return (e && e.t) ? e.t : 0; }

function accrue(){
  const now = Date.now(), dt = now - _tick;
  _tick = now;
  if(document.hidden) return;                 // 切走了不算
  if(dt <= 0 || dt > TICK_MS*4) return;       // 息屏 / 重新唤醒，这段跳过
  if(now - _act > IDLE_MS) return;            // 两分钟没动，当作没在看
  const e = logEntry(dayKeyNow());
  e.t = (e.t || 0) + dt/1000;
  _dirty = true;
}
function flushTime(force){
  accrue();
  if(_dirty && (force || Date.now() - _saved > SAVE_MS)){ save(); _saved = Date.now(); _dirty = false; }
}
["pointerdown","keydown","touchstart","wheel","scroll"].forEach(ev=>
  document.addEventListener(ev, ()=>{ _act = Date.now(); }, {passive:true}));
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) flushTime(true);
  else { _tick = Date.now(); _act = Date.now(); }
});
window.addEventListener("pagehide", ()=>flushTime(true));
window.addEventListener("blur", ()=>flushTime(true));
setInterval(()=>{ flushTime(false); tickUsageUI(); }, TICK_MS);

function fmtDur(sec){
  const m = Math.round(sec/60);
  if(m < 60) return m + " 分";
  return Math.floor(m/60) + " 小时 " + (m%60) + " 分";
}
function tickUsageUI(){
  const el = document.getElementById("u-today");
  if(el) el.textContent = fmtDur(daySecs(Number(dayKeyNow())));
}
function grade(c, ok){
  const fresh = !st.cards[c.i];
  const s = st.cards[c.i] || {box:0, miss:0, due:T};
  if(ok){ s.box = Math.min(STEPS.length, s.box+1); s.due = clampDue(T + STEPS[s.box-1]); }
  else { s.miss++; s.box = 0; s.due = T; }
  st.cards[c.i] = s;
  logDay(fresh, isWritingCard(c));
  save();
}

let mode="today", queue=[], relearn=[], flipped=false, cur=null;

function buildQueue(){
  relearn=[];
  if(mode==="today") queue = newPool();
  else if(mode==="review") queue = duePool();
  else if(mode==="hard") queue = hardPool();
  else if(mode==="pair") queue = shuffle(PAIRS.map((p,i)=>({p,i})));
  else if(mode==="write") queue = (wsub==="cards" && wgroup) ? writePool(wgroup) : [];
  else if(mode==="gram") queue = [];
  else queue = [];                       // 「我的」「全表」这些页面没有卡，别留着上一页的残队列
  next();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function next(){
  flipped=false;
  if(queue.length) cur = queue.shift();
  else if(relearn.length) cur = relearn.shift();
  else cur = null;
  render();
}

const stage = document.getElementById("stage");

function stats(){
  const N = pool().length;
  document.getElementById("s-new").innerHTML = todayLearned()+"<small>/"+perDay()+"</small>";
  document.getElementById("s-due").textContent = duePool().length;
  const d = doneCount();
  document.getElementById("s-done").innerHTML = d+"<small>/"+N+"</small>";
  document.getElementById("bar").style.width = (100*d/N).toFixed(1)+"%";
}

function render(){
  stats();
  const hideChrome = (section !== "word");
  const statsEl = document.querySelector(".stats");
  const barEl = document.querySelector(".bar");
  if(statsEl) statsEl.hidden = hideChrome;
  if(barEl) barEl.hidden = hideChrome;
  const howEl = document.getElementById("globalhow");
  if(howEl) howEl.hidden = hideChrome;
  renderNav();
  if(mode==="cfg"){ renderMy(); return; }
  if(mode==="list"){ renderList(); return; }
  if(mode==="write"){ renderWrite(); return; }
  if(mode==="gram"){ renderGram(); return; }
  if(!cur){
    const EMPTY = {
      today:  unlearned().length===0
        ? ["这个范围全学完了。", "去「我的」把范围换成全部 900 组，或者专心刷复习和错题。"]
        : ["今天的额度用完了。", "还有 "+unlearned().length+" 条没学 —— 切到「复习到期」把今天学的当场再过一遍；真想加量就去「我的」调高每日新学量。"],
      review: ["没有到期要复习的。", "明天再来，或者去「今日新词」推进新的一批。今天新学的会在当天进这里等你回头再过一遍。"],
      hard:   hardPool().length===0
        ? ["错题本是空的。", "同一条答错两次以上会被收进来，刷熟（连对四次）之后自动毕业 —— 单词和写作句型都算。"]
        : ["这一轮过完了。", "还有 "+hardPool().length+" 条没毕业：连对四次才算刷熟，它们明后天还会回来。"],
      pair:   ["冠词对比过完了。", "再点一次「冠词对比」会重新洗牌。"]
    };
    const m = EMPTY[mode] || ["这一组清空了。", ""];
    stage.innerHTML =
      '<div class="card"><div class="prompt">'+m[0]+'</div>'+
      '<div class="hint">'+m[1]+'</div></div>';
    return; }

  if(mode==="pair"){ renderPair(); return; }

  renderCard(cur, cardLabel(cur));
}

function exampleBlock(id){
  const ex = EXAMPLES[String(id)];
  if(!ex) return '';
  return '<div class="example">'+
    '<span class="ex-tag">例句</span>'+
    '<span class="ex-en">'+esc(ex[0])+'</span>'+
    '<span class="ex-zh">'+esc(ex[1])+'</span>'+
  '</div>';
}

function renderCard(c, label){
  const s = st.cards[c.i];
  stage.innerHTML =
    '<div class="card">'+
      '<div class="meta"><span>'+esc(label)+'</span>'+
        (s&&s.miss>=2?'<span class="pill">错过 '+s.miss+' 次</span>':'<span>'+(queue.length+relearn.length)+' 张待过</span>')+
      '</div>'+
      '<div class="prompt">'+esc(c.zh)+'</div>'+
      '<div class="answer'+(c.en.length>26?' long':'')+(flipped?'':' hidden')+'">'+esc(c.en)+'</div>'+
      (flipped ? exampleBlock(c.i) : '')+
      (flipped
        ? '<div class="actions"><button class="btn no" data-a="0">没想起来</button><button class="btn yes" data-a="1">记住了</button></div>'
        : '<div class="actions"><button class="btn primary" data-a="flip">翻面看答案</button></div>')+
    '</div>';
}

function renderPair(){
  const {p} = cur;
  const opts = shuffle([[p.a,p.ag],[p.b,p.bg]]);
  const ask = Math.random()<.5 ? [p.a,p.ag] : [p.b,p.bg];
  cur.ask = ask;
  stage.innerHTML =
    '<div class="card">'+
      '<div class="meta"><span>冠词对比</span><span>'+queue.length+' 组待过</span></div>'+
      '<div class="prompt">哪个是「'+esc(ask[1])+'」？</div>'+
      '<div class="opts">'+opts.map(o=>
        '<button class="opt" data-en="'+esc(o[0])+'">'+esc(o[0])+'</button>').join('')+
      '</div>'+
    '</div>';
}

let listAll = (st.cfg.scope === "all");
function renderList(){
  const rows = listAll ? ALL : DATA;
  stage.innerHTML =
    '<div class="listhead">'+
      '<span>'+rows.length+' 条'+(listAll?'（全部 900 组，★ 为刷卡集）':'（刷卡集）')+'</span>'+
      '<button class="linkish" id="toggle-all">'+(listAll?'只看刷卡集':'显示全部 900 组')+'</button>'+
    '</div>'+
    '<div class="list">'+rows.map(c=>{
      const s=st.cards[c.i], core=!!coreSet[c.i];
      return '<div class="row'+(listAll&&!core?' dim':'')+'">'+
        '<span class="e">'+(listAll&&core?'<i class="star">★</i>':'')+esc(c.en)+'</span>'+
        '<span class="c">'+esc(c.zh)+'</span>'+
        '<span class="b">'+(!s?'':(s.box>=MASTER?'<b>熟</b>':'学过'))+'</span></div>';
    }).join('')+'</div>';
}
const coreSet = {};
DATA.forEach(c=>{ coreSet[c.i]=1; });

function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

stage.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="toggle-all"){ listAll = !listAll; render(); return; }
  if(b.dataset.a==="flip"){ flipped=true; render(); return; }
  if(b.dataset.a==="0"||b.dataset.a==="1"){
    const ok = b.dataset.a==="1";
    grade(cur, ok);
    if(!ok) relearn.push(cur);
    next(); return;
  }
  if(b.dataset.en!==undefined){
    if(document.querySelector(".opt.right")) { next(); return; }
    logDay(false, false); save();          // 冠词对比也算当天的一次复习
    const right = cur.ask[0];
    document.querySelectorAll(".opt").forEach(o=>{
      if(o.dataset.en===right) o.classList.add("right");
      else if(o===b) o.classList.add("wrong");
      o.insertAdjacentHTML("beforeend",
        '<span class="gloss">'+esc(o.dataset.en===cur.p.a?cur.p.ag:cur.p.bg)+'</span>');
    });
    if(b.dataset.en!==right) queue.push(cur);
  }
});

document.addEventListener("keydown", e=>{
  if(mode==="list"||mode==="pair"||mode==="cfg"||mode==="gram"||!cur) return;
  if(mode==="write" && !(wsub==="cards" && wgroup)) return;
  if(e.code==="Space"){ e.preventDefault(); if(!flipped){flipped=true;render();} }
  else if(e.key==="1"&&flipped){ grade(cur,false); relearn.push(cur); next(); }
  else if(e.key==="2"&&flipped){ grade(cur,true); next(); }
});

let section = "word";
const SECTIONS = {
  word:  {def:"today", subs:[["today","今日新词"],["review","复习到期"],["pair","冠词对比"],["list","全表"]]},
  write: {def:"write", subs:[]},
  gram:  {def:"gram",  subs:[]},
  hard:  {def:"hard",  subs:[]},
  cfg:   {def:"cfg",   subs:[]}
};

function renderNav(){
  const nav = document.getElementById("tabs");
  const subs = SECTIONS[section].subs;
  nav.hidden = subs.length === 0;
  nav.innerHTML = subs.map(s =>
    '<button data-mode="'+s[0]+'" aria-selected="'+(mode===s[0])+'">'+s[1]+'</button>').join('');
  document.querySelectorAll("#tabbar button").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.sec === section)));
  const badge = document.getElementById("hardbadge");
  if(badge){
    const n = hardPool().length;
    badge.textContent = n > 99 ? "99+" : n;
    badge.hidden = n === 0;
  }
}

function goSection(sec){
  section = sec;
  mode = SECTIONS[sec].def;
  if(sec === "write"){ wsub = "cards"; wgroup = null; pcur = null; pshow = {}; }
  if(sec === "gram"){ gchap = null; }
  buildQueue();
  renderNav();
}

document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  mode=b.dataset.mode;
  buildQueue();
  renderNav();
});

document.getElementById("tabbar").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  goSection(b.dataset.sec);
});

/* ---------- 写作模块 ---------- */
let wsub = "cards";
let wgroup = null;

function writeItems(g){ return WRITING.filter(w=>w.g===g); }
function writePool(g){
  const items = writeItems(g);
  const due = items.filter(w=>{ const s=st.cards[w.i]; return !s || s.due<=T; });
  return due.length ? due : items;
}
function writeDone(g){ return writeItems(g).filter(w=>{ const s=st.cards[w.i]; return s && s.box>=MASTER; }).length; }
function writeSeen(g){ return writeItems(g).filter(w=>!!st.cards[w.i]).length; }
function writeDue(g){ return writeItems(g).filter(w=>{ const s=st.cards[w.i]; return s && s.due<=T; }).length; }
function writeDueTotal(){ return WGROUPS.reduce((a,g)=>a+writeDue(g.g), 0); }

const PARTLABEL = {A:"第一节", B:"第二节", C:"通用"};

function subnav(){
  const tabs = [["cards","句型卡"],["skel","模板骨架"],["model","范文"],["swap","换词"],["paper","真题"]];
  return '<div class="subnav">'+tabs.map(t=>
    '<button data-wsub="'+t[0]+'" aria-selected="'+(wsub===t[0])+'">'+t[1]+'</button>').join('')+'</div>';
}

  if(wsub==="model"){ return renderModels(); }

    stage.innerHTML = subnav()+
      '<div class="card"><div class="prompt">这一组过完了。</div>'+
      '<div class="hint">本组已学 '+writeSeen(wgroup)+' / '+writeItems(wgroup).length+' 条，其中熟 '+writeDone(wgroup)+' 条。'+
      '再刷一遍会重新洗牌；换一组继续也行。</div>'+

      '<button class="btn primary" data-wagain="'+esc(wgroup)+'">再刷一遍</button></div></div>';

  stage.insertAdjacentHTML("beforeend",
    '<div class="backline"><button class="linkish" data-wback="1">← 返回分组</button></div>');
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.wsub!==undefined){
    wsub = b.dataset.wsub; wgroup = null; pcur = null; pshow = {}; buildQueue(); return;
  }
  if(b.dataset.paper!==undefined){
    pcur = +b.dataset.paper; pshow = {}; buildQueue(); window.scrollTo(0,0); return;
  }
  if(b.dataset.pback!==undefined){
    pcur = null; pshow = {}; buildQueue(); window.scrollTo(0,0); return;
  }
  if(b.dataset.pshow!==undefined){
    pshow[b.dataset.pshow] = true; buildQueue(); return;
  }
  if(b.dataset.ptext!==undefined){
    pshow.t = !pshow.t; buildQueue(); return;
  }
  if(b.dataset.wgroup!==undefined){
    wgroup = b.dataset.wgroup; buildQueue(); return;
  }
  if(b.dataset.wagain!==undefined){
    wgroup = b.dataset.wagain; queue = shuffle(writeItems(wgroup)); relearn=[]; next(); return;
  }
  if(b.dataset.wback!==undefined){
    wgroup = null; buildQueue(); return;
  }
});

/* ---------- 我的：打卡日历 + 学习设置 ---------- */
let calSel = null;

function dayIdxOf(y,m,d){ return Math.floor(new Date(y,m,d)/DAY); }

function activeDay(k){ const e = dayEntry(k); return !!e && (e.n + e.r + e.wn + e.wr) > 0; }
function streakDays(){
  let n = 0, t = T;
  if(!activeDay(t)) t -= 1;                 // 今天还没开始不算断
  while(activeDay(t)){ n++; t -= 1; }
  return n;
}

let weekOff = 0;                              // 0 = 本周，-1 = 上一周
function weekStartIdx(off){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7) + off*7);   // 周一起始
  return Math.floor(d/DAY);
}
function mdOf(idx){ const d = new Date(idx*DAY); return (d.getMonth()+1)+"/"+d.getDate(); }

function usageBlock(){
  const start = weekStartIdx(weekOff), names = ["一","二","三","四","五","六","日"];
  const vals = []; for(let i=0;i<7;i++) vals.push(daySecs(start+i));
  const max = Math.max.apply(null, vals.concat([900]));  // 至少按 15 分钟封顶，免得几分钟看着像满格
  const past = vals.filter((v,i)=> start+i<=T);          // 未来的日子不算进合计
  const total = past.reduce((a,b)=>a+b,0);
  const acted = past.filter(v=> v>=30);

  const cols = vals.map((v,i)=>{
    const idx = start+i, on = v>=30;
    const cls = ["col"]; if(idx===T) cls.push("today"); if(!on) cls.push("zero");
    return '<div class="'+cls.join(" ")+'">'+
      '<span class="val">'+(on ? Math.round(v/60) : "")+'</span>'+
      '<i class="stem" style="height:'+(on ? Math.round(5 + 85*(v/max)) : 3)+'px"></i>'+
      '<span class="dw">'+names[i]+'</span></div>';
  }).join("");

  return '<div class="card sect">'+
    '<h4>使用时长</h4>'+
    '<div class="uhead">'+
      '<span class="today"><span class="k">今日</span><span class="v" id="u-today">'+fmtDur(daySecs(T))+'</span></span>'+
      '<span class="wknav">'+
        '<button data-week="-1" aria-label="上一周">‹</button>'+
        '<span>'+mdOf(start)+' – '+mdOf(start+6)+(weekOff===0?"（本周）":"")+'</span>'+
        '<button data-week="1" aria-label="下一周"'+(weekOff>=0?" disabled":"")+'>›</button>'+
      '</span>'+
    '</div>'+
    '<div class="chart">'+cols+'</div>'+
    '<span class="note">柱子上的数字是当天分钟数。本周合计 <b>'+fmtDur(total)+'</b>'+
      (acted.length ? ' · 学习 '+acted.length+' 天 · 日均 '+fmtDur(total/acted.length) : '')+'。</span>'+
    '<span class="note">只统计页面在前台、并且近两分钟内有操作的时间；切到后台或者放着不动会自动暂停。</span>'+
  '</div>';
}

function donut(pct, label, cls, hasReview){
  const r = 15.5, c = 2*Math.PI*r;
  const on = c*Math.max(0, Math.min(1, pct));
  return '<svg viewBox="0 0 40 40" aria-hidden="true">'+
    '<circle class="ring-bg" cx="20" cy="20" r="'+r+'"/>'+
    (on>0 ? '<circle class="ring" cx="20" cy="20" r="'+r+'" stroke-dasharray="'+on.toFixed(2)+' '+c.toFixed(2)+'"/>' : '')+
    '<text class="num" x="20" y="24.5">'+label+'</text>'+
    (hasReview ? '<circle class="dot" cx="20" cy="33.5" r="1.7"/>' : '')+
  '</svg>';
}

function renderMy(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const firstDow = (new Date(y,m,1).getDay()+6)%7;      // 周一起始
  const days = new Date(y, m+1, 0).getDate();
  const quota = perDay();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<span class="cell void"></span>';
  for(let d=1; d<=days; d++){
    const idx = dayIdxOf(y,m,d), e = dayEntry(idx);
    const n = e ? e.n : 0, rv = e ? (e.r + e.wn + e.wr) : 0;
    const pct = quota>0 ? n/quota : 0;
    const cls = ["cell"];
    if(idx===T) cls.push("today");
    else if(idx>T) cls.push("future");
    if(pct>=1) cls.push("full");
    if(calSel===idx) cls.push("sel");
    cells += '<button class="'+cls.join(" ")+'" data-cal="'+idx+'">'+donut(pct, d, cls, rv>0)+'</button>';

      : (head+"没有记录");

  stage.innerHTML =

          '<span class="streak">连续 <b>'+streakDays()+'</b> 天 · 距开考 <b>'+left+'</b> 天</span></div>'+
        '<div class="calgrid">'+["一","二","三","四","五","六","日"].map(x=>'<span class="dow">'+x+'</span>').join('')+cells+'</div>'+
        '<div class="caldetail">'+esc(detail)+'</div>'+
        '<div class="callegend">'+
          '<span><i style="background:var(--accent)"></i>圆环＝当天新学完成度</span>'+
          '<span><i style="background:var(--warn)"></i>底部小点＝当天有复习或写作</span>'+
        '</div>'+
      '</div>'+

    usageBlock()+

        '<input type="range" id="q-range" min="10" max="120" step="1" value="'+quota+'">'+
        '<span class="q" id="q-val">'+quota+'</span>'+
      '</div>'+
      '<div class="seg quad">'+[20,33,50,80].map(v=>
        '<button data-quota="'+v+'" aria-pressed="'+(quota===v)+'">'+v+' 条</button>').join('')+'</div>'+

      '按这个量还要 '+Math.ceil(unlearned().length/quota)+' 天过完，距开考 '+left+' 天。'+
      '复习卡和写作句型不占这个额度；某天没学也不会累到第二天。</span>'+
    '</div>'+

    '<div class="card sect">'+
      '<h4>学习范围</h4>'+

  cfg = cfg || hostState() || {};
  const when = cfg.checked ? new Date(cfg.checked).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "还没查过";
  return '<div class="card sect">'+
    '<h4>内容更新</h4>'+
    '<div class="kv"><span>内容版本</span><b>v'+(cfg.version||1)+(cfg.using==="updated"?"（已更新）":"（内置）")+'</b></div>'+
    '<div class="kv"><span>上次检查</span><b>'+esc(when)+'</b></div>'+
    '<div class="field">'+
      '<input id="cfg-src" value="'+esc(cfg.source||"")+'" placeholder="用户名/仓库名" autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '</div>'+
    '<div class="actions"><button class="btn primary" id="cfg-save">保存并检查</button></div>'+
    '<div class="status" id="cfg-status">每次启动静默查一次，几十字节，失败不影响使用。</div>'+
    '<button class="linkish" id="cfg-reset">恢复到内置版本</button>'+
  '</div>';
}

function webNoteBlock(){
  return '<div class="card sect">'+
    '<h4>说明</h4>'+
    '<span class="note">键盘：<b>空格</b> 翻面，<b>1</b> 没想起来，<b>2</b> 记住了。</span>'+
    '<span class="note">进度保存在这台设备的浏览器里，换设备不同步。安卓 app 里这一页还能设置内容更新源。</span>'+
  '</div>';
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.cal!==undefined){
    const v = Number(b.dataset.cal);
    calSel = (calSel===v) ? null : v;
    render(); return;
  }
  if(b.dataset.week!==undefined){
    weekOff = Math.min(0, weekOff + Number(b.dataset.week));
    render(); return;
  }
  if(b.dataset.quota!==undefined){
    st.cfg.perDay = Number(b.dataset.quota); save(); buildQueue(); return;
  }
  if(b.dataset.scope!==undefined){
    st.cfg.scope = b.dataset.scope; listAll = (st.cfg.scope==="all"); save(); buildQueue(); return;
  }
});

document.addEventListener("input", e=>{
  if(e.target && e.target.id==="q-range"){
    const v = Number(e.target.value);
    document.getElementById("q-val").textContent = v;
    st.cfg.perDay = v; save(); stats();
  }
});
document.addEventListener("change", e=>{
  if(e.target && e.target.id==="q-range"){ buildQueue(); }
});

const GRAM = [{"id": "g0", "no": "00", "part": "入门", "title": "先看一张地图", "sub": "所有语法只在回答五个问题", "b": [{"t": "p", "x": "初学者容易迷路，是因为教材把语法拆成几十个孤立的知识点。其实一个英语句子从头到尾只回答五个问题，每学一个点就往这张表上挂。"}, {"t": "tbl", "head": ["句子在回答", "动用的语法", "第几章"], "rows": [["说的是**谁 / 什么**？", "名词、代词、冠词、单复数", "04 · 05"], ["他**怎么了**？", "动词、五种基本句型", "03"], ["**什么时候**发生、做完没有？", "时态（时 × 体）", "06"], ["是他做的还是**被做的**？真的假的？", "被动、情态、虚拟语气", "07 · 08 · 11"], ["还要**补充什么细节**？", "形容词、副词、介词、非谓语、从句", "02 · 09 · 10"]]}, {"t": "p", "x": "一句话总结：**先有一个主干，其他所有语法都是往主干上挂东西**。下面这句把五个问题全回答了一遍，现在看不懂没关系，全部读完再回来看。"}, {"t": "dg", "parts": [["x", "Although it was raining,", "让步状语从句"], ["s", "the students", "主语 S"], ["v", "had been waiting", "谓语 V · 过去完成进行"], ["m", "outside the hall", "地点状语"], ["m", "for two hours", "时间状语"]], "z": "尽管下着雨，学生们已经在礼堂外面等了两个小时了。", "n": ""}, {"t": "box", "k": "use", "x": "考前只看四章的话：**03 五种句型 → 06 时态 → 09 非谓语 → 10 从句**。这四章覆盖实际写作里九成的语法需求。"}]}, {"id": "g1", "no": "01", "part": "入门", "title": "英语为什么长成这样", "sub": "一千年的历史，解释了九成的不讲道理", "b": [{"t": "p", "x": "为什么第三人称单数要加 `-s`？为什么否定句要塞一个毫无意义的 `do`？为什么 `go / went / gone` 变得面目全非？这些不是有人设计出来的，是**历史磨损留下的痕迹**。知道来源，就不用去问为什么，只需要认出：哦，这是化石。"}, {"t": "h", "x": "一、英语曾经是一门会变形的语言"}, {"t": "p", "x": "公元 1000 年前后的古英语跟今天的德语很像：名词有四个格，词尾变化告诉你谁是主语、谁是宾语，所以**语序可以很自由**。"}, {"t": "h", "x": "二、词尾被磨平了"}, {"t": "p", "x": "九到十一世纪北欧维京人与本地人大量混居，两边词根相近而词尾不同，交流时干脆把词尾省掉。1066 年诺曼征服后，英语有两三百年不是书面语言，没人维护规范，磨损进一步加速。到 1400 年前后，名词的格基本消失干净。"}, {"t": "box", "k": "origin", "x": "**这是理解英语的总钥匙。**词尾没了，谁是主语谁是宾语就只能靠**位置**和**介词**表示。于是英语变成一门语序极其重要的语言：主语一定在动词前，宾语一定在动词后；「用刀」必须写成 `with a knife`。\n中文也靠语序，这是好消息。但中文修饰语一律在前（「我昨天买的那本书」），英语长修饰语一律在后（`the book that I bought yesterday`）——这是中国学生最大的语序障碍，见第 10 章。"}, {"t": "h", "x": "三、留下了一地化石"}, {"t": "tbl", "head": ["今天的怪规则", "它其实是什么"], "rows": [["`I / me / my`，`he / him / his`", "代词最常用、磨损最慢，是**唯一保留下来的格**。名词已经没有了，所以只能加 `'s`。"], ["第三人称单数 `-s`", "古英语每个人称都有词尾，其余全掉光，只剩这一个。北部方言的 `-es` 一路南下，1600 年前后取代了南部的 `-eth`（`he doth` → `he does`）。"], ["`sing / sang / sung`", "日耳曼语的强变化动词，靠**换元音**表示过去。这套机制早已停止扩张，但最常用的一两百个动词保住了原样；新词一律走 `-ed`。"], ["`ask / inquire`、`help / assist`", "诺曼征服后法语拉丁词大量涌入。**日耳曼来的短词日常口语，法语拉丁来的长词正式书面**——写作想显得正式，优先选长的那个。"], ["`can / must` 不加 -s、后面不加 to", "它们是「过去现在式动词」：今天的现在时形式历史上是过去时形式，而过去时本来就不加词尾。见第 8 章。"]]}]}, {"id": "g2", "no": "02", "part": "入门", "title": "词的八个工种", "sub": "认词性是后面一切的前提", "b": [{"t": "p", "x": "英语单词不是按意思分类的，是按**能站在句子哪个位置**分类的。同一个词换位置就换工种：`water` 在 `drink water` 里是名词，在 `water the flowers` 里是动词。所以背单词一定连词性一起背。"}, {"t": "tbl", "head": ["词类", "干什么", "例", "坑"], "rows": [["**名词** n.", "当主语、宾语", "`student, water, idea`", "可数不可数、单复数"], ["**代词** pron.", "替名词避免重复", "`I, him, this, which`", "主格宾格用混"], ["**动词** v.", "当谓语，句子的心脏", "`work, is, have`", "一句只能有一个谓语"], ["**形容词** adj.", "修饰名词 / 当表语", "`happy, useful`", "不能直接当谓语"], ["**副词** adv.", "修饰动词、形容词、整句", "`quickly, very, however`", "位置比中文灵活"], ["**介词** prep.", "把名词挂到句子上", "`in, on, for, with`", "搭配只能整块背"], ["**连词** conj.", "连接词、短语、句子", "`and, but, because`", "中文成对，英文只留一个"], ["**冠词** art.", "限定是某一个还是那一个", "`a, an, the`", "中文完全没有，最难"]]}, {"t": "box", "k": "trap", "x": "**句子必须有动词。**中文说「我很累」，形容词直接当谓语；英语绝对不行，每句话必须有一个动词。"}, {"t": "rw", "items": [[0, "I very tired.", "少了动词，这不是一个句子"], [1, "I am very tired.", ""], [0, "The book very interesting.", ""], [1, "The book is very interesting.", ""]]}, {"t": "p", "x": "写完任何一句话，先找动词。找不到，句子就是错的。"}, {"t": "h", "x": "形容词管名词，副词管其余一切"}, {"t": "ex", "e": "She is a <b>careful</b> driver.", "z": "careful 修饰名词 driver → 形容词"}, {"t": "ex", "e": "She drives <b>carefully</b>.", "z": "carefully 修饰动词 drives → 副词"}, {"t": "ex", "e": "The problem is <b>extremely</b> difficult.", "z": "extremely 修饰形容词 → 副词"}, {"t": "box", "k": "use", "x": "想让句子不干巴，最省力的办法是给动词加副词、给名词加形容词：`He helped his mother.` → `He **patiently** looked after his **seriously ill** mother.` 一句话就从小学水平变成能拿分的水平。"}, {"t": "h", "x": "介词：英语的关节"}, {"t": "p", "x": "词尾消失后，位置、方向、方式、时间的关系全压到介词身上，所以英语介词又多又不讲理，只能**整块背搭配**。三条基本盘："}, {"t": "pills", "items": ["in + 年/月/季节/城市", "on + 具体某天/日期/表面", "at + 具体时刻/小地点"]}, {"t": "p", "x": "真正要背的是**动词 + 介词**的固定组合——这正是这个 app「单词」标签里那 900 组的主体："}, {"t": "pills", "items": ["depend on", "apply for", "result in", "consist of", "deal with", "refer to", "be aware of", "be responsible for", "take part in", "look forward to", "contribute to"]}, {"t": "box", "k": "trap", "x": "`look forward **to**`、`be used **to**`、`contribute **to**` 里的 to 是**介词**不是不定式符号，后面必须跟名词或 -ing：`I look forward to **hearing** from you.`（不是 to hear）"}]}, {"id": "g3", "no": "03", "part": "基础", "title": "句子的五种骨架", "sub": "去掉修饰之后只剩这五种", "b": [{"t": "p", "x": "这是全篇最有用的一章。再长再复杂的句子，把形容词、副词、介词短语、从句全部剥掉，剩下的骨架必然是下面五种之一。学会剥骨架，长难句就不可怕；反过来，写句子先搭骨架再挂修饰，就不会写出中式英语。"}, {"t": "h", "x": "骨架一 · 主 + 谓（S + V）"}, {"t": "p", "x": "动词自己就说完了，不需要宾语——**不及物动词**。"}, {"t": "dg", "parts": [["s", "The sun", "S 主语"], ["v", "rises.", "V 谓语"]], "z": "", "n": ""}, {"t": "dg", "parts": [["s", "Everyone in the office", "S（加了修饰）"], ["v", "laughed", "V"], ["m", "loudly.", "状语（可删）"]], "z": "太阳升起。／ 办公室里每个人都大笑起来。", "n": ""}, {"t": "h", "x": "骨架二 · 主 + 系动词 + 表语（S + V + P）"}, {"t": "p", "x": "动词只起等号作用，后面那部分在**说明主语是什么、怎么样**。"}, {"t": "dg", "parts": [["s", "The soup", "S"], ["v", "tastes", "V 系动词"], ["p", "delicious.", "P 表语（形容词）"]], "z": "", "n": ""}, {"t": "dg", "parts": [["s", "My father", "S"], ["v", "is", "V"], ["p", "an engineer.", "P 表语（名词）"]], "z": "这汤味道很好。／ 我父亲是工程师。", "n": "系动词清单：be · look · seem · appear · sound · taste · smell · feel · become · get · turn · grow · remain · stay · keep"}, {"t": "box", "k": "trap", "x": "系动词后面跟**形容词**，不跟副词。`It sounds **good**`（不是 well），`She looks **beautiful**`（不是 beautifully）。判断：那个词是在描述主语，就用形容词。"}, {"t": "h", "x": "骨架三 · 主 + 谓 + 宾（S + V + O）"}, {"t": "p", "x": "最常见的句型，动词的动作落在一个对象上——**及物动词**。"}, {"t": "dg", "parts": [["s", "The company", "S"], ["v", "has launched", "V"], ["o", "a new product.", "O 宾语"]], "z": "公司推出了一款新产品。", "n": ""}, {"t": "h", "x": "骨架四 · 主 + 谓 + 间宾 + 直宾（S + V + O + O）"}, {"t": "p", "x": "「给某人某物」型。给谁在前，给什么在后；调换顺序要加 to 或 for。"}, {"t": "dg", "parts": [["s", "My teacher", "S"], ["v", "gave", "V"], ["o", "me", "间接宾语（给谁）"], ["o", "some advice.", "直接宾语（给什么）"]], "z": "老师给了我一些建议。", "n": "换序：My teacher gave some advice to me. ／ He bought a gift for his mother.（buy / make / cook 用 for，give / send / show / lend / tell 用 to）"}, {"t": "h", "x": "骨架五 · 主 + 谓 + 宾 + 宾补（S + V + O + C）"}, {"t": "p", "x": "宾语后面还得补一句才说得完整，补的那部分在**描述宾语**。中国学生最不熟、写作里最能提分的句型。"}, {"t": "dg", "parts": [["s", "We", "S"], ["v", "consider", "V"], ["o", "him", "O"], ["p", "a hero.", "C 补足语"]], "z": "我们认为他是英雄。（「英雄」说的是 him，不是 we）", "n": "补足语可以是名词、形容词、不定式或分词：They painted the door green. ／ He asked me to stay. ／ I heard someone knocking. ／ I want the job done today."}, {"t": "box", "k": "use", "x": "**读长句**：先找谓语动词（有时态变化的那个），它前面一整块是主语，后面一整块是宾语或表语，其余都是修饰，先跳过。\n**写句子**：先写骨架 `The report shows a problem.`，再往上挂 → `The report released last week shows a serious problem in our management system.` 这个「先搭后挂」的习惯能挡掉绝大多数中式英语。"}]}, {"id": "g4", "no": "04", "part": "基础", "title": "名词与冠词", "sub": "中文里不存在的两件事", "b": [{"t": "h", "x": "可数与不可数"}, {"t": "p", "x": "中文说「三本书」「三杯水」，量词扛下一切。英语把这件事推给名词本身：**能直接数的加 -s，不能直接数的必须借容器**。"}, {"t": "tbl", "head": ["类型", "例子", "怎么用"], "rows": [["可数", "`book, student, idea, problem`", "单数前必须有 a / the / my；复数加 -s"], ["不可数 · 物质", "`water, money, bread, air`", "不加 -s 不加 a；要数用 `a glass of / a piece of`"], ["不可数 · 抽象", "`advice, information, news, knowledge, progress, equipment, furniture, homework, research`", "**这一排是重灾区**，中文都能数，英语都不能"]]}, {"t": "rw", "items": [[0, "He gave me many advices.", "advice 不可数"], [1, "He gave me much advice. / a lot of advice / two pieces of advice.", ""], [0, "I have a good news.", ""], [1, "I have good news. / a piece of good news.", ""]]}, {"t": "h", "x": "冠词：a / an / the / 什么都不加"}, {"t": "box", "k": "origin", "x": "`a / an` 就是古英语的「一」（`ān`）弱读磨出来的，所以它天生带着「随便某一个」的意思。`the` 来自古英语的指示词（相当于「那个」），所以天生带着「你知道是哪个」的意思。**记住这两个出身，用法基本就通了。**"}, {"t": "tbl", "head": ["用哪个", "什么时候", "例句"], "rows": [["**a / an**", "第一次提到、听话人不知道是哪个；或某一类中的一个", "`I saw **a** dog in the street.` `She is **a** teacher.`"], ["**the**", "① 上文提过 ② 有限定语指明 ③ 世上独一份 ④ 双方都清楚", "`**The** dog was barking.` `**The** book on the desk is mine.` `**the** sun` `Close **the** door.`"], ["**零冠词**", "复数或不可数名词泛指一整类；三餐、球类、学科、by + 交通工具", "`**Books** are expensive.` `**Water** is important.` `have breakfast · play football · by bus`"]]}, {"t": "p", "x": "`a` 还是 `an`，看**后面第一个音是不是元音**，不看字母：`an hour`（h 不发音）、`a university`（读 /juː/）、`an MBA`（字母 M 读 /em/）。"}, {"t": "box", "k": "use", "x": "冠词永远是中国学生扣分最密的地方，而且每句话都要用。养成一个动作：**每写一个单数可数名词，先问自己前面有没有东西**（a / the / my / this）。没有就一定错。"}]}, {"id": "g5", "no": "05", "part": "基础", "title": "代词", "sub": "英语里唯一还保留格的地方", "b": [{"t": "tbl", "head": ["主格", "宾格", "形容词性物主", "名词性物主", "反身"], "rows": [["`I`", "`me`", "`my`", "`mine`", "`myself`"], ["`you`", "`you`", "`your`", "`yours`", "`yourself`"], ["`he / she / it`", "`him / her / it`", "`his / her / its`", "`his / hers / —`", "`himself / herself / itself`"], ["`we`", "`us`", "`our`", "`ours`", "`ourselves`"], ["`they`", "`them`", "`their`", "`theirs`", "`themselves`"]]}, {"t": "p", "x": "位置决定用哪一列：动词前用主格，动词或介词后用宾格；形容词性物主后面必须跟名词，名词性物主后面不跟。"}, {"t": "rw", "items": [[0, "Me and my friend went there.", "主语位置要用主格"], [1, "My friend and I went there.", ""], [0, "This is a photo of my.", ""], [1, "This is a photo of mine.", "介词后又不跟名词 → 名词性物主代词"], [0, "The company changed it's name.", ""], [1, "The company changed its name.", "its = 它的；it's = it is。写作高频扣分点"]]}, {"t": "h", "x": "it 的三个特殊用法"}, {"t": "p", "x": "**形式主语**：真正的主语太长，先用 it 占位置，把长的挪到后面。写作里最实用的句型之一。"}, {"t": "ex", "e": "<b>It</b> is important <b>to protect the environment</b>.", "z": "= To protect the environment is important.（英语更爱前一种）"}, {"t": "ex", "e": "<b>It</b> is a pity <b>that he failed the exam</b>.", "z": ""}, {"t": "p", "x": "**形式宾语**：`I find **it** difficult **to finish the work on time**.`"}, {"t": "p", "x": "**指天气时间距离**：`It is raining. / It is five o'clock. / It is ten kilometres from here.`"}]}, {"id": "g6", "no": "06", "part": "核心", "title": "时态", "sub": "整个语法的核心，中文完全没有", "b": [{"t": "p", "x": "中文靠「了、着、过」和时间词表达时间，动词本身从不变形。英语相反：**时间信息被强制塞进动词的形态里**，哪怕句子里已经有 yesterday，动词照样得变过去式。这是初学者最容易漏的一环。"}, {"t": "h", "x": "时态 = 时 × 体"}, {"t": "p", "x": "不要背「十六种时态」这个吓人的说法。它是两个维度**相乘**出来的："}, {"t": "tbl", "head": ["", "一般", "进行", "完成", "完成进行"], "rows": [["**现在**", "`do / does`", "`am/is/are doing`", "`have/has done`", "`have/has been doing`"], ["**过去**", "`did`", "`was/were doing`", "`had done`", "`had been doing`"], ["**将来**", "`will do`", "`will be doing`", "`will have done`", "`will have been doing`"]]}, {"t": "p", "x": "看出来了吗？**进行 = be + -ing，完成 = have + 过去分词，将来 = will + 原形**。三块积木随便叠，叠出来就是十六种时态。真正要练熟的只有 7 个：现在和过去的一般、进行、完成，再加一个 `will do`。"}, {"t": "h", "x": "一般现在时 · do / does"}, {"t": "p", "x": "**不是「现在正在做」**，而是「这是一个事实、习惯、规律」。这是初学者第一个大误解。"}, {"t": "ex", "e": "Water <b>boils</b> at 100°C.", "z": "客观事实"}, {"t": "ex", "e": "I <b>get</b> up at six every day.", "z": "习惯；get→gets 只在 he/she/it 时"}, {"t": "ex", "e": "The train <b>leaves</b> at 8:30 tomorrow.", "z": "时刻表安排的将来"}, {"t": "box", "k": "origin", "x": "**为什么否定和疑问要加 do。**古英语的否定句是 `I know not`，疑问句是 `Know you?`（跟今天的德语一样）。15–17 世纪，一个原本表「做」的 `do` 逐渐被抽空意思，专门用来扛否定词和疑问语序，18 世纪固定下来。所以 `Do you know?` 里的 do 毫无意义，它只是个语法搬运工——而且它把时态和 -s 都扛走了，所以是 `Does he **know**?` 不是 knows。"}, {"t": "h", "x": "现在进行时 · am / is / are + doing"}, {"t": "ex", "e": "Look! The baby <b>is sleeping</b>.", "z": "此刻正在进行"}, {"t": "ex", "e": "I <b>am reading</b> a novel these days.", "z": "这一阵子在做，不一定此刻"}, {"t": "ex", "e": "We <b>are having</b> dinner with them tonight.", "z": "已经安排好的将来"}, {"t": "box", "k": "trap", "x": "表示**状态**而非动作的动词一般不用进行时：`know, believe, understand, want, like, love, hate, need, belong, seem, own, contain`。所以是 `I **know** the answer`，不是 I am knowing。"}, {"t": "h", "x": "一般过去时 · did"}, {"t": "p", "x": "过去发生、**跟现在没关系**了。句子里有 `yesterday / last week / in 2019 / ago / when I was young`，一律用过去时。"}, {"t": "ex", "e": "He <b>graduated</b> from Peking University in 2018.", "z": ""}, {"t": "ex", "e": "I <b>saw</b> her yesterday.", "z": "不规则动词 see→saw，这类必须硬背"}, {"t": "box", "k": "use", "x": "**写作最大的失分点。**写记叙内容（讲一个人的故事、复述材料里发生的事）整段都用过去时，写你自己的评论和看法时切回现在时。一篇作文里时态乱跳，是阅卷最容易抓到的错。"}, {"t": "h", "x": "现在完成时 · have / has + 过去分词"}, {"t": "p", "x": "中国学生最糊涂的一个，因为中文没有对应结构。它的核心不是「过去」，而是**「过去的事，对现在有影响」**——说话人关心的是现在的结果或状态。"}, {"t": "box", "k": "origin", "x": "**为什么用 have。**它本来是字面的「拥有」：`I have the letter written` ＝「我手上有一封写好的信」，have 是实义动词，written 修饰 letter。后来语序变成 `I have written the letter`，have 被抽空成助动词，整个结构语法化为「完成」。**所以完成时天生带着「结果还在我手上」的味道**，这正是它和一般过去时的区别。"}, {"t": "rw", "items": [[1, "A：I lost my key.", "过去时：只陈述当时丢了，现在找没找到不关心"], [1, "B：I have lost my key.", "完成时：现在还没找到，我现在进不了门"]]}, {"t": "p", "x": "三种典型用法："}, {"t": "ex", "e": "He <b>has finished</b> the report.", "z": "① 刚完成，结果摆在眼前。常配 already / just / yet"}, {"t": "ex", "e": "I <b>have lived</b> here <b>for</b> ten years. / <b>since</b> 2016.", "z": "② 从过去持续到现在。for + 一段时间，since + 时间点"}, {"t": "ex", "e": "Have you <b>ever been</b> to Japan?", "z": "③ 到目前为止的经历。常配 ever / never / twice"}, {"t": "box", "k": "trap", "x": "**铁律**：有明确过去时间点的句子不能用现在完成时。`✗ I have seen him yesterday.` → `✓ I saw him yesterday.`"}, {"t": "h", "x": "过去完成时 · had + 过去分词"}, {"t": "p", "x": "「过去的过去」。**只有一句话里出现两个过去动作、需要分先后时才用**，早的那个用 had done。"}, {"t": "ex", "e": "When I arrived at the station, the train <b>had already left</b>.", "z": "火车先走，我后到"}, {"t": "ex", "e": "She said she <b>had never seen</b> such a beautiful place.", "z": ""}, {"t": "h", "x": "将来的四种说法"}, {"t": "tbl", "head": ["形式", "语气", "例"], "rows": [["`will + 原形`", "单纯预测，或说话瞬间做的决定", "`It will rain tomorrow.` `OK, I'll help you.`"], ["`be going to`", "已有的打算，或有迹象的推断", "`I'm going to study abroad.` `Look at the clouds — it's going to rain.`"], ["`be doing`", "已经定好的安排", "`We're meeting the client at three.`"], ["`be about to`", "马上就要", "`The film is about to start.`"]]}, {"t": "box", "k": "origin", "x": "英语其实**没有真正的将来时词尾**，只能借情态动词。`will` 来自古英语 `willan`「想要」，`shall` 来自 `sculan`「欠、应当」。所以 will 至今还带一点意愿的余味（`I will help you` 听起来像「我愿意帮」），`be going to` 更是直接从「正走向某处」引申出来的。"}, {"t": "box", "k": "trap", "x": "**主将从现。**在 `when / if / as soon as / before / after / until` 引导的时间和条件状语从句里，用现在时表示将来。`✗ If it will rain, we will stay home.` → `✓ If it **rains**, we will stay home.`"}]}, {"id": "g7", "no": "07", "part": "核心", "title": "被动语态", "sub": "不说谁干的，或者不重要", "b": [{"t": "p", "x": "公式只有一条：**`be + 过去分词`**。be 负责扛时态，过去分词负责表示「被」。"}, {"t": "dg", "parts": [["s", "The bridge", "原来的宾语上位当主语"], ["v", "was built", "be + 过去分词"], ["m", "in 1998", "状语"], ["x", "(by the government).", "by + 动作发出者，常省略"]], "z": "这座桥建于 1998 年。", "n": ""}, {"t": "tbl", "head": ["时态", "主动", "被动"], "rows": [["一般现在", "`They make cars.`", "`Cars **are made**.`"], ["一般过去", "`They made cars.`", "`Cars **were made**.`"], ["现在完成", "`They have made cars.`", "`Cars **have been made**.`"], ["将来", "`They will make cars.`", "`Cars **will be made**.`"], ["情态", "`They can make cars.`", "`Cars **can be made**.`"]]}, {"t": "box", "k": "use", "x": "**什么时候该用被动**\n① 不知道或不必说谁干的：`My bike was stolen last night.`\n② 动作对象才是重点：`English is spoken in many countries.`\n③ 正式、客观的书面语——说明文、报告、新闻大量使用：`It is generally believed that…` / `Measures should be taken to…`"}, {"t": "box", "k": "trap", "x": "不及物动词没有被动（没有宾语可以上位）：`✗ The accident was happened.` → `✓ The accident happened.` 同类还有 `occur, appear, rise, belong to, arrive`。"}]}, {"id": "g8", "no": "08", "part": "核心", "title": "情态动词", "sub": "给句子加上态度", "b": [{"t": "box", "k": "origin", "x": "`can, may, shall, will, must` 这一小撮属于「过去现在式动词」：它们今天的现在时形式，历史上是**过去时**形式，而古英语过去时第三人称本来就不加词尾。所以它们保留了三个怪癖：**不加 -s、后面直接跟动词原形、否定和疑问不用 do**。"}, {"t": "tbl", "head": ["情态动词", "含义", "例句"], "rows": [["`can / could`", "能力；请求（could 更客气）", "`I can swim.` `Could you help me?`"], ["`may / might`", "也许；正式的许可", "`It may rain.` `May I come in?`"], ["`must`", "必须（说话人的要求）；一定是（有把握的推测）", "`You must wear a helmet.` `He must be at home — the light is on.`"], ["`have to`", "不得不（客观情况逼的）", "`I have to work this weekend.`"], ["`should / ought to`", "应该（建议）", "`You should see a doctor.`"], ["`would`", "客气；过去的习惯", "`Would you mind…?` `He would sit there for hours.`"], ["`need / dare`", "需要 / 敢", "`You needn't worry.`"]]}, {"t": "box", "k": "trap", "x": "**两组极易混的否定**\n`mustn't` ＝ 禁止（一定不能）；`needn't / don't have to` ＝ 不必（可做可不做）。\n`can't` 作推测 ＝ 不可能（把握很大）；`may not` ＝ 可能不（把握较小）。"}, {"t": "h", "x": "情态动词 + have done：对过去的评价"}, {"t": "ex", "e": "He <b>must have forgotten</b> the meeting.", "z": "他一定是忘了（对过去有把握的推测）"}, {"t": "ex", "e": "You <b>should have told</b> me earlier.", "z": "你本该早点告诉我（但你没有，带责备）"}, {"t": "ex", "e": "She <b>can't have seen</b> him.", "z": "她不可能见过他"}]}, {"id": "g9", "no": "09", "part": "核心", "title": "非谓语动词", "sub": "一句只能有一个谓语，多出来的必须变形上交", "b": [{"t": "p", "x": "这是中英差距最大的一章。中文可以一路动词串到底：「我昨天去商店买了点东西回家做饭。」英语不行——**一个句子只允许一个谓语动词**，其他动词必须换成三种非谓语形式之一，否则就是病句。"}, {"t": "rw", "items": [[0, "I went to the shop bought some food.", "两个谓语动词并排，典型中式错误"], [1, "I went to the shop <b>and bought</b> some food.", "办法一：加连词"], [1, "I went to the shop <b>to buy</b> some food.", "办法二：变不定式"]]}, {"t": "tbl", "head": ["形式", "核心语感", "在句中能当"], "rows": [["**`to do`** 不定式", "**未发生的、目的、打算**", "主语、宾语、定语、目的状语"], ["**`doing`** 动名词 / 现在分词", "**正在进行、主动、经常性**", "主语、宾语；定语、状语"], ["**`done`** 过去分词", "**已完成、被动**", "定语、状语、补足语"]]}, {"t": "h", "x": "不定式 to do"}, {"t": "ex", "e": "<b>To learn</b> a language takes time.", "z": "当主语（更常见：It takes time to learn a language.）"}, {"t": "ex", "e": "She decided <b>to accept</b> the offer.", "z": "当宾语"}, {"t": "ex", "e": "I have a lot of work <b>to do</b>.", "z": "当定语，放在名词后面"}, {"t": "ex", "e": "He got up early <b>to catch</b> the first train.", "z": "当目的状语——写作里最常用"}, {"t": "h", "x": "动名词 doing"}, {"t": "ex", "e": "<b>Reading</b> is my favourite hobby.", "z": "当主语"}, {"t": "ex", "e": "He is good at <b>solving</b> problems.", "z": "介词后面只能跟动名词"}, {"t": "box", "k": "trap", "x": "**只跟 doing 的动词**：`enjoy · finish · mind · avoid · suggest · practise · consider · imagine · admit · keep · give up · can't help · look forward to · be used to`\n**只跟 to do 的动词**：`want · hope · wish · decide · plan · agree · promise · refuse · manage · afford · offer · pretend`"}, {"t": "box", "k": "trap", "x": "**两个都能跟，但意思不同**\n`remember to do` 记得去做（还没做）／ `remember doing` 记得做过（已做）\n`stop to do` 停下来去做另一件事／ `stop doing` 停止正在做的事\n`try to do` 努力去做／ `try doing` 试着做做看\n`forget to do` 忘了要做／ `forget doing` 忘了做过"}, {"t": "h", "x": "分词：doing 和 done 的分工"}, {"t": "p", "x": "一条判断线：**被修饰的名词是主动做还是被动挨**。主动用 doing，被动用 done。"}, {"t": "dg", "parts": [["s", "the boy", "名词"], ["v", "playing football", "doing · 男孩主动在踢"]], "z": "", "n": ""}, {"t": "dg", "parts": [["s", "a letter", "名词"], ["o", "written in English", "done · 信是被写的"]], "z": "踢足球的男孩 ／ 一封用英文写的信", "n": "同一词根语感相反：an interesting book（书让人感兴趣）／ an interested reader（读者被引起兴趣）。同类：exciting/excited, boring/bored, surprising/surprised, tiring/tired。"}, {"t": "h", "x": "分词作状语：写作提分句型"}, {"t": "p", "x": "把两句话压成一句，句子立刻有层次。条件是**两个动作的主语必须是同一个**。"}, {"t": "ex", "e": "<b>Having finished</b> his homework, he went out to play.", "z": "= After he had finished… 做完作业后，他出去玩了"}, {"t": "ex", "e": "<b>Faced with</b> so many difficulties, the team never gave up.", "z": "= Though they were faced with… 面对重重困难，团队从未放弃"}, {"t": "box", "k": "trap", "x": "**垂悬分词。**`✗ Walking down the street, the tree looked beautiful.` — 字面意思是「树在街上走」。分词的逻辑主语必须是主句主语：`✓ Walking down the street, **I** thought the tree looked beautiful.`"}]}, {"id": "g10", "no": "10", "part": "进阶", "title": "三大从句", "sub": "把一个完整句子塞进另一个句子当零件", "b": [{"t": "p", "x": "从句 ＝ **一个有主有谓的完整句子，被降级成了某个成分**。降级成名词用的叫名词性从句，降级成形容词用的叫定语从句，降级成副词用的叫状语从句。这一章学完，长难句就基本通了。"}, {"t": "h", "x": "一 · 定语从句：修饰名词"}, {"t": "p", "x": "中文「我昨天买的那本书」修饰语在前，英语必须**放到名词后面**，并用一个关系词挂上去。"}, {"t": "dg", "parts": [["s", "The book", "先行词"], ["m", "that I bought yesterday", "定语从句 · 修饰 book"], ["v", "is", "主句谓语"], ["p", "very useful.", "表语"]], "z": "我昨天买的那本书很有用。", "n": "找主句的窍门：把从句整块括起来划掉，剩下 The book is very useful. 就是骨架。"}, {"t": "tbl", "head": ["关系词", "先行词是", "在从句中当", "例"], "rows": [["`who`", "人", "主语", "`the man who called me`"], ["`whom`", "人", "宾语（可省）", "`the man (whom) I met`"], ["`which`", "物", "主语或宾语", "`the house which stands there`"], ["`that`", "人或物", "主语或宾语", "`the thing that matters`"], ["`whose`", "人或物", "定语（谁的）", "`a student whose parents are doctors`"], ["`where / when / why`", "地点 / 时间 / 原因", "状语", "`the city where I was born`"]]}, {"t": "box", "k": "trap", "x": "**三个高频错**\n① 关系词不能重复：`✗ the book that I bought **it** yesterday`——that 已经代替了 book。\n② 逗号的区别：`My brother **who** lives in Beijing is a doctor.`（我有好几个哥哥，说的是北京那个）／ `My brother, **who** lives in Beijing, is a doctor.`（我只有一个哥哥，顺带补充）。**有逗号的非限制性从句不能用 that。**\n③ 介词提前时只能用 whom / which：`the person **to whom** I spoke`，不能用 that。"}, {"t": "h", "x": "二 · 名词性从句：整句话当名词用"}, {"t": "dg", "parts": [["s", "What he said", "主语从句"], ["v", "surprised", "V"], ["o", "everyone.", "O"]], "z": "", "n": ""}, {"t": "dg", "parts": [["s", "I", "S"], ["v", "believe", "V"], ["o", "that he will succeed.", "宾语从句"]], "z": "他说的话让所有人吃惊。／ 我相信他会成功。", "n": ""}, {"t": "box", "k": "trap", "x": "**that 还是 what**\n`that` 只是个引子，本身不作成分，从句本身是完整的：`I know **that** he is right.`\n`what` 等于 the thing that，它要在从句里当主语或宾语，所以从句是残缺的：`I don't know **what** he wants ___.`（wants 缺宾语）"}, {"t": "box", "k": "trap", "x": "**宾语从句用陈述语序。**`✗ Could you tell me where **is the station**?` → `✓ Could you tell me where **the station is**?` 一旦变成从句，就不再用疑问句的倒装。"}, {"t": "h", "x": "三 · 状语从句：给主句加背景"}, {"t": "tbl", "head": ["类型", "常用连词", "例句"], "rows": [["时间", "`when, while, as, before, after, since, until, as soon as`", "`As soon as he arrived, he called me.`"], ["条件", "`if, unless, as long as, in case`", "`Unless you hurry, you will be late.`"], ["原因", "`because, since, as, now that`", "`Since it was late, we went home.`"], ["让步", "`although, though, even if, while, no matter how`", "`Although he is young, he is very capable.`"], ["目的", "`so that, in order that`", "`He spoke loudly so that everyone could hear.`"], ["结果", "`so…that, such…that`", "`It was so cold that the lake froze.`"], ["比较", "`than, as…as`", "`He works harder than I do.`"]]}, {"t": "box", "k": "trap", "x": "**中国学生第一大错 · 连词不能成双。**中文「虽然…但是…」「因为…所以…」成对，英语只能留一个。\n`✗ Although he was tired, **but** he kept working.`\n`✓ Although he was tired, he kept working.` ／ `✓ He was tired, **but** he kept working.`\n`✗ Because it rained, **so** we stayed home.` → 去掉 so。"}, {"t": "box", "k": "use", "x": "写作里每段至少一个从句，是「语言有层次」最直接的体现。最保险的三个：`Although…, …`（让步）、`…, which…`（补充说明）、`…so that…`（目的）。全用简单句的作文，内容再好也上不去。"}]}, {"id": "g11", "no": "11", "part": "进阶", "title": "虚拟 · 倒装 · 强调", "sub": "三种花样，学会立刻有水平", "b": [{"t": "h", "x": "虚拟语气：说不是真的的事"}, {"t": "box", "k": "origin", "x": "古英语有一整套独立的虚拟式词尾，后来几乎全并入了过去时形式，只剩 be 动词还倔强地保留着虚拟式的 `were`。所以 `If I **were** you` 不是语法错误，而是**一千年前的化石**。同样，`I suggest that he **go**` 里那个不加 -s 的 go，也是虚拟式原形的残留。"}, {"t": "p", "x": "核心逻辑：**把时态整体往过去推一格，表示这不是真的**。"}, {"t": "tbl", "head": ["假设的是", "从句用", "主句用", "例"], "rows": [["与现在事实相反", "`过去式`（be 一律 were）", "`would / could / might + 原形`", "`If I **were** you, I **would accept** the offer.`"], ["与过去事实相反", "`had done`", "`would have done`", "`If he **had studied** harder, he **would have passed**.`"], ["与将来事实相反", "`were to do / should do`", "`would do`", "`If it **were to rain** tomorrow, the match **would be** cancelled.`"]]}, {"t": "p", "x": "另外两个必会结构："}, {"t": "ex", "e": "I <b>wish</b> I <b>had</b> more time.", "z": "wish 后面用虚拟：但愿我有更多时间（其实没有）"}, {"t": "ex", "e": "He suggested that the meeting <b>(should) be</b> postponed.", "z": "suggest / insist / demand / propose / recommend / order 后的从句用「should + 原形」，should 可省"}, {"t": "h", "x": "倒装：把状语提到句首，句子跟着翻个身"}, {"t": "p", "x": "否定词或「只有」放到句首时，后面必须**把助动词提到主语前**。这是书面语的强调手段。"}, {"t": "ex", "e": "<b>Never</b> have I seen such a beautiful sunset.", "z": "正常语序：I have never seen…"}, {"t": "ex", "e": "<b>Only by</b> working together <b>can we</b> solve this problem.", "z": "写作结尾句的万能句型"}, {"t": "ex", "e": "<b>Not only</b> did he finish the task, <b>but he also</b> helped others.", "z": ""}, {"t": "p", "x": "触发倒装的词：`never · seldom · rarely · hardly · little · not until · no sooner · only + 状语 · not only`"}, {"t": "h", "x": "强调：It is … that …"}, {"t": "p", "x": "把想突出的成分夹在 `It is/was` 和 `that` 中间，其余原样照抄。"}, {"t": "ex", "e": "原句：Tom broke the window yesterday.", "z": ""}, {"t": "ex", "e": "<b>It was Tom that</b> broke the window yesterday.", "z": "强调是「汤姆」干的"}, {"t": "ex", "e": "<b>It was yesterday that</b> Tom broke the window.", "z": "强调是「昨天」"}, {"t": "p", "x": "强调人时 that 可换成 who。判断是不是强调句：把 `It is/was … that` 抽掉，剩下的仍是完整句子，就是强调句。"}]}, {"id": "g12", "no": "12", "part": "实战", "title": "最常犯的十五个错", "sub": "写完一段话照这张单子扫一遍", "b": [{"t": "tbl", "head": ["错", "对", "为什么"], "rows": [["`I very like it.`", "`I like it very much.`", "very 不能修饰动词"], ["`He very tired.`", "`He is very tired.`", "句子必须有动词"], ["`Although…, but…`", "`Although…, ….`", "连词只留一个"], ["`He go to school.`", "`He goes to school.`", "第三人称单数 -s"], ["`I have seen him yesterday.`", "`I saw him yesterday.`", "明确过去时间不能用完成时"], ["`many peoples / advices`", "`many people / much advice`", "不可数名词不加 -s"], ["`I am interesting in it.`", "`I am interested in it.`", "人被引起兴趣，用 -ed"], ["`Everyone are happy.`", "`Everyone is happy.`", "everyone / each / nobody 作单数"], ["`He suggested me to go.`", "`He suggested that I (should) go.`", "suggest 不接 sb. to do"], ["`look forward to hear from you`", "`…to hearing from you`", "这里 to 是介词"], ["`If it will rain, …`", "`If it rains, …`", "主将从现"], ["`The reason is because…`", "`The reason is that…`", "reason 和 because 语义重复"], ["`I went to shop and bought…`", "`I went to **the** shop and bought…`", "单数可数名词前必须有限定词"], ["`With the development of society, makes people…`", "`With the development of society, people…`", "介词短语不能当主语，句子缺主语"], ["`It's color is red.`", "`Its color is red.`", "its = 它的；it's = it is"]]}, {"t": "box", "k": "use", "x": "**两分钟检查清单**\n① 每句话都有一个且只有一个谓语动词吗？\n② 主语是第三人称单数吗？动词加 -s 了吗？\n③ 整段时态统一吗？讲过去的事全是过去时吗？\n④ 每个单数可数名词前面有 a / the / my 吗？\n⑤ 有没有 although 和 but 同时出现？\n⑥ 形容词和副词有没有用反？"}]}, {"id": "g13", "no": "13", "part": "实战", "title": "怎么练才有用", "sub": "语法是用出来的，不是背出来的", "b": [{"t": "p", "x": "看懂语法和写对句子之间隔着很远。三个投入产出比最高的练法："}, {"t": "h", "x": "一 · 拆句子（练读）"}, {"t": "p", "x": "找任何一篇英文，挑十个长句，每句三步：**圈出谓语动词 → 划掉所有从句和介词短语 → 写出剩下的骨架属于第 03 章哪一种**。坚持一周，长难句的恐惧就没了。"}, {"t": "h", "x": "二 · 合并句子（练写）"}, {"t": "p", "x": "把两个简单句合成一个复杂句，是从「能写」到「写得好」的关键训练。同一对句子用不同方式合并："}, {"t": "ex", "e": "原句：The man is my teacher. He is standing there.", "z": ""}, {"t": "ex", "e": "The man <b>who is standing there</b> is my teacher.", "z": "定语从句"}, {"t": "ex", "e": "The man <b>standing there</b> is my teacher.", "z": "分词作定语，更简洁"}, {"t": "h", "x": "三 · 自纠（练准）"}, {"t": "p", "x": "写完一段**不要立刻对答案**，先拿第 12 章那六条清单自己扫一遍，把改动记在旁边。自己抓出来的错，比别人指出来的记得牢十倍。"}, {"t": "box", "k": "use", "x": "和这个 app 配合着用：语法这一页负责「为什么这么写」，「写作」标签的句型卡负责「照着写」，「单词」标签的 900 组搭配负责「填对介词」。三样凑齐，一篇作文的语言分就稳了。"}]}];

function gfmt(x){
  return esc(String(x))
    .replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, '<span class="g-en">$1</span>')
    .replace(/\n/g, "<br>");
}

function gblock(bk){
  if(bk.t === "h")   return '<div class="gh">' + gfmt(bk.x) + '</div>';
  if(bk.t === "p")   return '<p class="gp">' + gfmt(bk.x) + '</p>';
  if(bk.t === "box") return '<div class="gbox ' + bk.k + '"><b class="gt">' + (GLABEL[bk.k] || "") + '</b>' + gfmt(bk.x) + '</div>';
  if(bk.t === "ex")  return '<div class="gex"><span class="e">' + gfmt(bk.e) + '</span>' +
                            (bk.z ? '<span class="z">' + gfmt(bk.z) + '</span>' : '') + '</div>';
  if(bk.t === "ul")  return '<ul class="gul">' + bk.items.map(i => '<li>' + gfmt(i) + '</li>').join('') + '</ul>';
  if(bk.t === "pills") return '<div class="gpills">' + bk.items.map(i => '<span class="gpill">' + esc(i) + '</span>').join('') + '</div>';
  if(bk.t === "rw")  return '<div class="grw">' + bk.items.map(r =>
      '<div class="' + (r[0] ? 'yes' : 'no') + '"><span class="mk">' + (r[0] ? '\u2713' : '\u2717') + '</span>' +
      '<span><span class="s">' + gfmt(r[1]) + '</span>' +
      (r[2] ? '<span class="why">' + gfmt(r[2]) + '</span>' : '') + '</span></div>').join('') + '</div>';
  if(bk.t === "dg")  return '<div class="gdg"><div class="gdgrow">' + bk.parts.map(pt =>
      '<span class="gck ' + pt[0] + '"><span class="w">' + gfmt(pt[1]) + '</span>' +
      '<span class="bar"></span><span class="lb">' + esc(pt[2]) + '</span></span>').join('') + '</div>' +
      (bk.z ? '<div class="gz">' + gfmt(bk.z) + '</div>' : '') +
      (bk.n ? '<div class="gn">' + gfmt(bk.n) + '</div>' : '') + '</div>';
  if(bk.t === "tbl") return '<div class="gtw"><table class="gtbl"><thead><tr>' +
      bk.head.map(x => '<th>' + gfmt(x) + '</th>').join('') + '</tr></thead><tbody>' +
      bk.rows.map(r => '<tr>' + r.map(x => '<td>' + gfmt(x) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>';
  return "";
}

function renderGramList(){
  const done = GRAM.filter(c => gread[c.id]).length;
  stage.innerHTML =
    '<div class="glist">' + GRAM.map(c =>
      '<button data-gchap="' + c.id + '">' +
        '<span class="gpart">' + esc(c.part) + '</span>' +
        '<span class="gname">' + esc(c.no) + ' · ' + esc(c.title) + '<small>' + esc(c.sub) + '</small></span>' +
        '<span class="gtick' + (gread[c.id] ? ' on' : '') + '">' + (gread[c.id] ? '\u2713' : '') + '</span>' +
      '</button>').join('') + '</div>' +
    '<div class="how">' +
      '<span><b>怎么用</b>：按顺序读，每章都是「形式 → 来源 → 用在哪」三块。点开一章就会打勾。</span>' +
      '<span>时间紧就只读 <b>03 五种句型 · 06 时态 · 09 非谓语 · 10 三大从句</b>，这四章覆盖写作里九成的语法需求。</span>' +
      '<span>读过 <b>' + done + ' / ' + GRAM.length + '</b> 章。语法这一页讲「为什么这么写」，「写作」标签的句型卡负责「照着写」。</span>' +
    '</div>';
}

function renderGramChapter(){
  const c = GRAM.filter(x => x.id === gchap)[0];
  if(!c){ gchap = null; renderGramList(); return; }
  let idx = -1;
  GRAM.forEach((x, i) => { if(x.id === c.id) idx = i; });
  const prev = GRAM[idx - 1], nx = GRAM[idx + 1];
  stage.innerHTML =
    '<div class="backline"><button class="linkish" data-gback="1">\u2190 返回目录</button>' +
      '<span class="gnum">' + esc(c.no) + ' / 13</span></div>' +
    '<div class="card gdoc">' +
      '<h3>' + esc(c.title) + '</h3>' +
      '<div class="gsub">' + esc(c.sub) + '</div>' +
      c.b.map(gblock).join('') +
    '</div>' +
    '<div class="gnav">' +
      (prev ? '<button class="btn" data-gchap="' + prev.id + '">\u2190 ' + esc(prev.title) + '</button>' : '') +
      (nx ? '<button class="btn primary" data-gchap="' + nx.id + '">' + esc(nx.title) + ' \u2192</button>'
          : '<button class="btn" data-gback="1">回到目录</button>') +
    '</div>';
}

function renderGram(){ if(gchap) renderGramChapter(); else renderGramList(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.gchap !== undefined){
    gchap = b.dataset.gchap;
    if(!gread[gchap]){ gread[gchap] = 1; gsave(); }
    render();
    window.scrollTo(0, 0);
    return;
  }
  if(b.dataset.gback !== undefined){ gchap = null; render(); window.scrollTo(0, 0); return; }
});

/* ---------- android host: over-the-air content updates ---------- */
const HOST = window.AndroidHost || null;
let cfg = null;
let reloadReady = false;

function hostState(){
  if(!HOST) return null;
  try{ return JSON.parse(HOST.getState()); }catch(e){ return null; }
}

function banner(text, action){
  const el = document.getElementById("banner");
  if(!text){ el.hidden = true; return; }
  el.className = "banner";
  el.innerHTML = '<span>'+esc(text)+'</span>'+(action?'<button id="b-act">'+esc(action)+'</button>':'');
  el.hidden = false;
}

window.__update = function(res, manual){
  cfg = hostState();
  if(mode==="cfg") render();
  if(res && res.ok && res.updated){
    reloadReady = true;
    banner((res.notes ? res.notes+" · " : "")+"新内容已就绪", "立即生效");
  } else if(manual){
    banner(res && res.message ? res.message : "检查失败", null);
    setTimeout(()=>banner(null), 4000);
  }
};



document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="b-act"){ if(reloadReady){ location.reload(); } else { banner(null); } return; }
  if(!HOST) return;
  if(b.id==="cfg-save"){
    const v = document.getElementById("cfg-src").value;
    HOST.setSource(v);
    document.getElementById("cfg-status").textContent = "正在检查…";
    HOST.checkNow();
    setTimeout(()=>{ cfg = hostState(); }, 300);
  } else if(b.id==="cfg-reset"){
    HOST.resetBuiltin();
    cfg = hostState();
    render();
    banner("已恢复内置版本，重启应用后生效", null);
  }
});

if(HOST){ cfg = hostState(); }

goSection("word");
</script>
